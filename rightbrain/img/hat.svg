<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="哈一口气，帽子被吹走啦"><style>
.bob{animation:bob 2.4s ease-in-out infinite}.bob2{animation:bob 2.4s ease-in-out -1.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.pulse{animation:pl 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.spin{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes sp{to{transform:rotate(360deg)}}
.fall{animation:fa 1.2s linear infinite}.f2{animation-delay:-.4s}.f3{animation-delay:-.8s}
@keyframes fa{from{transform:translateY(-24px);opacity:0}25%{opacity:1}to{transform:translateY(30px);opacity:0}}
.drift{animation:dr 4s ease-in-out infinite}
@keyframes dr{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}
.flash{animation:fl 1s steps(2) infinite}
@keyframes fl{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="320" height="240" rx="24" fill="#FFF8E6"/><ellipse cx="160" cy="218" rx="130" ry="10" fill="#F3DEC4"/><g class="bob2"><rect x="70" y="152" width="40" height="38" rx="13" fill="#2EA868"/><circle cx="90" cy="130" r="23" fill="#FFD9B8"/><path d="M67 127 q2 -24 24 -24 q20 0 23 20 q-9 -9 -20 -7 q-13 2 -27 11z" fill="#2B2B2B"/><circle cx="82" cy="131" r="3" fill="#2B2B2B"/><circle cx="98" cy="131" r="3" fill="#2B2B2B"/><circle cx="76" cy="139" r="4" fill="#FFB0A0" opacity=".7"/><circle cx="104" cy="139" r="4" fill="#FFB0A0" opacity=".7"/><ellipse cx="90" cy="144" rx="6" ry="7" fill="#C2413B"/></g><g fill="none" stroke="#9DB7DA" stroke-width="4" stroke-linecap="round"><path d="M122 140 q20 -6 40 0"/><path d="M122 152 q24 0 46 10"/></g><g class="drift"><g transform="translate(180.0 50.0) rotate(-15 50.0 50.0) scale(1.0)"><ellipse cx="50" cy="66" rx="44" ry="14" fill="#E9C46A"/><path d="M28 64q0-34 22-34t22 34z" fill="#E9C46A"/><rect x="28" y="54" width="44" height="9" fill="#E5484D"/><path d="M28 64q22 8 44 0" fill="none" stroke="#C9A24A" stroke-width="2"/></g></g><g class="pulse"><path d="M100 60.0 l-10 16 l22 -14z" fill="#fff" stroke="#2F5DA8" stroke-width="3" stroke-linejoin="round"/><rect x="64.0" y="18.0" width="92" height="44" rx="22.0" fill="#fff" stroke="#2F5DA8" stroke-width="3"/><rect x="96" y="58.0" width="16" height="6" fill="#fff"/><text x="110" y="47.92" text-anchor="middle" font-size="22" font-weight="900" fill="#2F5DA8" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif">哈——</text></g></svg>