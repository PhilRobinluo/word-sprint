<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="吸一口气，数到六"><style>
.bob{animation:bob 2.4s ease-in-out infinite}.bob2{animation:bob 2.4s ease-in-out -1.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.pulse{animation:pl 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.spin{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes sp{to{transform:rotate(360deg)}}
.fall{animation:fa 1.2s linear infinite}.f2{animation-delay:-.4s}.f3{animation-delay:-.8s}
@keyframes fa{from{transform:translateY(-24px);opacity:0}25%{opacity:1}to{transform:translateY(30px);opacity:0}}
.drift{animation:dr 4s ease-in-out infinite}
@keyframes dr{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}
.flash{animation:fl 1s steps(2) infinite}
@keyframes fl{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="320" height="240" rx="24" fill="#EEF5FF"/><ellipse cx="160" cy="218" rx="130" ry="10" fill="#DCE8F7"/><g class="bob2"><rect x="100" y="152" width="40" height="38" rx="13" fill="#9C6ADE"/><circle cx="120" cy="130" r="23" fill="#FFD9B8"/><path d="M97 127 q2 -24 24 -24 q20 0 23 20 q-9 -9 -20 -7 q-13 2 -27 11z" fill="#2B2B2B"/><circle cx="112" cy="131" r="3" fill="#2B2B2B"/><circle cx="128" cy="131" r="3" fill="#2B2B2B"/><circle cx="106" cy="139" r="4" fill="#FFB0A0" opacity=".7"/><circle cx="134" cy="139" r="4" fill="#FFB0A0" opacity=".7"/><ellipse cx="120" cy="144" rx="6" ry="7" fill="#C2413B"/></g><g fill="none" stroke="#9DB7DA" stroke-width="4" stroke-linecap="round"><path d="M200 130 q-20 -4 -40 0"/><path d="M204 146 q-24 0 -44 6"/></g><g class="pulse"><g transform="translate(195.0 95.0) rotate(0 45.0 45.0) scale(0.9)"><circle cx="50" cy="44" r="34" fill="#E0A400" opacity=".18"/><text x="50" y="62" text-anchor="middle" font-size="54" font-family="Fredoka,'Baloo 2','Arial Rounded MT Bold',Arial,sans-serif" font-weight="700" fill="#E0A400">6</text><circle cx="22" cy="80" r="4" fill="#E0A400"/><circle cx="36" cy="80" r="4" fill="#E0A400"/><circle cx="50" cy="80" r="4" fill="#E0A400"/><circle cx="64" cy="80" r="4" fill="#E0A400"/><circle cx="78" cy="80" r="4" fill="#E0A400"/><circle cx="22" cy="90" r="4" fill="#E0A400"/></g></g><g class="pulse"><path d="M110 54.0 l-10 16 l22 -14z" fill="#fff" stroke="#2F5DA8" stroke-width="3" stroke-linejoin="round"/><rect x="74.0" y="12.0" width="92" height="44" rx="22.0" fill="#fff" stroke="#2F5DA8" stroke-width="3"/><rect x="106" y="52.0" width="16" height="6" fill="#fff"/><text x="120" y="41.92" text-anchor="middle" font-size="22" font-weight="900" fill="#2F5DA8" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif">吸——</text></g></svg>