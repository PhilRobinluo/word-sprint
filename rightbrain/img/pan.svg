<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="平底锅像一个大盘子"><style>
.bob{animation:bob 2.4s ease-in-out infinite}.bob2{animation:bob 2.4s ease-in-out -1.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.pulse{animation:pl 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.spin{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes sp{to{transform:rotate(360deg)}}
.fall{animation:fa 1.2s linear infinite}.f2{animation-delay:-.4s}.f3{animation-delay:-.8s}
@keyframes fa{from{transform:translateY(-24px);opacity:0}25%{opacity:1}to{transform:translateY(30px);opacity:0}}
.drift{animation:dr 4s ease-in-out infinite}
@keyframes dr{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}
.flash{animation:fl 1s steps(2) infinite}
@keyframes fl{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="320" height="240" rx="24" fill="#FFF4EC"/><ellipse cx="160" cy="218" rx="130" ry="10" fill="#F3DEC4"/><g class="bob"><g transform="translate(55.0 45.0) rotate(0 95.0 95.0) scale(1.9)"><ellipse cx="40" cy="56" rx="32" ry="18" fill="#444"/><ellipse cx="40" cy="52" rx="28" ry="13" fill="#666"/><rect x="66" y="48" width="32" height="9" rx="4" fill="#8A5A3A" transform="rotate(-8 66 52)"/></g></g><g class=""><g transform="translate(95.0 107.0) rotate(0 25.0 25.0) scale(0.5)"><path d="M50 12c18 0 32 30 32 48s-14 30-32 30-32-12-32-30 14-48 32-48z" fill="#FFF8EC" stroke="#E8D6BA" stroke-width="3"/><ellipse cx="40" cy="40" rx="6" ry="10" fill="#fff"/></g></g><g class="pulse"><path d="M240 64.0 l-10 16 l22 -14z" fill="#fff" stroke="#2F5DA8" stroke-width="3" stroke-linejoin="round"/><rect x="215.0" y="22.0" width="70" height="44" rx="22.0" fill="#fff" stroke="#2F5DA8" stroke-width="3"/><rect x="236" y="62.0" width="16" height="6" fill="#fff"/><text x="250" y="51.92" text-anchor="middle" font-size="22" font-weight="900" fill="#2F5DA8" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif">盘！</text></g></svg>