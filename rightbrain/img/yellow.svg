<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="走夜路，提着一盏黄黄的灯笼"><style>
.bob{animation:bob 2.4s ease-in-out infinite}.bob2{animation:bob 2.4s ease-in-out -1.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.pulse{animation:pl 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.spin{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes sp{to{transform:rotate(360deg)}}
.fall{animation:fa 1.2s linear infinite}.f2{animation-delay:-.4s}.f3{animation-delay:-.8s}
@keyframes fa{from{transform:translateY(-24px);opacity:0}25%{opacity:1}to{transform:translateY(30px);opacity:0}}
.drift{animation:dr 4s ease-in-out infinite}
@keyframes dr{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}
.flash{animation:fl 1s steps(2) infinite}
@keyframes fl{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="320" height="240" rx="24" fill="#2E3A66"/><g fill="#fff" opacity=".8"><circle cx="40" cy="40" r="2"/><circle cx="90" cy="24" r="1.6"/><circle cx="250" cy="54" r="2"/><circle cx="210" cy="20" r="1.6"/></g><g class=""><g transform="translate(240.0 16.0) rotate(0 30.0 30.0) scale(0.6)"><path d="M64 14a34 34 0 1 0 22 50a28 28 0 1 1-22-50z" fill="#FFE27A"/></g></g><path d="M0 214 q160 -24 320 0 V240 H0z" fill="#4A567F"/><g class="bob2"><rect x="100" y="162" width="40" height="38" rx="13" fill="#FFC93C"/><circle cx="120" cy="140" r="23" fill="#FFD9B8"/><path d="M97 137 q2 -24 24 -24 q20 0 23 20 q-9 -9 -20 -7 q-13 2 -27 11z" fill="#2B2B2B"/><circle cx="112" cy="141" r="3" fill="#2B2B2B"/><circle cx="128" cy="141" r="3" fill="#2B2B2B"/><circle cx="106" cy="149" r="4" fill="#FFB0A0" opacity=".7"/><circle cx="134" cy="149" r="4" fill="#FFB0A0" opacity=".7"/><path d="M114 152 q6 7 12 0" fill="none" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round"/></g><path d="M146 150 l30 -26" stroke="#8A5A3A" stroke-width="4"/><g class="sway"><g transform="translate(152.0 112.0) rotate(0 38.0 38.0) scale(0.76)"><path d="M50 6v10" stroke="#8A5A3A" stroke-width="4"/><rect x="36" y="14" width="28" height="8" rx="3" fill="#B97A4A"/><ellipse cx="50" cy="50" rx="30" ry="28" fill="#FFC93C"/><path d="M50 22v56M34 26q-10 24 0 48M66 26q10 24 0 48" fill="none" stroke="#E2A400" stroke-width="3"/><rect x="36" y="76" width="28" height="8" rx="3" fill="#B97A4A"/><path d="M44 84v10M50 84v12M56 84v10" stroke="#E5484D" stroke-width="3"/></g></g><g class="pulse"><path d="M80 60.0 l-10 16 l22 -14z" fill="#fff" stroke="#2F5DA8" stroke-width="3" stroke-linejoin="round"/><rect x="55.0" y="18.0" width="70" height="44" rx="22.0" fill="#fff" stroke="#2F5DA8" stroke-width="3"/><rect x="76" y="58.0" width="16" height="6" fill="#fff"/><text x="90" y="47.92" text-anchor="middle" font-size="22" font-weight="900" fill="#2F5DA8" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif">夜路</text></g></svg>