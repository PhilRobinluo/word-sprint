<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="挺起胸口，举起很重很重的东西"><style>
.bob{animation:bob 2.4s ease-in-out infinite}.bob2{animation:bob 2.4s ease-in-out -1.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.pulse{animation:pl 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.spin{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes sp{to{transform:rotate(360deg)}}
.fall{animation:fa 1.2s linear infinite}.f2{animation-delay:-.4s}.f3{animation-delay:-.8s}
@keyframes fa{from{transform:translateY(-24px);opacity:0}25%{opacity:1}to{transform:translateY(30px);opacity:0}}
.drift{animation:dr 4s ease-in-out infinite}
@keyframes dr{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}
.flash{animation:fl 1s steps(2) infinite}
@keyframes fl{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="320" height="240" rx="24" fill="#FFF1E6"/>
<ellipse cx="160" cy="216" rx="110" ry="9" fill="#F3D9C4"/>
<g class="bob">
 <rect x="52" y="44" width="216" height="10" rx="5" fill="#555"/>
 <rect x="40" y="26" width="18" height="46" rx="5" fill="#2B2B2B"/><rect x="262" y="26" width="18" height="46" rx="5" fill="#2B2B2B"/>
 <rect x="22" y="32" width="18" height="34" rx="5" fill="#444"/><rect x="280" y="32" width="18" height="34" rx="5" fill="#444"/>
 <path d="M126 140 l-24 -86 M194 140 l24 -86" stroke="#FFD9B8" stroke-width="16" stroke-linecap="round"/>
 <circle cx="110" cy="100" r="13" fill="#FFCAA0"/><circle cx="210" cy="100" r="13" fill="#FFCAA0"/>
 <rect x="122" y="136" width="76" height="62" rx="20" fill="#E5484D"/>
 <circle cx="160" cy="112" r="28" fill="#FFD9B8"/><path d="M132 106 q2 -28 28 -28 q26 0 28 24 q-12 -10 -28 -8 q-16 2 -28 12z" fill="#2B2B2B"/>
 <path d="M146 108 l8 3 M174 108 l-8 3" stroke="#2B2B2B" stroke-width="4" stroke-linecap="round"/>
 <rect x="150" y="122" width="20" height="8" rx="3" fill="#fff" stroke="#2B2B2B" stroke-width="2"/>
</g>
<g class="flash" fill="#7FB2E5"><path d="M108 74 q-6 10 0 14 q6 -4 0 -14z M216 74 q-6 10 0 14 q6 -4 0 -14z"/></g></svg>