<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="章鱼伸出八条腿，哎呀！"><style>
.bob{animation:bob 2.4s ease-in-out infinite}.bob2{animation:bob 2.4s ease-in-out -1.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.pulse{animation:pl 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.spin{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes sp{to{transform:rotate(360deg)}}
.fall{animation:fa 1.2s linear infinite}.f2{animation-delay:-.4s}.f3{animation-delay:-.8s}
@keyframes fa{from{transform:translateY(-24px);opacity:0}25%{opacity:1}to{transform:translateY(30px);opacity:0}}
.drift{animation:dr 4s ease-in-out infinite}
@keyframes dr{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}
.flash{animation:fl 1s steps(2) infinite}
@keyframes fl{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="320" height="240" rx="24" fill="#E9F3FF"/><ellipse cx="160" cy="218" rx="130" ry="10" fill="#D5E5F5"/><g class="bob"><g transform="translate(95.0 65.0) rotate(0 75.0 75.0) scale(1.5)"><g stroke="#B76BD9" stroke-width="7" stroke-linecap="round" fill="none"><path d="M24 60q-14 14-6 30M34 64q-8 16 0 28M44 66q-4 16 2 26M54 66q4 16-2 26M64 64q8 16 0 28M74 60q14 14 6 30M20 54q-16 6-16 20M80 54q16 6 16 20"/></g><ellipse cx="50" cy="40" rx="30" ry="28" fill="#C77DFF"/><circle cx="40" cy="40" r="4.5" fill="#2B2B2B"/><circle cx="60" cy="40" r="4.5" fill="#2B2B2B"/><circle cx="41" cy="39" r="1" fill="#fff"/><circle cx="61" cy="39" r="1" fill="#fff"/><path d="M42 54q8 6 16 0" fill="none" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round"/></g></g><g class="bob2"><rect x="32" y="172" width="40" height="38" rx="13" fill="#FFC93C"/><circle cx="52" cy="150" r="23" fill="#FFD9B8"/><path d="M29 147 q2 -24 24 -24 q20 0 23 20 q-9 -9 -20 -7 q-13 2 -27 11z" fill="#2B2B2B"/><circle cx="44" cy="151" r="3" fill="#2B2B2B"/><circle cx="60" cy="151" r="3" fill="#2B2B2B"/><circle cx="38" cy="159" r="4" fill="#FFB0A0" opacity=".7"/><circle cx="66" cy="159" r="4" fill="#FFB0A0" opacity=".7"/><ellipse cx="52" cy="164" rx="6" ry="7" fill="#C2413B"/></g><g class="pulse"><path d="M240 54.0 l-10 16 l22 -14z" fill="#fff" stroke="#2F5DA8" stroke-width="3" stroke-linejoin="round"/><rect x="204.0" y="12.0" width="92" height="44" rx="22.0" fill="#fff" stroke="#2F5DA8" stroke-width="3"/><rect x="236" y="52.0" width="16" height="6" fill="#fff"/><text x="250" y="41.92" text-anchor="middle" font-size="22" font-weight="900" fill="#2F5DA8" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif">哎呀！</text></g><g class=""><g transform="translate(270.0 180.0) rotate(0 20.0 20.0) scale(0.4)"><circle cx="50" cy="44" r="34" fill="#FF6F91" opacity=".18"/><text x="50" y="62" text-anchor="middle" font-size="54" font-family="Fredoka,'Baloo 2','Arial Rounded MT Bold',Arial,sans-serif" font-weight="700" fill="#FF6F91">8</text><circle cx="22" cy="80" r="4" fill="#FF6F91"/><circle cx="36" cy="80" r="4" fill="#FF6F91"/><circle cx="50" cy="80" r="4" fill="#FF6F91"/><circle cx="64" cy="80" r="4" fill="#FF6F91"/><circle cx="78" cy="80" r="4" fill="#FF6F91"/><circle cx="22" cy="90" r="4" fill="#FF6F91"/><circle cx="36" cy="90" r="4" fill="#FF6F91"/><circle cx="50" cy="90" r="4" fill="#FF6F91"/></g></g></svg>