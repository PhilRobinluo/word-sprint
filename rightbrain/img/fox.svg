<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="狐狸发现了一个宝箱"><style>
.bob{animation:bob 2.4s ease-in-out infinite}.bob2{animation:bob 2.4s ease-in-out -1.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.pulse{animation:pl 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.spin{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes sp{to{transform:rotate(360deg)}}
.fall{animation:fa 1.2s linear infinite}.f2{animation-delay:-.4s}.f3{animation-delay:-.8s}
@keyframes fa{from{transform:translateY(-24px);opacity:0}25%{opacity:1}to{transform:translateY(30px);opacity:0}}
.drift{animation:dr 4s ease-in-out infinite}
@keyframes dr{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}
.flash{animation:fl 1s steps(2) infinite}
@keyframes fl{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="320" height="240" rx="24" fill="#FFF4E6"/><ellipse cx="160" cy="218" rx="130" ry="10" fill="#F3DEC4"/><g class="bob"><g transform="translate(45.0 55.0) rotate(0 65.0 65.0) scale(1.3)"><path d="M14 18l22 18-10 16zM86 18l-22 18 10 16z" fill="#E8742C"/><path d="M18 30q32-10 64 0q4 26-32 52q-36-26-32-52z" fill="#F28C3C"/><path d="M26 50q12 4 24 30q12-26 24-30q-4 22-24 34q-20-12-24-34z" fill="#fff"/><circle cx="38" cy="46" r="3.5" fill="#2B2B2B"/><circle cx="62" cy="46" r="3.5" fill="#2B2B2B"/><circle cx="39" cy="45" r="1" fill="#fff"/><circle cx="63" cy="45" r="1" fill="#fff"/><circle cx="50" cy="76" r="5" fill="#2B2B2B"/></g></g><g class="pulse"><g transform="translate(180.0 110.0) rotate(0 50.0 50.0) scale(1.0)"><rect x="12" y="40" width="76" height="46" rx="6" fill="#B97A4A"/><path d="M12 40q0-26 38-26t38 26z" fill="#D49A62"/><rect x="12" y="38" width="76" height="6" fill="#FFC93C"/><rect x="44" y="40" width="12" height="16" rx="3" fill="#FFC93C"/><g fill="#FFC93C"><circle cx="30" cy="22" r="4"/><circle cx="72" cy="20" r="3"/></g></g></g><g class="pulse"><path d="M230 60.0 l-10 16 l22 -14z" fill="#fff" stroke="#2F5DA8" stroke-width="3" stroke-linejoin="round"/><rect x="183.0" y="18.0" width="114" height="44" rx="22.0" fill="#fff" stroke="#2F5DA8" stroke-width="3"/><rect x="226" y="58.0" width="16" height="6" fill="#fff"/><text x="240" y="47.92" text-anchor="middle" font-size="22" font-weight="900" fill="#2F5DA8" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif">发现了！</text></g></svg>