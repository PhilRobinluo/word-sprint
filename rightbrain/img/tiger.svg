<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="山里威风的「太哥」走过来，小动物让路"><style>
.bob{animation:bob 2.4s ease-in-out infinite}.bob2{animation:bob 2.4s ease-in-out -1.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.pulse{animation:pl 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.spin{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes sp{to{transform:rotate(360deg)}}
.fall{animation:fa 1.2s linear infinite}.f2{animation-delay:-.4s}.f3{animation-delay:-.8s}
@keyframes fa{from{transform:translateY(-24px);opacity:0}25%{opacity:1}to{transform:translateY(30px);opacity:0}}
.drift{animation:dr 4s ease-in-out infinite}
@keyframes dr{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}
.flash{animation:fl 1s steps(2) infinite}
@keyframes fl{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="320" height="240" rx="24" fill="#FFF4DC"/>
<path d="M0 200 q80 -60 160 -20 q80 -50 160 10 V240 H0z" fill="#CDE6B8"/>
<g class="bob">
 <ellipse cx="150" cy="176" rx="66" ry="40" fill="#FF9F2E"/>
 <circle cx="150" cy="110" r="56" fill="#FF9F2E"/>
 <circle cx="104" cy="66" r="16" fill="#FF9F2E"/><circle cx="196" cy="66" r="16" fill="#FF9F2E"/><circle cx="104" cy="66" r="8" fill="#FFE2C0"/><circle cx="196" cy="66" r="8" fill="#FFE2C0"/>
 <g fill="#2B2B2B"><path d="M140 58 h20 l-4 16 h-12z M126 64 l8 14 M174 64 l-8 14" stroke="#2B2B2B" stroke-width="5" stroke-linecap="round"/><path d="M96 104 l20 4 M96 120 l20 -2 M204 104 l-20 4 M204 120 l-20 -2" stroke="#2B2B2B" stroke-width="5" stroke-linecap="round"/></g>
 <ellipse cx="150" cy="130" rx="30" ry="20" fill="#FFE8CC"/>
 <path d="M124 98 l14 4 M176 98 l-14 4" stroke="#2B2B2B" stroke-width="4" stroke-linecap="round"/>
 <circle cx="132" cy="108" r="6" fill="#2B2B2B"/><circle cx="168" cy="108" r="6" fill="#2B2B2B"/>
 <path d="M144 122 h12 l-6 6z" fill="#E86A6A"/><path d="M150 128 v6 q-8 6 -14 0 M150 134 q8 6 14 0" fill="none" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round"/>
 <g stroke="#2B2B2B" stroke-width="6" stroke-linecap="round"><path d="M120 162 l10 14 M150 156 v16 M180 162 l-10 14"/></g>
</g>
<g transform="translate(262 176)"><ellipse cx="0" cy="14" rx="18" ry="16" fill="#fff" stroke="#ddd"/><ellipse cx="-6" cy="-14" rx="5" ry="16" fill="#fff" stroke="#ddd"/><ellipse cx="6" cy="-14" rx="5" ry="16" fill="#fff" stroke="#ddd"/><circle cx="-5" cy="8" r="2.5" fill="#2B2B2B"/><circle cx="5" cy="8" r="2.5" fill="#2B2B2B"/></g>
<g transform="translate(40 184)"><circle r="16" fill="#C98A4B"/><circle cx="-12" cy="-12" r="6" fill="#C98A4B"/><circle cx="12" cy="-12" r="6" fill="#C98A4B"/><circle cx="-5" cy="-2" r="2.5" fill="#2B2B2B"/><circle cx="5" cy="-2" r="2.5" fill="#2B2B2B"/></g></svg>