<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="玩具面包车开过来，嘀嘀"><style>
.bob{animation:bob 2.4s ease-in-out infinite}.bob2{animation:bob 2.4s ease-in-out -1.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.pulse{animation:pl 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.spin{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes sp{to{transform:rotate(360deg)}}
.fall{animation:fa 1.2s linear infinite}.f2{animation-delay:-.4s}.f3{animation-delay:-.8s}
@keyframes fa{from{transform:translateY(-24px);opacity:0}25%{opacity:1}to{transform:translateY(30px);opacity:0}}
.drift{animation:dr 4s ease-in-out infinite}
@keyframes dr{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}
.flash{animation:fl 1s steps(2) infinite}
@keyframes fl{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="320" height="240" rx="24" fill="#EAF7F6"/><rect x="0" y="196" width="320" height="44" fill="#C9CFD6"/><path d="M0 218h320" stroke="#fff" stroke-width="4" stroke-dasharray="20 16"/><g class="drift"><g transform="translate(75.0 65.0) rotate(0 85.0 85.0) scale(1.7)"><path d="M6 30q0-10 10-10h50q10 0 16 10l12 20v20H6z" fill="#2EB0A8"/><rect x="12" y="26" width="18" height="16" rx="3" fill="#7FB2E5"/><rect x="34" y="26" width="18" height="16" rx="3" fill="#7FB2E5"/><path d="M58 26h10l10 16H58z" fill="#7FB2E5"/><rect x="6" y="54" width="88" height="5" fill="#fff" opacity=".6"/><circle cx="26" cy="72" r="10" fill="#2B2B2B"/><circle cx="74" cy="72" r="10" fill="#2B2B2B"/><circle cx="26" cy="72" r="4" fill="#ccc"/><circle cx="74" cy="72" r="4" fill="#ccc"/></g></g><g class="pulse"><path d="M60 60.0 l-10 16 l22 -14z" fill="#fff" stroke="#2F5DA8" stroke-width="3" stroke-linejoin="round"/><rect x="24.0" y="18.0" width="92" height="44" rx="22.0" fill="#fff" stroke="#2F5DA8" stroke-width="3"/><rect x="56" y="58.0" width="16" height="6" fill="#fff"/><text x="70" y="47.92" text-anchor="middle" font-size="22" font-weight="900" fill="#2F5DA8" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif">玩具车</text></g></svg>