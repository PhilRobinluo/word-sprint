<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="伸出十根手指头，不疼"><style>
.bob{animation:bob 2.4s ease-in-out infinite}.bob2{animation:bob 2.4s ease-in-out -1.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.pulse{animation:pl 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.spin{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes sp{to{transform:rotate(360deg)}}
.fall{animation:fa 1.2s linear infinite}.f2{animation-delay:-.4s}.f3{animation-delay:-.8s}
@keyframes fa{from{transform:translateY(-24px);opacity:0}25%{opacity:1}to{transform:translateY(30px);opacity:0}}
.drift{animation:dr 4s ease-in-out infinite}
@keyframes dr{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}
.flash{animation:fl 1s steps(2) infinite}
@keyframes fl{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="320" height="240" rx="24" fill="#FFF6EC"/><ellipse cx="160" cy="218" rx="130" ry="10" fill="#F3DEC4"/><g class="sway"><g transform="translate(55.0 75.0) rotate(0 55.0 55.0) scale(1.1)"><path d="M30 90V46q0-6 6-6t6 6V20q0-6 6-6t6 6v24V14q0-6 6-6t6 6v32V22q0-6 6-6t6 6v40q0 28-24 28z" fill="#FFD9B8" stroke="#E2A97E" stroke-width="2"/><path d="M30 60q-10-14-18-6q6 10 18 28" fill="#FFD9B8" stroke="#E2A97E" stroke-width="2"/></g></g><g class="sway"><g transform="translate(155.0 75.0) translate(110 0) scale(-1 1) rotate(0 55.0 55.0) scale(1.1)"><path d="M30 90V46q0-6 6-6t6 6V20q0-6 6-6t6 6v24V14q0-6 6-6t6 6v32V22q0-6 6-6t6 6v40q0 28-24 28z" fill="#FFD9B8" stroke="#E2A97E" stroke-width="2"/><path d="M30 60q-10-14-18-6q6 10 18 28" fill="#FFD9B8" stroke="#E2A97E" stroke-width="2"/></g></g><g class="pulse"><path d="M150 50.0 l-10 16 l22 -14z" fill="#fff" stroke="#2F5DA8" stroke-width="3" stroke-linejoin="round"/><rect x="114.0" y="8.0" width="92" height="44" rx="22.0" fill="#fff" stroke="#2F5DA8" stroke-width="3"/><rect x="146" y="48.0" width="16" height="6" fill="#fff"/><text x="160" y="37.92" text-anchor="middle" font-size="22" font-weight="900" fill="#2F5DA8" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif">不疼！</text></g><g class=""><g transform="translate(270.0 180.0) rotate(0 20.0 20.0) scale(0.4)"><circle cx="50" cy="44" r="34" fill="#F2643A" opacity=".18"/><text x="50" y="62" text-anchor="middle" font-size="54" font-family="Fredoka,'Baloo 2','Arial Rounded MT Bold',Arial,sans-serif" font-weight="700" fill="#F2643A">10</text><circle cx="22" cy="80" r="4" fill="#F2643A"/><circle cx="36" cy="80" r="4" fill="#F2643A"/><circle cx="50" cy="80" r="4" fill="#F2643A"/><circle cx="64" cy="80" r="4" fill="#F2643A"/><circle cx="78" cy="80" r="4" fill="#F2643A"/><circle cx="22" cy="90" r="4" fill="#F2643A"/><circle cx="36" cy="90" r="4" fill="#F2643A"/><circle cx="50" cy="90" r="4" fill="#F2643A"/><circle cx="64" cy="90" r="4" fill="#F2643A"/><circle cx="78" cy="90" r="4" fill="#F2643A"/></g></g></svg>