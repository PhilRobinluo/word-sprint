 <circle cx="186" cy="124" r="38" fill="#E0A465"/>
 <ellipse cx="156" cy="118" rx="12" ry="26" fill="#8A5A3A" transform="rotate(20 156 118)"/><ellipse cx="216" cy="118" rx="12" ry="26" fill="#8A5A3A" transform="rotate(-20 216 118)"/>
 <ellipse cx="176" cy="140" rx="18" ry="13" fill="#F6D7B0"/><ellipse cx="172" cy="134" rx="7" ry="5" fill="#2B2B2B"/>
 <circle cx="174" cy="116" r="5" fill="#2B2B2B"/><circle cx="200" cy="116" r="5" fill="#2B2B2B"/>
