<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="一只蚊子嗡——地飞过来，小朋友竖起一根手指"><style>
.bob{animation:bob 2.4s ease-in-out infinite}.bob2{animation:bob 2.4s ease-in-out -1.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.pulse{animation:pl 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.spin{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes sp{to{transform:rotate(360deg)}}
.fall{animation:fa 1.2s linear infinite}.f2{animation-delay:-.4s}.f3{animation-delay:-.8s}
@keyframes fa{from{transform:translateY(-24px);opacity:0}25%{opacity:1}to{transform:translateY(30px);opacity:0}}
.drift{animation:dr 4s ease-in-out infinite}
@keyframes dr{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}
.flash{animation:fl 1s steps(2) infinite}
@keyframes fl{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="320" height="240" rx="24" fill="#EEF5FF"/><ellipse cx="160" cy="218" rx="130" ry="10" fill="#DCE8F7"/><g class="bob2"><rect x="90" y="162" width="40" height="38" rx="13" fill="#F2643A"/><circle cx="110" cy="140" r="23" fill="#FFD9B8"/><path d="M87 137 q2 -24 24 -24 q20 0 23 20 q-9 -9 -20 -7 q-13 2 -27 11z" fill="#2B2B2B"/><circle cx="102" cy="141" r="3" fill="#2B2B2B"/><circle cx="118" cy="141" r="3" fill="#2B2B2B"/><circle cx="96" cy="149" r="4" fill="#FFB0A0" opacity=".7"/><circle cx="124" cy="149" r="4" fill="#FFB0A0" opacity=".7"/><path d="M104 152 q6 7 12 0" fill="none" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round"/></g><path d="M140 150 v-30" stroke="#FFD9B8" stroke-width="9" stroke-linecap="round"/><g class="drift"><g transform="translate(197.0 57.0) rotate(0 35.0 35.0) scale(0.7)"><ellipse cx="34" cy="34" rx="16" ry="10" fill="#DDEBFA" opacity=".9" transform="rotate(-30 34 34)"/><ellipse cx="58" cy="30" rx="16" ry="10" fill="#DDEBFA" opacity=".9" transform="rotate(30 58 30)"/><ellipse cx="50" cy="56" rx="22" ry="9" fill="#555"/><circle cx="26" cy="54" r="8" fill="#555"/><path d="M18 54l-14 4M36 62l-8 16M50 64v16M62 62l8 16" stroke="#555" stroke-width="2.5" stroke-linecap="round"/><circle cx="24" cy="52" r="2" fill="#fff"/></g></g><g class="pulse"><path d="M226 60.0 l-10 16 l22 -14z" fill="#fff" stroke="#2F5DA8" stroke-width="3" stroke-linejoin="round"/><rect x="190.0" y="18.0" width="92" height="44" rx="22.0" fill="#fff" stroke="#2F5DA8" stroke-width="3"/><rect x="222" y="58.0" width="16" height="6" fill="#fff"/><text x="236" y="47.92" text-anchor="middle" font-size="22" font-weight="900" fill="#2F5DA8" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif">嗡——</text></g><g class=""><g transform="translate(19.0 17.0) rotate(0 27.0 27.0) scale(0.54)"><circle cx="50" cy="44" r="34" fill="#F2643A" opacity=".18"/><text x="50" y="62" text-anchor="middle" font-size="54" font-family="Fredoka,'Baloo 2','Arial Rounded MT Bold',Arial,sans-serif" font-weight="700" fill="#F2643A">1</text><circle cx="50" cy="80" r="4" fill="#F2643A"/></g></g></svg>