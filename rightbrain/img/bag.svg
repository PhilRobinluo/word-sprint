<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="背个书包去上学"><style>
.bob{animation:bob 2.4s ease-in-out infinite}.bob2{animation:bob 2.4s ease-in-out -1.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.pulse{animation:pl 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.spin{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes sp{to{transform:rotate(360deg)}}
.fall{animation:fa 1.2s linear infinite}.f2{animation-delay:-.4s}.f3{animation-delay:-.8s}
@keyframes fa{from{transform:translateY(-24px);opacity:0}25%{opacity:1}to{transform:translateY(30px);opacity:0}}
.drift{animation:dr 4s ease-in-out infinite}
@keyframes dr{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}
.flash{animation:fl 1s steps(2) infinite}
@keyframes fl{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="320" height="240" rx="24" fill="#FFF4EC"/><ellipse cx="160" cy="218" rx="130" ry="10" fill="#F3DEC4"/><g class="bob"><g transform="translate(145.0 85.0) rotate(0 55.0 55.0) scale(1.1)"><path d="M34 24q0-14 16-14t16 14" fill="none" stroke="#C23B3F" stroke-width="6"/><rect x="18" y="24" width="64" height="66" rx="16" fill="#E5484D"/><rect x="30" y="56" width="40" height="26" rx="8" fill="#C23B3F"/><rect x="44" y="52" width="12" height="8" rx="2" fill="#FFC93C"/></g></g><g class="bob2"><rect x="90" y="152" width="40" height="38" rx="13" fill="#2F5DA8"/><circle cx="110" cy="130" r="23" fill="#FFD9B8"/><path d="M87 127 q2 -24 24 -24 q20 0 23 20 q-9 -9 -20 -7 q-13 2 -27 11z" fill="#2B2B2B"/><circle cx="102" cy="131" r="3" fill="#2B2B2B"/><circle cx="118" cy="131" r="3" fill="#2B2B2B"/><circle cx="96" cy="139" r="4" fill="#FFB0A0" opacity=".7"/><circle cx="124" cy="139" r="4" fill="#FFB0A0" opacity=".7"/><path d="M104 142 q6 7 12 0" fill="none" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round"/></g><g class="pulse"><path d="M240 54.0 l-10 16 l22 -14z" fill="#fff" stroke="#2F5DA8" stroke-width="3" stroke-linejoin="round"/><rect x="204.0" y="12.0" width="92" height="44" rx="22.0" fill="#fff" stroke="#2F5DA8" stroke-width="3"/><rect x="236" y="52.0" width="16" height="6" fill="#fff"/><text x="250" y="41.92" text-anchor="middle" font-size="22" font-weight="900" fill="#2F5DA8" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif">背个包</text></g></svg>