<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="小猴子忙着给大家摘桃子"><style>
.bob{animation:bob 2.4s ease-in-out infinite}.bob2{animation:bob 2.4s ease-in-out -1.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.pulse{animation:pl 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.spin{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes sp{to{transform:rotate(360deg)}}
.fall{animation:fa 1.2s linear infinite}.f2{animation-delay:-.4s}.f3{animation-delay:-.8s}
@keyframes fa{from{transform:translateY(-24px);opacity:0}25%{opacity:1}to{transform:translateY(30px);opacity:0}}
.drift{animation:dr 4s ease-in-out infinite}
@keyframes dr{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}
.flash{animation:fl 1s steps(2) infinite}
@keyframes fl{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="320" height="240" rx="24" fill="#EEF8E8"/><rect x="236" y="70" width="18" height="150" rx="6" fill="#8A5A3A"/><ellipse cx="246" cy="70" rx="70" ry="50" fill="#7BC67E"/><g class=""><g transform="translate(205.0 51.0) rotate(0 15.0 15.0) scale(0.3)"><path d="M50 24q30 0 30 32t-30 34q-30-2-30-34t30-32z" fill="#FFB3A7"/><path d="M50 26q-8 30 0 62" fill="none" stroke="#F28B7A" stroke-width="3"/><path d="M50 26q6-14 22-10q-6 14-22 10z" fill="#2EA868"/></g></g><g class=""><g transform="translate(255.0 69.0) rotate(0 15.0 15.0) scale(0.3)"><path d="M50 24q30 0 30 32t-30 34q-30-2-30-34t30-32z" fill="#FFB3A7"/><path d="M50 26q-8 30 0 62" fill="none" stroke="#F28B7A" stroke-width="3"/><path d="M50 26q6-14 22-10q-6 14-22 10z" fill="#2EA868"/></g></g><g class="bob"><g transform="translate(75.0 85.0) rotate(0 55.0 55.0) scale(1.1)"><circle cx="18" cy="48" r="12" fill="#8A5A3A"/><circle cx="82" cy="48" r="12" fill="#8A5A3A"/><circle cx="18" cy="48" r="6" fill="#F3D1A8"/><circle cx="82" cy="48" r="6" fill="#F3D1A8"/><circle cx="50" cy="48" r="32" fill="#8A5A3A"/><path d="M50 34q-10-8-18 2q-8 12 2 20q-8 18 16 22q24-4 16-22q10-8 2-20q-8-10-18-2z" fill="#F3D1A8"/><circle cx="41" cy="44" r="3.5" fill="#2B2B2B"/><circle cx="59" cy="44" r="3.5" fill="#2B2B2B"/><circle cx="42" cy="43" r="1" fill="#fff"/><circle cx="60" cy="43" r="1" fill="#fff"/><path d="M42 66q8 6 16 0" fill="none" stroke="#2B2B2B" stroke-width="2.5" stroke-linecap="round"/></g></g><g class="bob2"><g transform="translate(53.0 173.0) rotate(0 17.0 17.0) scale(0.34)"><path d="M50 24q30 0 30 32t-30 34q-30-2-30-34t30-32z" fill="#FFB3A7"/><path d="M50 26q-8 30 0 62" fill="none" stroke="#F28B7A" stroke-width="3"/><path d="M50 26q6-14 22-10q-6 14-22 10z" fill="#2EA868"/></g></g><g class="pulse"><path d="M70 56.0 l-10 16 l22 -14z" fill="#fff" stroke="#2F5DA8" stroke-width="3" stroke-linejoin="round"/><rect x="23.0" y="14.0" width="114" height="44" rx="22.0" fill="#fff" stroke="#2F5DA8" stroke-width="3"/><rect x="66" y="54.0" width="16" height="6" fill="#fff"/><text x="80" y="43.92" text-anchor="middle" font-size="22" font-weight="900" fill="#2F5DA8" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif">忙给你！</text></g></svg>