<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="生日派对上，妈妈切蛋糕一块一块给客人"><style>
.bob{animation:bob 2.4s ease-in-out infinite}.bob2{animation:bob 2.4s ease-in-out -1.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.pulse{animation:pl 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.spin{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes sp{to{transform:rotate(360deg)}}
.fall{animation:fa 1.2s linear infinite}.f2{animation-delay:-.4s}.f3{animation-delay:-.8s}
@keyframes fa{from{transform:translateY(-24px);opacity:0}25%{opacity:1}to{transform:translateY(30px);opacity:0}}
.drift{animation:dr 4s ease-in-out infinite}
@keyframes dr{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}
.flash{animation:fl 1s steps(2) infinite}
@keyframes fl{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="320" height="240" rx="24" fill="#FFF0F5"/>
<ellipse cx="160" cy="214" rx="120" ry="10" fill="#F6D6E2"/>
<g class="bob">
 <rect x="90" y="132" width="140" height="70" rx="14" fill="#FFB3C7"/>
 <rect x="90" y="132" width="140" height="22" rx="11" fill="#fff"/>
 <path d="M96 150 q8 14 16 0 q8 14 16 0 q8 14 16 0 q8 14 16 0 q8 14 16 0 q8 14 16 0 q8 14 16 0 q8 14 16 0" fill="#fff"/>
 <rect x="110" y="86" width="100" height="50" rx="12" fill="#FFD3E0"/>
 <rect x="110" y="86" width="100" height="16" rx="8" fill="#fff"/>
 <g fill="#E5484D"><circle cx="128" cy="174" r="6"/><circle cx="160" cy="180" r="6"/><circle cx="192" cy="174" r="6"/></g>
 <g><rect x="130" y="58" width="8" height="30" rx="3" fill="#7FB2E5"/><rect x="156" y="54" width="8" height="34" rx="3" fill="#FFC93C"/><rect x="182" y="58" width="8" height="30" rx="3" fill="#2EA868"/></g>
 <g class="flash" fill="#FF8A3D"><ellipse cx="134" cy="50" rx="5" ry="9"/><ellipse cx="160" cy="46" rx="5" ry="9"/><ellipse cx="186" cy="50" rx="5" ry="9"/></g>
</g>
<g class="drift"><path d="M248 150 l44 -16 l-6 40z" fill="#FFB3C7"/><path d="M248 150 l44 -16 l-2 10 l-42 14z" fill="#fff"/></g>
<g fill="#FFC93C"><circle cx="40" cy="50" r="5"/><circle cx="280" cy="60" r="4"/><circle cx="60" cy="120" r="3"/></g></svg>