<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="母鸡哼一声，下了一个蛋"><style>
.bob{animation:bob 2.4s ease-in-out infinite}.bob2{animation:bob 2.4s ease-in-out -1.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.pulse{animation:pl 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.spin{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes sp{to{transform:rotate(360deg)}}
.fall{animation:fa 1.2s linear infinite}.f2{animation-delay:-.4s}.f3{animation-delay:-.8s}
@keyframes fa{from{transform:translateY(-24px);opacity:0}25%{opacity:1}to{transform:translateY(30px);opacity:0}}
.drift{animation:dr 4s ease-in-out infinite}
@keyframes dr{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}
.flash{animation:fl 1s steps(2) infinite}
@keyframes fl{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="320" height="240" rx="24" fill="#FFF7E8"/><ellipse cx="160" cy="200" rx="110" ry="26" fill="#E9C46A"/><g class="bob"><g transform="translate(70.0 60.0) rotate(0 70.0 70.0) scale(1.4)"><ellipse cx="54" cy="62" rx="30" ry="22" fill="#fff" stroke="#E0D4C0" stroke-width="2"/><circle cx="34" cy="36" r="16" fill="#fff" stroke="#E0D4C0" stroke-width="2"/><path d="M28 20q4-10 8 0q4-10 8 0q-8 4-16 0z" fill="#E5484D"/><path d="M18 38l-10 4 10 4z" fill="#F2643A"/><path d="M26 46q-2 8 4 8" fill="#E5484D"/><circle cx="32" cy="34" r="3" fill="#2B2B2B"/><path d="M80 50l12-12M82 56l12-6" stroke="#E0D4C0" stroke-width="5" stroke-linecap="round"/><path d="M46 84v10M60 84v10" stroke="#F2643A" stroke-width="3"/></g></g><g class="pulse"><g transform="translate(211.0 159.0) rotate(0 25.0 25.0) scale(0.5)"><path d="M50 12c18 0 32 30 32 48s-14 30-32 30-32-12-32-30 14-48 32-48z" fill="#FFF8EC" stroke="#E8D6BA" stroke-width="3"/><ellipse cx="40" cy="40" rx="6" ry="10" fill="#fff"/></g></g><g class="pulse"><path d="M240 60.0 l-10 16 l22 -14z" fill="#fff" stroke="#2F5DA8" stroke-width="3" stroke-linejoin="round"/><rect x="215.0" y="18.0" width="70" height="44" rx="22.0" fill="#fff" stroke="#2F5DA8" stroke-width="3"/><rect x="236" y="58.0" width="16" height="6" fill="#fff"/><text x="250" y="47.92" text-anchor="middle" font-size="22" font-weight="900" fill="#2F5DA8" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif">哼！</text></g></svg>