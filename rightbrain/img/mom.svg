<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="妈妈摸摸我的头"><style>
.bob{animation:bob 2.4s ease-in-out infinite}.bob2{animation:bob 2.4s ease-in-out -1.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.pulse{animation:pl 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.spin{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes sp{to{transform:rotate(360deg)}}
.fall{animation:fa 1.2s linear infinite}.f2{animation-delay:-.4s}.f3{animation-delay:-.8s}
@keyframes fa{from{transform:translateY(-24px);opacity:0}25%{opacity:1}to{transform:translateY(30px);opacity:0}}
.drift{animation:dr 4s ease-in-out infinite}
@keyframes dr{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}
.flash{animation:fl 1s steps(2) infinite}
@keyframes fl{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="320" height="240" rx="24" fill="#FFF2F6"/><ellipse cx="160" cy="218" rx="130" ry="10" fill="#F4D9E4"/><g class="bob"><g transform="translate(50.0 56.0) rotate(0 80.0 80.0) scale(1.6)"><path d="M24 52q-6-40 26-40t26 40v20H24z" fill="#5A3A2A"/><rect x="24" y="62" width="52" height="32" rx="16" fill="#FF8FB1"/><circle cx="50" cy="44" r="20" fill="#FFD9B8"/><path d="M30 42q2-22 20-22t20 22q-8-14-20-14t-20 14z" fill="#5A3A2A"/><circle cx="43" cy="44" r="2.6" fill="#2B2B2B"/><circle cx="57" cy="44" r="2.6" fill="#2B2B2B"/><circle cx="44" cy="43" r="1" fill="#fff"/><circle cx="58" cy="43" r="1" fill="#fff"/><path d="M44 53q6 4 12 0" fill="none" stroke="#E5484D" stroke-width="2.5" stroke-linecap="round"/><path d="M50 82q-8-6-8-10q0-5 4-5q3 0 4 3q1-3 4-3q4 0 4 5q0 4-8 10z" fill="#E5484D"/></g></g><g class="bob2"><rect x="210" y="182" width="40" height="38" rx="13" fill="#FFC93C"/><circle cx="230" cy="160" r="23" fill="#FFD9B8"/><path d="M207 157 q2 -24 24 -24 q20 0 23 20 q-9 -9 -20 -7 q-13 2 -27 11z" fill="#2B2B2B"/><circle cx="222" cy="161" r="3" fill="#2B2B2B"/><circle cx="238" cy="161" r="3" fill="#2B2B2B"/><circle cx="216" cy="169" r="4" fill="#FFB0A0" opacity=".7"/><circle cx="244" cy="169" r="4" fill="#FFB0A0" opacity=".7"/><path d="M224 172 q6 7 12 0" fill="none" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round"/></g><g class="pulse"><path d="M240 60.0 l-10 16 l22 -14z" fill="#fff" stroke="#2F5DA8" stroke-width="3" stroke-linejoin="round"/><rect x="204.0" y="18.0" width="92" height="44" rx="22.0" fill="#fff" stroke="#2F5DA8" stroke-width="3"/><rect x="236" y="58.0" width="16" height="6" fill="#fff"/><text x="250" y="47.92" text-anchor="middle" font-size="22" font-weight="900" fill="#2F5DA8" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif">摸摸头</text></g></svg>