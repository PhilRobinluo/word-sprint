<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="阿婆笑眯眯地递来一个又红又大的苹果"><style>
.bob{animation:bob 2.4s ease-in-out infinite}.bob2{animation:bob 2.4s ease-in-out -1.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.pulse{animation:pl 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.spin{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes sp{to{transform:rotate(360deg)}}
.fall{animation:fa 1.2s linear infinite}.f2{animation-delay:-.4s}.f3{animation-delay:-.8s}
@keyframes fa{from{transform:translateY(-24px);opacity:0}25%{opacity:1}to{transform:translateY(30px);opacity:0}}
.drift{animation:dr 4s ease-in-out infinite}
@keyframes dr{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}
.flash{animation:fl 1s steps(2) infinite}
@keyframes fl{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="320" height="240" rx="24" fill="#FFF1EC"/>
<ellipse cx="160" cy="218" rx="120" ry="9" fill="#F6D9CF"/>
<g>
 <rect x="62" y="132" width="64" height="80" rx="22" fill="#9C6ADE"/>
 <circle cx="94" cy="102" r="30" fill="#FFE0C4"/>
 <path d="M64 100 q0 -36 30 -36 q30 0 30 36 q-10 -18 -30 -18 q-20 0 -30 18z" fill="#E8E8EE"/><circle cx="94" cy="62" r="13" fill="#E8E8EE"/>
 <path d="M80 100 q4 -4 8 0 M100 100 q4 -4 8 0" fill="none" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round"/>
 <path d="M86 114 q8 8 16 0" fill="none" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round"/>
 <circle cx="76" cy="110" r="5" fill="#FFB0A0" opacity=".7"/><circle cx="112" cy="110" r="5" fill="#FFB0A0" opacity=".7"/>
 <path d="M120 150 q30 -6 56 -2" stroke="#FFE0C4" stroke-width="12" stroke-linecap="round" fill="none"/>
</g>
<g class="bob">
 <path d="M206 98 q-32 -18 -46 14 q-14 40 18 70 q14 12 28 2 q14 10 28 -2 q32 -30 18 -70 q-14 -32 -46 -14z" fill="#E5484D"/>
 <path d="M178 120 q-6 16 0 30" stroke="#fff" stroke-width="6" stroke-linecap="round" fill="none" opacity=".5"/>
 <path d="M206 98 q0 -18 8 -28" stroke="#6B4423" stroke-width="5" stroke-linecap="round" fill="none"/>
 <path d="M212 76 q22 -16 34 0 q-18 12 -34 0z" fill="#3FAE5A"/>
</g>
<g class="flash" fill="#FFC93C"><path d="M262 120 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4z"/></g></svg>