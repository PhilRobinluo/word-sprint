<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="两只小兔子，蹦蹦跳跳"><style>
.bob{animation:bob 2.4s ease-in-out infinite}.bob2{animation:bob 2.4s ease-in-out -1.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.pulse{animation:pl 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.spin{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes sp{to{transform:rotate(360deg)}}
.fall{animation:fa 1.2s linear infinite}.f2{animation-delay:-.4s}.f3{animation-delay:-.8s}
@keyframes fa{from{transform:translateY(-24px);opacity:0}25%{opacity:1}to{transform:translateY(30px);opacity:0}}
.drift{animation:dr 4s ease-in-out infinite}
@keyframes dr{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}
.flash{animation:fl 1s steps(2) infinite}
@keyframes fl{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="320" height="240" rx="24" fill="#F0F8EA"/><ellipse cx="160" cy="218" rx="130" ry="10" fill="#D8EDC9"/><g class="bob"><g transform="translate(60.0 100.0) rotate(0 50.0 50.0) scale(1.0)"><ellipse cx="38" cy="22" rx="7" ry="20" fill="#fff" stroke="#E0D4C0" stroke-width="2"/><ellipse cx="58" cy="22" rx="7" ry="20" fill="#fff" stroke="#E0D4C0" stroke-width="2"/><ellipse cx="38" cy="22" rx="3" ry="13" fill="#FFC9C9"/><ellipse cx="58" cy="22" rx="3" ry="13" fill="#FFC9C9"/><ellipse cx="50" cy="74" rx="26" ry="20" fill="#fff" stroke="#E0D4C0" stroke-width="2"/><circle cx="48" cy="50" r="20" fill="#fff" stroke="#E0D4C0" stroke-width="2"/><circle cx="41" cy="48" r="3" fill="#2B2B2B"/><circle cx="55" cy="48" r="3" fill="#2B2B2B"/><circle cx="42" cy="47" r="1" fill="#fff"/><circle cx="56" cy="47" r="1" fill="#fff"/><path d="M46 56l2 2 2-2" fill="none" stroke="#FF8FB1" stroke-width="2"/><circle cx="76" cy="78" r="6" fill="#fff" stroke="#E0D4C0" stroke-width="2"/></g></g><g class="bob2"><g transform="translate(160.0 100.0) translate(100 0) scale(-1 1) rotate(0 50.0 50.0) scale(1.0)"><ellipse cx="38" cy="22" rx="7" ry="20" fill="#fff" stroke="#E0D4C0" stroke-width="2"/><ellipse cx="58" cy="22" rx="7" ry="20" fill="#fff" stroke="#E0D4C0" stroke-width="2"/><ellipse cx="38" cy="22" rx="3" ry="13" fill="#FFC9C9"/><ellipse cx="58" cy="22" rx="3" ry="13" fill="#FFC9C9"/><ellipse cx="50" cy="74" rx="26" ry="20" fill="#fff" stroke="#E0D4C0" stroke-width="2"/><circle cx="48" cy="50" r="20" fill="#fff" stroke="#E0D4C0" stroke-width="2"/><circle cx="41" cy="48" r="3" fill="#2B2B2B"/><circle cx="55" cy="48" r="3" fill="#2B2B2B"/><circle cx="42" cy="47" r="1" fill="#fff"/><circle cx="56" cy="47" r="1" fill="#fff"/><path d="M46 56l2 2 2-2" fill="none" stroke="#FF8FB1" stroke-width="2"/><circle cx="76" cy="78" r="6" fill="#fff" stroke="#E0D4C0" stroke-width="2"/></g></g><g class="pulse"><path d="M150 60.0 l-10 16 l22 -14z" fill="#fff" stroke="#2F5DA8" stroke-width="3" stroke-linejoin="round"/><rect x="103.0" y="18.0" width="114" height="44" rx="22.0" fill="#fff" stroke="#2F5DA8" stroke-width="3"/><rect x="146" y="58.0" width="16" height="6" fill="#fff"/><text x="160" y="47.92" text-anchor="middle" font-size="22" font-weight="900" fill="#2F5DA8" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif">兔！兔！</text></g><g class=""><g transform="translate(15.0 17.0) rotate(0 25.0 25.0) scale(0.5)"><circle cx="50" cy="44" r="34" fill="#2F5DA8" opacity=".18"/><text x="50" y="62" text-anchor="middle" font-size="54" font-family="Fredoka,'Baloo 2','Arial Rounded MT Bold',Arial,sans-serif" font-weight="700" fill="#2F5DA8">2</text><circle cx="43" cy="80" r="4" fill="#2F5DA8"/><circle cx="57" cy="80" r="4" fill="#2F5DA8"/></g></g></svg>