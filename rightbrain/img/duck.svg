<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="小鸭子搭客，背着小青蛙过河"><style>
.bob{animation:bob 2.4s ease-in-out infinite}.bob2{animation:bob 2.4s ease-in-out -1.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.pulse{animation:pl 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.spin{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes sp{to{transform:rotate(360deg)}}
.fall{animation:fa 1.2s linear infinite}.f2{animation-delay:-.4s}.f3{animation-delay:-.8s}
@keyframes fa{from{transform:translateY(-24px);opacity:0}25%{opacity:1}to{transform:translateY(30px);opacity:0}}
.drift{animation:dr 4s ease-in-out infinite}
@keyframes dr{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}
.flash{animation:fl 1s steps(2) infinite}
@keyframes fl{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="320" height="240" rx="24" fill="#E3F4FF"/><path d="M0 170 q40 -10 80 0 t80 0 t80 0 t80 0 V240 H0z" fill="#7FB2E5"/><g class="bob"><g transform="translate(95.0 95.0) rotate(0 65.0 65.0) scale(1.3)"><ellipse cx="54" cy="64" rx="34" ry="22" fill="#FFC93C"/><circle cx="34" cy="36" r="18" fill="#FFC93C"/><path d="M14 36l-12 4 12 6z" fill="#F2643A"/><circle cx="30" cy="32" r="3.5" fill="#2B2B2B"/><path d="M50 60q14 14 28 0" fill="none" stroke="#E2A400" stroke-width="4" stroke-linecap="round"/><path d="M86 56l8-6-2 12z" fill="#FFC93C"/></g></g><g class="bob"><g transform="translate(143.0 97.0) rotate(0 25.0 25.0) scale(0.5)"><ellipse cx="50" cy="64" rx="34" ry="22" fill="#6CC070"/><circle cx="32" cy="38" r="12" fill="#6CC070"/><circle cx="68" cy="38" r="12" fill="#6CC070"/><circle cx="32" cy="38" r="7" fill="#fff"/><circle cx="68" cy="38" r="7" fill="#fff"/><circle cx="33" cy="39" r="3.5" fill="#2B2B2B"/><circle cx="67" cy="39" r="3.5" fill="#2B2B2B"/><path d="M36 66q14 10 28 0" fill="none" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round"/></g></g><g class="pulse"><path d="M60 60.0 l-10 16 l22 -14z" fill="#fff" stroke="#2F5DA8" stroke-width="3" stroke-linejoin="round"/><rect x="24.0" y="18.0" width="92" height="44" rx="22.0" fill="#fff" stroke="#2F5DA8" stroke-width="3"/><rect x="56" y="58.0" width="16" height="6" fill="#fff"/><text x="70" y="47.92" text-anchor="middle" font-size="22" font-weight="900" fill="#2F5DA8" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif">搭客～</text></g></svg>