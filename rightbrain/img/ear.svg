<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="一只大耳朵，竖起来听"><style>
.bob{animation:bob 2.4s ease-in-out infinite}.bob2{animation:bob 2.4s ease-in-out -1.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.pulse{animation:pl 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.spin{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes sp{to{transform:rotate(360deg)}}
.fall{animation:fa 1.2s linear infinite}.f2{animation-delay:-.4s}.f3{animation-delay:-.8s}
@keyframes fa{from{transform:translateY(-24px);opacity:0}25%{opacity:1}to{transform:translateY(30px);opacity:0}}
.drift{animation:dr 4s ease-in-out infinite}
@keyframes dr{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}
.flash{animation:fl 1s steps(2) infinite}
@keyframes fl{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="320" height="240" rx="24" fill="#F5F0FF"/><ellipse cx="160" cy="218" rx="130" ry="10" fill="#E4DCF5"/><g class="bob2"><rect x="110" y="152" width="40" height="38" rx="13" fill="#9C6ADE"/><circle cx="130" cy="130" r="23" fill="#FFD9B8"/><path d="M107 127 q2 -24 24 -24 q20 0 23 20 q-9 -9 -20 -7 q-13 2 -27 11z" fill="#2B2B2B"/><circle cx="122" cy="131" r="3" fill="#2B2B2B"/><circle cx="138" cy="131" r="3" fill="#2B2B2B"/><circle cx="116" cy="139" r="4" fill="#FFB0A0" opacity=".7"/><circle cx="144" cy="139" r="4" fill="#FFB0A0" opacity=".7"/><path d="M124 142 q6 7 12 0" fill="none" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round"/></g><g class="pulse"><g transform="translate(149.0 103.0) rotate(0 23.0 23.0) scale(0.46)"><path d="M36 22q30-20 42 10q8 22-10 36q-10 8-10 18q-2 12-14 8q-10-4-4-16q4-8-4-18q-14-20 0-38z" fill="#F7B48C"/><path d="M48 32q16-8 20 8q2 12-8 18" fill="none" stroke="#C9805A" stroke-width="4" stroke-linecap="round"/></g></g><g fill="none" stroke="#9C6ADE" stroke-width="4" stroke-linecap="round"><path d="M206 112 q10 14 0 28"/><path d="M220 102 q18 24 0 48"/></g><g class="pulse"><path d="M230 60.0 l-10 16 l22 -14z" fill="#fff" stroke="#2F5DA8" stroke-width="3" stroke-linejoin="round"/><rect x="205.0" y="18.0" width="70" height="44" rx="22.0" fill="#fff" stroke="#2F5DA8" stroke-width="3"/><rect x="226" y="58.0" width="16" height="6" fill="#fff"/><text x="240" y="47.92" text-anchor="middle" font-size="22" font-weight="900" fill="#2F5DA8" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif">一耳</text></g></svg>