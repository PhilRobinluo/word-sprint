<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="门上贴着四个「福」字"><style>
.bob{animation:bob 2.4s ease-in-out infinite}.bob2{animation:bob 2.4s ease-in-out -1.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.pulse{animation:pl 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.spin{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes sp{to{transform:rotate(360deg)}}
.fall{animation:fa 1.2s linear infinite}.f2{animation-delay:-.4s}.f3{animation-delay:-.8s}
@keyframes fa{from{transform:translateY(-24px);opacity:0}25%{opacity:1}to{transform:translateY(30px);opacity:0}}
.drift{animation:dr 4s ease-in-out infinite}
@keyframes dr{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}
.flash{animation:fl 1s steps(2) infinite}
@keyframes fl{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="320" height="240" rx="24" fill="#FFF3E6"/><rect x="40" y="20" width="240" height="200" rx="12" fill="#C9473B"/><rect x="52" y="32" width="216" height="176" rx="8" fill="#E5574A"/><g class="pulse"><g transform="translate(80.0 45.0) rotate(0 35.0 35.0) scale(0.7)"><rect x="20" y="20" width="60" height="60" fill="#E5484D" transform="rotate(45 50 50)"/><text x="50" y="66" text-anchor="middle" font-size="44" font-weight="900" fill="#FFC93C" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif">福</text></g></g><g class="pulse"><g transform="translate(170.0 45.0) rotate(0 35.0 35.0) scale(0.7)"><rect x="20" y="20" width="60" height="60" fill="#E5484D" transform="rotate(45 50 50)"/><text x="50" y="66" text-anchor="middle" font-size="44" font-weight="900" fill="#FFC93C" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif">福</text></g></g><g class="pulse"><g transform="translate(80.0 125.0) rotate(0 35.0 35.0) scale(0.7)"><rect x="20" y="20" width="60" height="60" fill="#E5484D" transform="rotate(45 50 50)"/><text x="50" y="66" text-anchor="middle" font-size="44" font-weight="900" fill="#FFC93C" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif">福</text></g></g><g class="pulse"><g transform="translate(170.0 125.0) rotate(0 35.0 35.0) scale(0.7)"><rect x="20" y="20" width="60" height="60" fill="#E5484D" transform="rotate(45 50 50)"/><text x="50" y="66" text-anchor="middle" font-size="44" font-weight="900" fill="#FFC93C" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif">福</text></g></g><g class=""><g transform="translate(268.0 8.0) rotate(0 22.0 22.0) scale(0.44)"><circle cx="50" cy="44" r="34" fill="#E5484D" opacity=".18"/><text x="50" y="62" text-anchor="middle" font-size="54" font-family="Fredoka,'Baloo 2','Arial Rounded MT Bold',Arial,sans-serif" font-weight="700" fill="#E5484D">4</text><circle cx="29" cy="80" r="4" fill="#E5484D"/><circle cx="43" cy="80" r="4" fill="#E5484D"/><circle cx="57" cy="80" r="4" fill="#E5484D"/><circle cx="71" cy="80" r="4" fill="#E5484D"/></g></g></svg>