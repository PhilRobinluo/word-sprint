<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="小松鼠拿着坚果：拿它！"><style>
.bob{animation:bob 2.4s ease-in-out infinite}.bob2{animation:bob 2.4s ease-in-out -1.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.pulse{animation:pl 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.spin{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes sp{to{transform:rotate(360deg)}}
.fall{animation:fa 1.2s linear infinite}.f2{animation-delay:-.4s}.f3{animation-delay:-.8s}
@keyframes fa{from{transform:translateY(-24px);opacity:0}25%{opacity:1}to{transform:translateY(30px);opacity:0}}
.drift{animation:dr 4s ease-in-out infinite}
@keyframes dr{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}
.flash{animation:fl 1s steps(2) infinite}
@keyframes fl{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="320" height="240" rx="24" fill="#FFF6EA"/><ellipse cx="160" cy="218" rx="130" ry="10" fill="#F3DEC4"/><g class="bob"><g transform="translate(60.0 70.0) rotate(0 70.0 70.0) scale(1.4)"><path d="M66 90q30-4 26-40t-24-36q-14 6-4 26q10 22-6 46z" fill="#C2783E"/><ellipse cx="44" cy="68" rx="20" ry="22" fill="#D9934E"/><circle cx="40" cy="38" r="16" fill="#D9934E"/><path d="M30 26l2-12 8 8zM48 24l4-12 4 12z" fill="#C2783E"/><circle cx="34" cy="36" r="3" fill="#2B2B2B"/><circle cx="26" cy="42" r="2.5" fill="#2B2B2B"/><ellipse cx="44" cy="72" rx="10" ry="12" fill="#F3D1A8"/></g></g><g class="pulse"><g transform="translate(180.0 120.0) rotate(0 30.0 30.0) scale(0.6)"><path d="M24 44q26-22 52 0q-2 8-26 8t-26-8z" fill="#8A5A3A"/><path d="M50 30v-12" stroke="#5A3A2A" stroke-width="5" stroke-linecap="round"/><path d="M28 50q22 6 44 0q0 30-22 40q-22-10-22-40z" fill="#D9A066"/><path d="M40 60q-2 14 8 22" fill="none" stroke="#fff" stroke-width="3" opacity=".5"/><path d="M28 44l44 0" stroke="#5A3A2A" stroke-width="2" opacity=".5"/></g></g><g class="pulse"><path d="M240 60.0 l-10 16 l22 -14z" fill="#fff" stroke="#2F5DA8" stroke-width="3" stroke-linejoin="round"/><rect x="204.0" y="18.0" width="92" height="44" rx="22.0" fill="#fff" stroke="#2F5DA8" stroke-width="3"/><rect x="236" y="58.0" width="16" height="6" fill="#fff"/><text x="250" y="47.92" text-anchor="middle" font-size="22" font-weight="900" fill="#2F5DA8" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif">拿它！</text></g></svg>