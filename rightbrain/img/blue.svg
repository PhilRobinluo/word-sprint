<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="蓝蓝的天，一滴雨也不漏"><style>
.bob{animation:bob 2.4s ease-in-out infinite}.bob2{animation:bob 2.4s ease-in-out -1.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.pulse{animation:pl 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.spin{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes sp{to{transform:rotate(360deg)}}
.fall{animation:fa 1.2s linear infinite}.f2{animation-delay:-.4s}.f3{animation-delay:-.8s}
@keyframes fa{from{transform:translateY(-24px);opacity:0}25%{opacity:1}to{transform:translateY(30px);opacity:0}}
.drift{animation:dr 4s ease-in-out infinite}
@keyframes dr{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}
.flash{animation:fl 1s steps(2) infinite}
@keyframes fl{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="320" height="240" rx="24" fill="#BFE0FF"/><g class="drift"><g transform="translate(35.0 25.0) rotate(0 45.0 45.0) scale(0.9)"><path d="M20 70q-14 0-14-14t16-14q2-18 22-18t22 16q22-2 24 16t-18 14z" fill="#fff"/></g></g><g class="drift"><g transform="translate(201.0 15.0) rotate(0 35.0 35.0) scale(0.7)"><path d="M20 70q-14 0-14-14t16-14q2-18 22-18t22 16q22-2 24 16t-18 14z" fill="#fff"/></g></g><g class="spin"><g transform="translate(225.0 115.0) rotate(0 35.0 35.0) scale(0.7)"><g stroke="#FFC93C" stroke-width="6" stroke-linecap="round"><path d="M50 6v12M50 82v12M6 50h12M82 50h12M19 19l8 8M73 73l8 8M81 19l-8 8M27 73l-8 8"/></g><circle cx="50" cy="50" r="24" fill="#FFC93C"/><circle cx="42" cy="47" r="3" fill="#2B2B2B"/><circle cx="58" cy="47" r="3" fill="#2B2B2B"/><circle cx="43" cy="46" r="1" fill="#fff"/><circle cx="59" cy="46" r="1" fill="#fff"/><path d="M43 56q7 6 14 0" fill="none" stroke="#2B2B2B" stroke-width="2.5" stroke-linecap="round"/></g></g><path d="M0 210 q160 -20 320 0 V240 H0z" fill="#9CCB82"/><g class="bob2"><rect x="100" y="182" width="40" height="38" rx="13" fill="#2F5DA8"/><circle cx="120" cy="160" r="23" fill="#FFD9B8"/><path d="M97 157 q2 -24 24 -24 q20 0 23 20 q-9 -9 -20 -7 q-13 2 -27 11z" fill="#2B2B2B"/><circle cx="112" cy="161" r="3" fill="#2B2B2B"/><circle cx="128" cy="161" r="3" fill="#2B2B2B"/><circle cx="106" cy="169" r="4" fill="#FFB0A0" opacity=".7"/><circle cx="134" cy="169" r="4" fill="#FFB0A0" opacity=".7"/><path d="M114 172 q6 7 12 0" fill="none" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round"/></g><g class="pulse"><path d="M100 54.0 l-10 16 l22 -14z" fill="#fff" stroke="#2F5DA8" stroke-width="3" stroke-linejoin="round"/><rect x="64.0" y="12.0" width="92" height="44" rx="22.0" fill="#fff" stroke="#2F5DA8" stroke-width="3"/><rect x="96" y="52.0" width="16" height="6" fill="#fff"/><text x="110" y="41.92" text-anchor="middle" font-size="22" font-weight="900" fill="#2F5DA8" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif">不漏！</text></g></svg>