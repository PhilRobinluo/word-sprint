<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="鼻子痒痒，挠一挠"><style>
.bob{animation:bob 2.4s ease-in-out infinite}.bob2{animation:bob 2.4s ease-in-out -1.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.pulse{animation:pl 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.spin{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes sp{to{transform:rotate(360deg)}}
.fall{animation:fa 1.2s linear infinite}.f2{animation-delay:-.4s}.f3{animation-delay:-.8s}
@keyframes fa{from{transform:translateY(-24px);opacity:0}25%{opacity:1}to{transform:translateY(30px);opacity:0}}
.drift{animation:dr 4s ease-in-out infinite}
@keyframes dr{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}
.flash{animation:fl 1s steps(2) infinite}
@keyframes fl{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="320" height="240" rx="24" fill="#FFF4EC"/><ellipse cx="160" cy="218" rx="130" ry="10" fill="#F3DEC4"/><g class="bob2"><rect x="120" y="142" width="40" height="38" rx="13" fill="#FF8FB1"/><circle cx="140" cy="120" r="23" fill="#FFD9B8"/><path d="M117 117 q2 -24 24 -24 q20 0 23 20 q-9 -9 -20 -7 q-13 2 -27 11z" fill="#2B2B2B"/><circle cx="132" cy="121" r="3" fill="#2B2B2B"/><circle cx="148" cy="121" r="3" fill="#2B2B2B"/><circle cx="126" cy="129" r="4" fill="#FFB0A0" opacity=".7"/><circle cx="154" cy="129" r="4" fill="#FFB0A0" opacity=".7"/><ellipse cx="140" cy="134" rx="6" ry="7" fill="#C2413B"/></g><g class="pulse"><g transform="translate(123.0 107.0) rotate(0 17.0 17.0) scale(0.34)"><circle cx="50" cy="50" r="40" fill="#FFD9B8" opacity=".45"/><path d="M50 20q-6 26-18 40q-4 10 8 12q6-4 10 0q4-4 10 0q12-2 8-12q-12-14-18-40z" fill="#F7B48C"/><ellipse cx="42" cy="66" rx="4" ry="3" fill="#C9805A"/><ellipse cx="58" cy="66" rx="4" ry="3" fill="#C9805A"/></g></g><path d="M186 170 q-20 -20 -34 -40" stroke="#FFD9B8" stroke-width="10" stroke-linecap="round" fill="none"/><g class="pulse"><path d="M230 70.0 l-10 16 l22 -14z" fill="#fff" stroke="#2F5DA8" stroke-width="3" stroke-linejoin="round"/><rect x="194.0" y="28.0" width="92" height="44" rx="22.0" fill="#fff" stroke="#2F5DA8" stroke-width="3"/><rect x="226" y="68.0" width="16" height="6" fill="#fff"/><text x="240" y="57.92" text-anchor="middle" font-size="22" font-weight="900" fill="#2F5DA8" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif">挠一挠</text></g></svg>