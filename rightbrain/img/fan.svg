<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="扇子翻呀翻，好凉快"><style>
.bob{animation:bob 2.4s ease-in-out infinite}.bob2{animation:bob 2.4s ease-in-out -1.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.pulse{animation:pl 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.spin{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes sp{to{transform:rotate(360deg)}}
.fall{animation:fa 1.2s linear infinite}.f2{animation-delay:-.4s}.f3{animation-delay:-.8s}
@keyframes fa{from{transform:translateY(-24px);opacity:0}25%{opacity:1}to{transform:translateY(30px);opacity:0}}
.drift{animation:dr 4s ease-in-out infinite}
@keyframes dr{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}
.flash{animation:fl 1s steps(2) infinite}
@keyframes fl{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="320" height="240" rx="24" fill="#FFF2F6"/><ellipse cx="160" cy="218" rx="130" ry="10" fill="#F4D9E4"/><g class="sway"><g transform="translate(75.0 35.0) rotate(0 85.0 85.0) scale(1.7)"><path d="M50 84L14 40q36-32 72 0z" fill="#FF8FB1"/><g stroke="#fff" stroke-width="2.5"><path d="M50 84L22 34M50 84L36 24M50 84V20M50 84L64 24M50 84L78 34"/></g><path d="M14 40q36-32 72 0" fill="none" stroke="#E55D8B" stroke-width="3"/><circle cx="50" cy="84" r="5" fill="#8A5A3A"/><path d="M50 88v6" stroke="#E5484D" stroke-width="3"/></g></g><g fill="none" stroke="#9DB7DA" stroke-width="4" stroke-linecap="round"><path d="M240 120 q20 6 40 0"/><path d="M240 140 q24 6 46 0"/></g><g class="pulse"><path d="M60 60.0 l-10 16 l22 -14z" fill="#fff" stroke="#2F5DA8" stroke-width="3" stroke-linejoin="round"/><rect x="24.0" y="18.0" width="92" height="44" rx="22.0" fill="#fff" stroke="#2F5DA8" stroke-width="3"/><rect x="56" y="58.0" width="16" height="6" fill="#fff"/><text x="70" y="47.92" text-anchor="middle" font-size="22" font-weight="900" fill="#2F5DA8" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif">翻呀翻</text></g></svg>