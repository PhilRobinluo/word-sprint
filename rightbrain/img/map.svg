<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="摸着地图找宝藏"><style>
.bob{animation:bob 2.4s ease-in-out infinite}.bob2{animation:bob 2.4s ease-in-out -1.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.pulse{animation:pl 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.spin{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes sp{to{transform:rotate(360deg)}}
.fall{animation:fa 1.2s linear infinite}.f2{animation-delay:-.4s}.f3{animation-delay:-.8s}
@keyframes fa{from{transform:translateY(-24px);opacity:0}25%{opacity:1}to{transform:translateY(30px);opacity:0}}
.drift{animation:dr 4s ease-in-out infinite}
@keyframes dr{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}
.flash{animation:fl 1s steps(2) infinite}
@keyframes fl{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="320" height="240" rx="24" fill="#FFF8E6"/><ellipse cx="160" cy="218" rx="130" ry="10" fill="#F3DEC4"/><g class=""><g transform="translate(85.0 45.0) rotate(0 85.0 85.0) scale(1.7)"><path d="M10 22l26-8 28 8 26-8v64l-26 8-28-8-26 8z" fill="#F4E3B5" stroke="#D2B97C" stroke-width="3" stroke-linejoin="round"/><path d="M36 14v64M64 22v64" stroke="#D2B97C" stroke-width="3"/><path d="M20 66q14-6 20-20t26-14" fill="none" stroke="#2F5DA8" stroke-width="3" stroke-dasharray="5 5"/><path d="M68 26l12 12M80 26l-12 12" stroke="#E5484D" stroke-width="5" stroke-linecap="round"/></g></g><path d="M120 220 L150 150" stroke="#FFD9B8" stroke-width="12" stroke-linecap="round"/><g class="pulse"><path d="M60 60.0 l-10 16 l22 -14z" fill="#fff" stroke="#2F5DA8" stroke-width="3" stroke-linejoin="round"/><rect x="24.0" y="18.0" width="92" height="44" rx="22.0" fill="#fff" stroke="#2F5DA8" stroke-width="3"/><rect x="56" y="58.0" width="16" height="6" fill="#fff"/><text x="70" y="47.92" text-anchor="middle" font-size="22" font-weight="900" fill="#2F5DA8" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif">摸一摸</text></g></svg>