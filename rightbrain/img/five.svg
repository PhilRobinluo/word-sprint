<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="五只蝴蝶在花丛上飞舞"><style>
.bob{animation:bob 2.4s ease-in-out infinite}.bob2{animation:bob 2.4s ease-in-out -1.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.pulse{animation:pl 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.spin{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes sp{to{transform:rotate(360deg)}}
.fall{animation:fa 1.2s linear infinite}.f2{animation-delay:-.4s}.f3{animation-delay:-.8s}
@keyframes fa{from{transform:translateY(-24px);opacity:0}25%{opacity:1}to{transform:translateY(30px);opacity:0}}
.drift{animation:dr 4s ease-in-out infinite}
@keyframes dr{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}
.flash{animation:fl 1s steps(2) infinite}
@keyframes fl{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="320" height="240" rx="24" fill="#FFF6FA"/><ellipse cx="160" cy="218" rx="130" ry="10" fill="#F4D9E4"/><g class="bob"><g transform="translate(42.0 82.0) rotate(0 28.0 28.0) scale(0.56)"><ellipse cx="32" cy="38" rx="20" ry="16" fill="#FF8FB1"/><ellipse cx="68" cy="38" rx="20" ry="16" fill="#FF8FB1"/><ellipse cx="34" cy="66" rx="14" ry="12" fill="#FFC93C"/><ellipse cx="66" cy="66" rx="14" ry="12" fill="#FFC93C"/><rect x="47" y="30" width="6" height="46" rx="3" fill="#2B2B2B"/><path d="M48 30l-8-14M52 30l8-14" stroke="#2B2B2B" stroke-width="2" stroke-linecap="round"/></g></g><g class="bob2"><g transform="translate(105.0 45.0) rotate(0 25.0 25.0) scale(0.5)"><ellipse cx="32" cy="38" rx="20" ry="16" fill="#FF8FB1"/><ellipse cx="68" cy="38" rx="20" ry="16" fill="#FF8FB1"/><ellipse cx="34" cy="66" rx="14" ry="12" fill="#FFC93C"/><ellipse cx="66" cy="66" rx="14" ry="12" fill="#FFC93C"/><rect x="47" y="30" width="6" height="46" rx="3" fill="#2B2B2B"/><path d="M48 30l-8-14M52 30l8-14" stroke="#2B2B2B" stroke-width="2" stroke-linecap="round"/></g></g><g class="bob"><g transform="translate(162.0 92.0) rotate(0 28.0 28.0) scale(0.56)"><ellipse cx="32" cy="38" rx="20" ry="16" fill="#FF8FB1"/><ellipse cx="68" cy="38" rx="20" ry="16" fill="#FF8FB1"/><ellipse cx="34" cy="66" rx="14" ry="12" fill="#FFC93C"/><ellipse cx="66" cy="66" rx="14" ry="12" fill="#FFC93C"/><rect x="47" y="30" width="6" height="46" rx="3" fill="#2B2B2B"/><path d="M48 30l-8-14M52 30l8-14" stroke="#2B2B2B" stroke-width="2" stroke-linecap="round"/></g></g><g class="bob2"><g transform="translate(225.0 51.0) rotate(0 25.0 25.0) scale(0.5)"><ellipse cx="32" cy="38" rx="20" ry="16" fill="#FF8FB1"/><ellipse cx="68" cy="38" rx="20" ry="16" fill="#FF8FB1"/><ellipse cx="34" cy="66" rx="14" ry="12" fill="#FFC93C"/><ellipse cx="66" cy="66" rx="14" ry="12" fill="#FFC93C"/><rect x="47" y="30" width="6" height="46" rx="3" fill="#2B2B2B"/><path d="M48 30l-8-14M52 30l8-14" stroke="#2B2B2B" stroke-width="2" stroke-linecap="round"/></g></g><g class="drift"><g transform="translate(133.0 143.0) rotate(0 27.0 27.0) scale(0.54)"><ellipse cx="32" cy="38" rx="20" ry="16" fill="#FF8FB1"/><ellipse cx="68" cy="38" rx="20" ry="16" fill="#FF8FB1"/><ellipse cx="34" cy="66" rx="14" ry="12" fill="#FFC93C"/><ellipse cx="66" cy="66" rx="14" ry="12" fill="#FFC93C"/><rect x="47" y="30" width="6" height="46" rx="3" fill="#2B2B2B"/><path d="M48 30l-8-14M52 30l8-14" stroke="#2B2B2B" stroke-width="2" stroke-linecap="round"/></g></g><g class="pulse"><path d="M70 50.0 l-10 16 l22 -14z" fill="#fff" stroke="#2F5DA8" stroke-width="3" stroke-linejoin="round"/><rect x="34.0" y="8.0" width="92" height="44" rx="22.0" fill="#fff" stroke="#2F5DA8" stroke-width="3"/><rect x="66" y="48.0" width="16" height="6" fill="#fff"/><text x="80" y="37.92" text-anchor="middle" font-size="22" font-weight="900" fill="#2F5DA8" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif">飞舞～</text></g><g class=""><g transform="translate(266.0 174.0) rotate(0 22.0 22.0) scale(0.44)"><circle cx="50" cy="44" r="34" fill="#9C6ADE" opacity=".18"/><text x="50" y="62" text-anchor="middle" font-size="54" font-family="Fredoka,'Baloo 2','Arial Rounded MT Bold',Arial,sans-serif" font-weight="700" fill="#9C6ADE">5</text><circle cx="22" cy="80" r="4" fill="#9C6ADE"/><circle cx="36" cy="80" r="4" fill="#9C6ADE"/><circle cx="50" cy="80" r="4" fill="#9C6ADE"/><circle cx="64" cy="80" r="4" fill="#9C6ADE"/><circle cx="78" cy="80" r="4" fill="#9C6ADE"/></g></g></svg>