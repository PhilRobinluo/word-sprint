<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="跑累了，坐下来歇一歇"><style>
.bob{animation:bob 2.4s ease-in-out infinite}.bob2{animation:bob 2.4s ease-in-out -1.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.pulse{animation:pl 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.spin{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes sp{to{transform:rotate(360deg)}}
.fall{animation:fa 1.2s linear infinite}.f2{animation-delay:-.4s}.f3{animation-delay:-.8s}
@keyframes fa{from{transform:translateY(-24px);opacity:0}25%{opacity:1}to{transform:translateY(30px);opacity:0}}
.drift{animation:dr 4s ease-in-out infinite}
@keyframes dr{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}
.flash{animation:fl 1s steps(2) infinite}
@keyframes fl{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="320" height="240" rx="24" fill="#F4F0FF"/><ellipse cx="160" cy="218" rx="130" ry="10" fill="#E4DCF5"/><g class=""><g transform="translate(85.0 65.0) rotate(0 75.0 75.0) scale(1.5)"><rect x="56" y="54" width="34" height="8" rx="3" fill="#8A5A3A"/><rect x="82" y="22" width="8" height="40" rx="3" fill="#8A5A3A"/><path d="M60 62v26M86 62v26" stroke="#8A5A3A" stroke-width="6" stroke-linecap="round"/><circle cx="64" cy="22" r="11" fill="#FFD9B8"/><path d="M53 20q2-12 12-11q9 1 10 9q-10-4-22 2z" fill="#2B2B2B"/><rect x="56" y="32" width="18" height="24" rx="7" fill="#F2643A"/><path d="M60 56h-22v26" fill="none" stroke="#2F5DA8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></g></g><g class="pulse"><path d="M230 60.0 l-10 16 l22 -14z" fill="#fff" stroke="#2F5DA8" stroke-width="3" stroke-linejoin="round"/><rect x="194.0" y="18.0" width="92" height="44" rx="22.0" fill="#fff" stroke="#2F5DA8" stroke-width="3"/><rect x="226" y="58.0" width="16" height="6" fill="#fff"/><text x="240" y="47.92" text-anchor="middle" font-size="22" font-weight="900" fill="#2F5DA8" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif">歇一歇</text></g></svg>