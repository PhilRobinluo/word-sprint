<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="巴士来啦，排队上车"><style>
.bob{animation:bob 2.4s ease-in-out infinite}.bob2{animation:bob 2.4s ease-in-out -1.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.pulse{animation:pl 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.spin{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes sp{to{transform:rotate(360deg)}}
.fall{animation:fa 1.2s linear infinite}.f2{animation-delay:-.4s}.f3{animation-delay:-.8s}
@keyframes fa{from{transform:translateY(-24px);opacity:0}25%{opacity:1}to{transform:translateY(30px);opacity:0}}
.drift{animation:dr 4s ease-in-out infinite}
@keyframes dr{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}
.flash{animation:fl 1s steps(2) infinite}
@keyframes fl{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="320" height="240" rx="24" fill="#EAF5FF"/><rect x="0" y="196" width="320" height="44" fill="#C9CFD6"/><g class="bob"><g transform="translate(95.0 65.0) rotate(0 85.0 85.0) scale(1.7)"><rect x="6" y="20" width="88" height="56" rx="10" fill="#FFC93C"/><rect x="12" y="28" width="16" height="18" rx="3" fill="#7FB2E5"/><rect x="32" y="28" width="16" height="18" rx="3" fill="#7FB2E5"/><rect x="52" y="28" width="16" height="18" rx="3" fill="#7FB2E5"/><rect x="74" y="28" width="14" height="36" rx="3" fill="#7FB2E5"/><rect x="6" y="52" width="88" height="6" fill="#F2643A"/><circle cx="26" cy="78" r="9" fill="#2B2B2B"/><circle cx="74" cy="78" r="9" fill="#2B2B2B"/><circle cx="26" cy="78" r="3.5" fill="#ccc"/><circle cx="74" cy="78" r="3.5" fill="#ccc"/></g></g><g class="bob2"><rect x="26" y="174" width="40" height="38" rx="13" fill="#F2643A"/><circle cx="46" cy="152" r="23" fill="#FFD9B8"/><path d="M23 149 q2 -24 24 -24 q20 0 23 20 q-9 -9 -20 -7 q-13 2 -27 11z" fill="#2B2B2B"/><circle cx="38" cy="153" r="3" fill="#2B2B2B"/><circle cx="54" cy="153" r="3" fill="#2B2B2B"/><circle cx="32" cy="161" r="4" fill="#FFB0A0" opacity=".7"/><circle cx="60" cy="161" r="4" fill="#FFB0A0" opacity=".7"/><path d="M40 164 q6 7 12 0" fill="none" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round"/></g><g class="pulse"><path d="M80 59.0 l-10 16 l22 -14z" fill="#fff" stroke="#2F5DA8" stroke-width="3" stroke-linejoin="round"/><rect x="37.0" y="19.0" width="106" height="42" rx="21.0" fill="#fff" stroke="#2F5DA8" stroke-width="3"/><rect x="76" y="57.0" width="16" height="6" fill="#fff"/><text x="90" y="47.2" text-anchor="middle" font-size="20" font-weight="900" fill="#2F5DA8" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif">巴士来啦</text></g></svg>