<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="水龙头嗒、嗒地滴水"><style>
.bob{animation:bob 2.4s ease-in-out infinite}.bob2{animation:bob 2.4s ease-in-out -1.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.pulse{animation:pl 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.spin{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes sp{to{transform:rotate(360deg)}}
.fall{animation:fa 1.2s linear infinite}.f2{animation-delay:-.4s}.f3{animation-delay:-.8s}
@keyframes fa{from{transform:translateY(-24px);opacity:0}25%{opacity:1}to{transform:translateY(30px);opacity:0}}
.drift{animation:dr 4s ease-in-out infinite}
@keyframes dr{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}
.flash{animation:fl 1s steps(2) infinite}
@keyframes fl{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="320" height="240" rx="24" fill="#E9F3FF"/><rect x="0" y="0" width="320" height="120" fill="#DCE8F5"/><g class=""><g transform="translate(75.0 25.0) rotate(0 75.0 75.0) scale(1.5)"><rect x="10" y="26" width="16" height="22" rx="3" fill="#9AA6B2"/><path d="M26 32h40q12 0 12 12v8h-14v-6H26z" fill="#B7C3CF"/><rect x="34" y="18" width="18" height="8" rx="3" fill="#2F5DA8"/><rect x="40" y="22" width="6" height="12" fill="#9AA6B2"/><path d="M71 62q-6 10 0 14q6-4 0-14z" fill="#7FB2E5"/><path d="M71 80q-5 8 0 11q5-3 0-11z" fill="#7FB2E5"/></g></g><g fill="#7FB2E5"><circle class="fall" cx="182" cy="160" r="6"/><circle class="fall f2" cx="182" cy="150" r="5"/></g><ellipse cx="182" cy="214" rx="40" ry="8" fill="#BFD7F0"/><g class="pulse"><path d="M250 60.0 l-10 16 l22 -14z" fill="#fff" stroke="#2F5DA8" stroke-width="3" stroke-linejoin="round"/><rect x="214.0" y="18.0" width="92" height="44" rx="22.0" fill="#fff" stroke="#2F5DA8" stroke-width="3"/><rect x="246" y="58.0" width="16" height="6" fill="#fff"/><text x="260" y="47.92" text-anchor="middle" font-size="22" font-weight="900" fill="#2F5DA8" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif">嗒、嗒</text></g></svg>