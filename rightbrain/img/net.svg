<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="捏着网兜去捞小鱼"><style>
.bob{animation:bob 2.4s ease-in-out infinite}.bob2{animation:bob 2.4s ease-in-out -1.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.pulse{animation:pl 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.spin{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes sp{to{transform:rotate(360deg)}}
.fall{animation:fa 1.2s linear infinite}.f2{animation-delay:-.4s}.f3{animation-delay:-.8s}
@keyframes fa{from{transform:translateY(-24px);opacity:0}25%{opacity:1}to{transform:translateY(30px);opacity:0}}
.drift{animation:dr 4s ease-in-out infinite}
@keyframes dr{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}
.flash{animation:fl 1s steps(2) infinite}
@keyframes fl{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="320" height="240" rx="24" fill="#E3F4FF"/><path d="M0 170 q40 -10 80 0 t80 0 t80 0 t80 0 V240 H0z" fill="#7FB2E5"/><g class="sway"><g transform="translate(75.0 35.0) rotate(0 75.0 75.0) scale(1.5)"><path d="M8 92l40-40" stroke="#8A5A3A" stroke-width="7" stroke-linecap="round"/><circle cx="64" cy="36" r="26" fill="none" stroke="#2F5DA8" stroke-width="5"/><g stroke="#9DB7DA" stroke-width="2"><path d="M44 22l40 30M42 36l36 24M52 14l34 26M48 58l30-38M60 62l24-34M42 46l30-34"/></g></g></g><g class="bob"><g transform="translate(190.0 160.0) rotate(0 30.0 30.0) scale(0.6)"><path d="M14 50q24-30 56-6l20-14v40l-20-14q-32 24-56-6z" fill="#F2643A"/><path d="M40 34q8 16 0 32" fill="none" stroke="#fff" stroke-width="3" opacity=".6"/><circle cx="28" cy="47" r="4" fill="#2B2B2B"/><circle cx="29" cy="46" r="1.3" fill="#fff"/></g></g><g class="pulse"><path d="M60 60.0 l-10 16 l22 -14z" fill="#fff" stroke="#2F5DA8" stroke-width="3" stroke-linejoin="round"/><rect x="24.0" y="18.0" width="92" height="44" rx="22.0" fill="#fff" stroke="#2F5DA8" stroke-width="3"/><rect x="56" y="58.0" width="16" height="6" fill="#fff"/><text x="70" y="47.92" text-anchor="middle" font-size="22" font-weight="900" fill="#2F5DA8" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif">捏住！</text></g></svg>