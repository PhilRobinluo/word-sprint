<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="拼图拼好了，用图钉钉在墙上"><style>
.bob{animation:bob 2.4s ease-in-out infinite}.bob2{animation:bob 2.4s ease-in-out -1.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.pulse{animation:pl 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.spin{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes sp{to{transform:rotate(360deg)}}
.fall{animation:fa 1.2s linear infinite}.f2{animation-delay:-.4s}.f3{animation-delay:-.8s}
@keyframes fa{from{transform:translateY(-24px);opacity:0}25%{opacity:1}to{transform:translateY(30px);opacity:0}}
.drift{animation:dr 4s ease-in-out infinite}
@keyframes dr{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}
.flash{animation:fl 1s steps(2) infinite}
@keyframes fl{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="320" height="240" rx="24" fill="#F3EEE6"/><rect x="40" y="30" width="240" height="180" rx="10" fill="#E9DCC6"/><g class=""><g transform="translate(95.0 65.0) rotate(0 65.0 65.0) scale(1.3)"><path d="M14 20h28q-2-10 8-10t8 10h28v28q10-2 10 8t-10 8v26H58q2-10-8-10t-8 10H14V62q10 2 10-8t-10-8z" fill="#FFC93C" stroke="#E2A400" stroke-width="3"/></g></g><g class="bob"><g transform="translate(130.0 40.0) rotate(0 30.0 30.0) scale(0.6)"><circle cx="50" cy="32" r="22" fill="#E5484D"/><ellipse cx="44" cy="26" rx="6" ry="8" fill="#fff" opacity=".4"/><rect x="40" y="48" width="20" height="10" rx="3" fill="#C23B3F"/><path d="M50 58v30" stroke="#999" stroke-width="4" stroke-linecap="round"/></g></g><g class="pulse"><path d="M246 64.0 l-10 16 l22 -14z" fill="#fff" stroke="#2F5DA8" stroke-width="3" stroke-linejoin="round"/><rect x="221.0" y="22.0" width="70" height="44" rx="22.0" fill="#fff" stroke="#2F5DA8" stroke-width="3"/><rect x="242" y="62.0" width="16" height="6" fill="#fff"/><text x="256" y="51.92" text-anchor="middle" font-size="22" font-weight="900" fill="#2F5DA8" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif">拼！</text></g></svg>