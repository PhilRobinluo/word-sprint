ale(0.7)"><path d="M10 40h80q-4 40-40 40t-40-40z" fill="#fff" stroke="#2F5DA8" stroke-width="4"/><path d="M18 52h64" stroke="#2F5DA8" stroke-width="3" stroke-dasharray="6 5"/></g></g><g class=""><g transform="translate(175.0 51.0) rotate(0 35.0 35.0) scale(0.7)"><path d="M10 40h80q-4 40-40 40t-40-40z" fill="#fff" stroke="#2F5DA8" stroke-width="4"/><path d="M18 52h64" stroke="#2F5DA8" stroke-width="3" stroke-dasharray="6 5"/></g></g><g class="bob"><g transform="translate(238.0 50.0) rotate(0 30.0 30.0) scale(0.6)"><g fill="#fff" stroke="#7FB2E5" stroke-width="3"><circle cx="30" cy="70" r="10"/><circle cx="56" cy="50" r="14"/><circle cx="76" cy="76" r="8"/><circle cx="40" cy="30" r="7"/></g></g></g><g class="pulse"><path d="M100 50.0 l-10 16 l22 -14z" fill="#fff" stroke="#2F5DA8" stroke-width="3" stroke-linejoin="round"/><rect x="64.0" y="8.0" width="92" height="44" rx="22.0" fill="#fff" stroke="#2F5DA8" stroke-width="3"/><rect x="96" y="48.0" width="16" height="6" fill="#fff"/><text x="110" y="37.92" text-anchor="middle" font-size="22" font-weight="900" fill="#2F5DA8" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif">洗碗！</text></g><g class=""><g transform="translate(270.0 10.0) rotate(0 20.0 20.0) scale(0.4)"><circle cx="50" cy="44" r="34" fill="#3A8DDE" opacity=".18"/><text x="50" y="62" text-anchor="middle" font-size="54" font-family="Fredoka,'Baloo 2','Arial Rounded MT Bold',Arial,sans-serif" font-weight="700" fill="#3A8DDE">7</text><circle cx="22" cy="80" r="4" fill="#3A8DDE"/><circle cx="36" cy="80" r="4" fill="#3A8DDE"/><circle cx="50" cy="80" r="4" fill="#3A8DDE"/><circle cx="64" cy="80" r="4" fill="#3A8DDE"/><circle cx="78" cy="80" r="4" fill="#3A8DDE"/><circle cx="22" cy="90" r="4" fill="#3A8DDE"/><circle cx="36" cy="90" r="4" fill="#3A8DDE"/></g></g></svg>