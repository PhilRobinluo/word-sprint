<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF6E9">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23F2643A%22/%3E%3Ctext x=%2216%22 y=%2223%22 font-size=%2218%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22Arial%22 font-weight=%22bold%22%3Ea%3C/text%3E%3C/svg%3E">
<title>右脑记单词 · 字母小乐园</title>
<style>
:root{
  --bg:#FFF6E9; --paper:#FFFFFF; --ink:#2A2A3A; --muted:#7A7468;
  --orange:#F2643A; --orange-d:#D94E25; --blue:#2F5DA8; --blue-l:#E6EEFB; --blue-d:#1E4589;
  --yellow:#FFC93C; --green:#2EA868; --green-l:#E3F6EA; --red:#E5484D; --red-l:#FDE8E8; --pink:#FF8FB1;
  --line:#F0E4D2; --shadow:0 10px 30px rgba(140,90,30,.12),0 2px 6px rgba(140,90,30,.08);
  --r:28px;
  --word-font:"Fredoka","Baloo 2",ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Nunito","Varela Round",system-ui,sans-serif;
  --zh-font:"PingFang SC","HarmonyOS Sans SC","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--zh-font);font-size:16px;line-height:1.5}
body{background:radial-gradient(600px 400px at 110% -10%,#FFE2C2 0,transparent 60%),radial-gradient(500px 380px at -20% 110%,#DCEBFF 0,transparent 60%),var(--bg);background-attachment:fixed;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
/* 回主页：除登录页和主页外始终固定在左上角，比视频弹窗还靠上 */
.homefab{position:fixed;z-index:95;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));width:64px;height:64px;border-radius:20px;background:#fff;border:3px solid #FFD2BD;box-shadow:0 4px 0 #F5C3AA,0 8px 18px rgba(60,30,10,.14);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;color:#E2552B;font-weight:900;font-size:13px;line-height:1.1;transition:transform .12s}
.homefab svg{width:32px;height:32px}
.homefab:active{transform:translateY(3px);box-shadow:0 1px 0 #F5C3AA}
.homefab[hidden]{display:none}
body.hasfab .app>.screen>.top:first-child{padding-left:70px}
@media (max-width:520px){ /* 手机竖屏：给左上角按钮让位，轮次条只写当前这一轮，其余缩成小圆点 */
  body.hasfab .top .passbar span:not(.on){font-size:0;padding:0;width:12px;height:12px;border-radius:50%;background:#EADBC5;box-shadow:none}
  body.hasfab .top .passbar span.done:not(.on){background:var(--yellow)}
  body.hasfab .top .passbar i{width:6px}
  body.hasfab .top .pill{padding:0 10px;height:46px}
}
[tabindex="-1"]:focus{outline:none}
.app{max-width:560px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom));min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:52px;margin-bottom:10px}
.pill{display:inline-flex;align-items:center;gap:6px;height:48px;padding:0 14px;border-radius:999px;background:#fff;box-shadow:0 3px 0 var(--line);font-weight:900;font-size:20px;font-family:var(--word-font)}
.pill svg{width:26px;height:26px}
.ib{width:52px;height:52px;border-radius:18px;background:#fff;box-shadow:0 3px 0 var(--line);display:grid;place-items:center;font-size:24px;flex:none;transition:transform .12s}
.ib:active{transform:translateY(2px)}
.ib.off{opacity:.55}
.ib svg{width:26px;height:26px}
.dots{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
.dots i{width:12px;height:12px;border-radius:50%;background:#EADBC5;transition:all .3s}
.dots i.on{background:var(--orange);width:26px;border-radius:7px}
.dots i.done{background:var(--yellow)}
.screen{flex:1;display:flex;flex-direction:column;animation:enter .38s cubic-bezier(.2,.9,.3,1.2)}
@keyframes enter{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.btn{min-height:64px;border-radius:22px;padding:0 24px;font-size:22px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;transition:transform .12s,box-shadow .12s,opacity .2s}
.btn:active{transform:translateY(3px)}
.btn.primary{background:var(--orange);color:#fff;box-shadow:0 6px 0 var(--orange-d)}
.btn.blue{background:var(--blue);color:#fff;box-shadow:0 6px 0 var(--blue-d)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--line)}
.btn svg{width:30px;height:30px;flex:none}
.btn.sm{min-height:48px;font-size:16px;border-radius:16px;padding:0 14px;width:auto}
.btn[disabled]{opacity:.4;pointer-events:none}
.pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.small{font-size:14px;color:var(--muted)}
h2{font-size:22px;margin:0 0 8px;font-weight:900}
.hidden{display:none!important}

/* 首页：小路 */
.hello{display:flex;align-items:center;gap:12px;margin:2px 0 10px}
.mascot{width:76px;height:76px;flex:none;animation:bob 2.6s ease-in-out infinite}
.say-bub{background:#fff;border-radius:22px;padding:12px 16px;font-weight:900;font-size:20px;box-shadow:var(--shadow);position:relative}
.say-bub:before{content:"";position:absolute;left:-10px;top:24px;border:10px solid transparent;border-right-color:#fff;border-left:0}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.path{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 14px 10px;display:flex;flex-direction:column;gap:0}
.stop{display:flex;align-items:center;gap:14px;padding:10px 6px;position:relative}
.stop + .stop:before{content:"";position:absolute;left:41px;top:-14px;height:24px;border-left:5px dotted #E8D6BC}
.stop .ic{width:72px;height:72px;border-radius:24px;display:grid;place-items:center;font-size:36px;flex:none;background:#F6EEE2;box-shadow:0 4px 0 var(--line);font-family:var(--word-font);font-weight:700}
.stop.now .ic{background:var(--yellow);box-shadow:0 4px 0 #E2A400;animation:bob 1.8s ease-in-out infinite}
.stop.done .ic{background:var(--green-l);box-shadow:0 4px 0 #B7E2C7}
.stop .nm{font-weight:900;font-size:20px}
.stop .meta{flex:1;min-width:0}
.prog{height:12px;border-radius:8px;background:#F3E7D6;margin-top:6px;overflow:hidden}
.prog b{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--yellow),var(--orange));transition:width .8s}
.stop .cnt{font-size:14px;color:var(--muted);font-weight:800;margin-top:2px}
.stop .here{position:absolute;right:6px;top:6px;background:var(--orange);color:#fff;font-weight:900;font-size:13px;border-radius:999px;padding:2px 10px}
.go{margin:18px auto 6px;width:156px;height:156px;border-radius:50%;background:var(--orange);color:#fff;box-shadow:0 8px 0 var(--orange-d),0 14px 30px rgba(242,100,58,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;font-weight:900;gap:2px}
.go svg{width:64px;height:64px}
.go:active{transform:translateY(4px);box-shadow:0 4px 0 var(--orange-d)}
.preview{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.preview span{min-width:52px;height:52px;border-radius:16px;background:#fff;box-shadow:0 3px 0 var(--line);display:grid;place-items:center;font-size:28px;padding:0 8px;font-family:var(--word-font);font-weight:700;color:var(--blue)}
.shelf{margin-top:auto;padding-top:14px}
.shelf .row{display:flex;gap:6px;overflow:hidden;align-items:center;font-size:26px;min-height:40px}
.shelf .row em{font-style:normal;font-size:14px;color:var(--muted);font-weight:800;margin-right:4px;white-space:nowrap}
.parentbtn{position:relative;overflow:hidden;font-size:14px;color:var(--muted);font-weight:800;width:auto;padding:0 12px}
.parentbtn i{position:absolute;left:0;bottom:0;height:4px;background:var(--blue);width:0}
.parentbtn.hold i{transition:width 1.2s linear;width:100%}

/* 学习卡 */
.card{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 16px 14px;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;overflow:hidden}
.rv{transition:opacity .35s,transform .45s cubic-bezier(.2,.9,.3,1.4)}
.card.sync .rv:not(.on){opacity:.12;transform:scale(.92)}
.bigword{font-family:var(--word-font);font-weight:700;color:var(--orange);letter-spacing:1px;line-height:1.05;white-space:nowrap}
.scene{width:100%;max-width:340px;aspect-ratio:4/3;margin:8px auto 4px;border-radius:22px;background:#FFFCF6;display:grid;place-items:center;overflow:hidden}
.scene img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.scene.png img{width:86%;height:96%}
.scene .emo{font-size:130px;line-height:1}
.slogan{text-wrap:balance;font-size:26px;font-weight:900;color:var(--blue);line-height:1.3;margin:6px 4px 0}
.meaning{font-size:40px;font-weight:900;color:var(--orange);margin:4px 0 0;letter-spacing:4px}
.ctrl{display:flex;gap:12px;align-items:center;justify-content:center;width:100%;margin-top:14px}
.round{width:64px;height:64px;border-radius:50%;background:var(--blue-l);display:grid;place-items:center;flex:none;transition:transform .15s}
.round svg{width:30px;height:30px}
.round:active{transform:scale(.92)}
.round.playing{background:var(--blue);animation:ring 1s infinite}
.round.playing svg path{stroke:#fff}.round.playing svg path[fill="#2F5DA8"]{fill:#fff}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(47,93,168,.45)}100%{box-shadow:0 0 0 16px rgba(47,93,168,0)}}
.vidbtn{height:64px;border-radius:22px;background:#FFF0E0;color:var(--orange-d);font-weight:900;font-size:19px;padding:0 16px;display:flex;align-items:center;gap:6px;box-shadow:0 4px 0 #F4D3B4}
.vidbtn svg{width:26px;height:26px}
.next{width:84px;height:84px;border-radius:50%;background:var(--orange);display:grid;place-items:center;box-shadow:0 6px 0 var(--orange-d);margin-left:auto;transition:opacity .3s,transform .12s}
.next svg{width:42px;height:42px}
.next[disabled]{opacity:.3;pointer-events:none}
.relink{display:inline-flex;align-items:center;gap:6px;background:#FFF5D6;color:#8A5A00;font-weight:900;border-radius:999px;padding:6px 16px;margin-bottom:6px;font-size:17px}
.letterbig{display:flex;align-items:flex-end;justify-content:center;gap:14px;font-family:var(--word-font);font-weight:700;line-height:1}
.letterbig .lo{font-size:120px}
.letterbig .up{font-size:64px;opacity:.65;margin-bottom:14px}
.letterimg{width:100%;max-width:300px;aspect-ratio:4/3;margin:4px auto 0}
.letterimg img{width:100%;height:100%;object-fit:contain}
.badges{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.badge{border-radius:20px;padding:6px 16px;font-weight:900;font-size:24px;background:var(--blue-l);color:var(--blue);display:flex;align-items:center;gap:6px}
.badge.snd{background:#FFF0E0;color:var(--orange-d)}
.badge .en{font-family:var(--word-font);font-weight:600}
.tiles{display:flex;justify-content:center;gap:14px;margin:12px 0 4px;transition:gap .6s cubic-bezier(.2,.9,.3,1.3)}
.tiles.merge{gap:0}
.tile{width:84px;height:100px;border-radius:22px;background:#fff;box-shadow:0 5px 0 var(--line),0 0 0 3px var(--line) inset;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--word-font);font-weight:700;font-size:58px;line-height:1;color:var(--blue);transition:all .5s}
.tile small{font-family:var(--zh-font);font-size:15px;color:var(--muted);font-weight:800;margin-top:4px}
.tile.lit{background:var(--yellow);color:#fff;transform:translateY(-8px);box-shadow:0 5px 0 #E2A400}
.tiles.merge .tile{border-radius:0;box-shadow:0 5px 0 var(--line);background:#FFF5D6;color:var(--orange)}
.tiles.merge .tile:first-child{border-radius:22px 0 0 22px}.tiles.merge .tile:last-child{border-radius:0 22px 22px 0}
.tiles.merge .tile small{opacity:0}
.linkline{font-size:19px;font-weight:800;color:var(--blue);margin:4px 6px 0;text-wrap:balance}

/* 合上 */
.closebox{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.closebox .big{font-size:120px;animation:bob 1.4s ease-in-out infinite}
.closebox b{font-size:30px;font-weight:900}

/* 测验 */
.qcard{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 16px 18px;text-align:center;position:relative}
.qtop{display:flex;align-items:center;justify-content:center;gap:16px}
.qspk{width:96px;height:96px;border-radius:50%;background:var(--blue);display:grid;place-items:center;box-shadow:0 6px 0 var(--blue-d)}
.qspk svg{width:48px;height:48px}
.qspk svg path{fill:#fff;stroke:#fff}
.qspk.playing{animation:ring 1s infinite}
.qword{font-family:var(--word-font);font-weight:700;color:var(--blue);white-space:nowrap}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.opt{min-height:150px;border-radius:26px;background:#fff;box-shadow:0 6px 0 var(--line),0 0 0 3px var(--line) inset;transition:transform .12s,background .2s,box-shadow .2s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px 6px}
.opt .pic{font-size:72px;line-height:1.05;width:96px;height:96px;object-fit:contain;display:block}
.opt .pic.t{display:grid;place-items:center}
.preview span .pv{width:40px;height:40px;object-fit:contain;display:block}
.ipa{font-family:"DejaVu Sans","Lucida Sans Unicode","Arial Unicode MS","Segoe UI",sans-serif;font-weight:700}
.tip{margin:8px auto 0;max-width:340px;background:#FFF8EC;border-radius:16px;padding:8px 12px;font-size:16px;font-weight:700;color:#7A5A2E;text-align:center;line-height:1.45}
button.badge{border:0;cursor:pointer}
button.tile{border:0;cursor:pointer;padding:0}
.stop.review .ic{background:#E7F0FF}
.stop .cnt.rvw{font-size:16px;color:var(--blue)}
.week{display:flex;gap:6px;align-items:flex-end;height:90px;margin:4px 0 12px}
.wb{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.wb i{display:block;width:70%;min-height:3px;background:var(--orange);border-radius:6px 6px 0 0}
.wb span{font-size:11px;color:var(--muted);font-weight:700}
.credits{overflow-x:auto}.credits table{border-collapse:collapse;font-size:12px;width:100%}.credits td,.credits th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
.opt .lab{font-size:16px;font-weight:800;color:var(--muted)}
.opt .let{font-family:var(--word-font);font-weight:700;font-size:96px;line-height:1}
.opt:active{transform:translateY(3px)}
.opt.right{background:var(--green-l);box-shadow:0 6px 0 #B7E2C7,0 0 0 4px var(--green) inset;animation:yay .5s}
.opt.wrong{background:var(--red-l);box-shadow:0 6px 0 #F5C2C2,0 0 0 4px var(--red) inset;animation:shake .45s}
.opt.dim{opacity:.35}
@keyframes yay{40%{transform:scale(1.08)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.fb{min-height:44px;margin-top:12px;font-size:28px;font-weight:900}
.fb.ok{color:var(--green)}.fb.no{color:var(--red)}
.flystar{position:fixed;z-index:60;width:54px;height:54px;pointer-events:none;transition:all .8s cubic-bezier(.5,-0.3,.6,1)}

/* 结果 */
.result{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center}
.bigstars{display:flex;justify-content:center;gap:6px;margin:10px 0;flex-wrap:wrap}
.bigstars svg{width:56px;height:56px;animation:starpop .5s backwards}
@keyframes starpop{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
.stickers{display:flex;justify-content:center;flex-wrap:wrap;gap:22px;margin:16px 0}
.stk{width:84px;height:84px;border-radius:50%;background:#fff;box-shadow:0 0 0 5px #fff,0 0 0 8px var(--yellow),0 8px 18px rgba(0,0,0,.12);display:grid;place-items:center;font-size:46px;animation:stick .6s backwards;font-family:var(--word-font);font-weight:700;color:var(--blue)}
.stk.miss{filter:grayscale(1);opacity:.5;box-shadow:0 0 0 5px #fff,0 0 0 8px #E0D3C0}
@keyframes stick{from{transform:scale(2) rotate(30deg);opacity:0}to{transform:none;opacity:1}}
.rtitle{font-size:32px;font-weight:900;margin:8px 0 0}

/* 视频弹窗 */
.modal{position:fixed;inset:0;z-index:80;background:rgba(20,20,35,.82);display:flex;align-items:center;justify-content:center;padding:16px;animation:enter .25s}
.modal video{max-width:100%;max-height:calc(100dvh - 120px);aspect-ratio:9/16;border-radius:24px;background:#000;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.modal .x{position:absolute;top:max(14px,env(safe-area-inset-top));right:14px;width:60px;height:60px;border-radius:50%;background:#fff;font-size:30px;font-weight:900;display:grid;place-items:center}
.tapme{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:70;background:var(--blue);color:#fff;font-weight:900;font-size:20px;border-radius:999px;padding:14px 22px;box-shadow:0 6px 0 var(--blue-d)}

/* 家长/老师 */
.panel{background:var(--paper);border-radius:22px;box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.tabs button{flex:none;height:44px;border-radius:14px;padding:0 14px;background:#fff;box-shadow:0 0 0 2px var(--line) inset;font-weight:800;font-size:15px}
.tabs button.on{background:var(--blue);color:#fff;box-shadow:none}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{min-height:44px;border-radius:14px;padding:0 14px;background:#FFFBF4;box-shadow:0 0 0 2px var(--line) inset;font-weight:800;font-size:15px}
.seg button.on{background:var(--blue-l);box-shadow:0 0 0 3px var(--blue) inset;color:var(--blue)}
.pick{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pick button{min-height:44px;border-radius:14px;padding:0 12px;background:#FFFBF4;box-shadow:0 0 0 2px var(--line) inset;font-weight:700;font-size:15px;display:flex;align-items:center;gap:4px}
.pick button b{font-family:var(--word-font);font-weight:600;font-size:17px;color:var(--blue)}
.pick button.on{background:var(--green-l);box-shadow:0 0 0 3px var(--green) inset}
.pick button.seen:after{content:"✓";color:var(--green);font-weight:900;margin-left:2px}
.lst{display:flex;flex-direction:column;gap:10px}
.lst article{border:2px solid var(--line);border-radius:16px;padding:10px 12px;background:#FFFCF7;font-size:14px}
.lst h3{margin:0 0 4px;font-family:var(--word-font);font-weight:600;font-size:20px;color:var(--blue);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lst p{margin:3px 0}
.st{font-family:var(--zh-font);font-size:12px;border-radius:999px;padding:2px 9px;font-weight:800}
.st.ok{background:var(--green-l);color:var(--green)}.st.wait{background:#FFF0E0;color:#B8601E}.st.ph{background:#EEE;color:#666}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px}
.field input{height:48px;border-radius:14px;border:2px solid var(--line);padding:0 12px;font-size:17px;font-family:inherit;background:#FFFBF4;width:100%}
.count{font-family:var(--word-font);font-weight:700;font-size:64px;color:var(--orange);line-height:1}
.timer{position:absolute;left:0;top:0;height:7px;background:var(--yellow);width:0}
.timer.run{animation:fill var(--secs,10s) linear forwards}
@keyframes fill{to{width:100%}}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;z-index:90;animation:enter .3s}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
.rec{font-size:14px;border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}

@media (min-width:900px){
  .app{max-width:980px;padding-top:24px}
  .narrow{max-width:600px;margin:0 auto;width:100%}

/* ---------- 兑换码 ---------- */
.gate{justify-content:center;align-items:center;padding:24px 8px 40px;text-align:center}
.gate .mascot{width:132px;height:132px;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.gate h1{margin:10px 0 4px;font-size:28px;font-weight:900}
.gate .sub{text-wrap:balance;margin:0 0 20px;color:var(--muted);font-size:17px;font-weight:700}
.gatecard{width:100%;max-width:420px;background:var(--paper);border-radius:var(--r);padding:22px 20px 20px;box-shadow:var(--shadow)}
.gatecard label{display:block;text-align:left;font-weight:900;font-size:15px;color:var(--muted);margin:0 0 8px 4px}
.codein{width:100%;height:68px;border-radius:20px;border:3px solid var(--line);background:#FFFBF4;text-align:center;font-family:var(--word-font);font-weight:700;font-size:28px;letter-spacing:3px;color:var(--blue);text-transform:uppercase;outline:none;transition:border-color .15s,box-shadow .15s}
.codein:focus{border-color:var(--blue);box-shadow:0 0 0 5px var(--blue-l)}
.codein.bad{border-color:var(--red);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.gatecard .btn{margin-top:16px}
.gatemsg{min-height:24px;margin:12px 0 0;font-weight:800;font-size:15px;color:var(--red)}
.gatemsg.info{color:var(--blue)}
.gatehelp{max-width:420px;margin:18px auto 0;color:var(--muted);font-size:14px;line-height:1.7}
.gatehelp b{color:var(--ink);white-space:nowrap}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.5);border-top-color:#fff;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.gatebadges{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:0 0 18px}
.gatebadges span{background:#fff;border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px;box-shadow:0 3px 0 var(--line)}

/* ---------- 三轮学习 ---------- */
.passbar{display:flex;align-items:center;justify-content:center;gap:4px;margin:0 0 6px;flex-wrap:nowrap}
.passbar span{font-size:13px;font-weight:900;color:var(--muted);background:#fff;border-radius:999px;padding:3px 10px;box-shadow:0 2px 0 var(--line);white-space:nowrap;transition:all .25s}
.passbar span.on{background:var(--orange);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.12);transform:scale(1.06)}
.passbar span.done{color:var(--green,#3BB273)}
.passbar i{width:10px;height:3px;border-radius:2px;background:var(--line)}
.top .passbar+.dots{margin-top:0}
.qbig{font-family:var(--word-font);font-weight:700;font-size:96px;line-height:1;margin:4px 0}
.qmiss{display:flex;gap:6px;justify-content:center;font-family:var(--word-font);font-weight:700;font-size:58px;line-height:1.1;color:var(--blue)}
.qmiss .gap{min-width:44px;border-bottom:5px solid var(--orange);color:var(--orange);animation:bob 1.6s ease-in-out infinite}
.qpic{display:flex;justify-content:center;margin:8px 0 0}
.qpic .pic{width:96px;height:96px;object-fit:contain}
.qpic .pic.t{font-size:72px;line-height:96px;width:auto;height:auto}
.qpic.big .pic{width:160px;height:160px}
.qpic.big .pic.t{font-size:110px;line-height:160px}
.midcol{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.wordopt{min-height:84px}
.wordopt .w{font-family:var(--word-font);font-weight:700;color:var(--blue)}
.passintro .passitems{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px;max-width:360px}
.passintro .passitems span{background:#fff;border-radius:14px;padding:6px 14px;font-family:var(--word-font);font-weight:700;font-size:20px;box-shadow:0 3px 0 var(--line)}

/* ---------- 账号 ---------- */
.authcard{padding-top:14px}
.seg{display:flex;background:var(--bg,#FFF3E0);border-radius:999px;padding:5px;margin:0 0 16px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:11px 8px;font:inherit;font-weight:900;font-size:16px;color:var(--muted);cursor:pointer;transition:background .15s,color .15s}
.seg button.on{background:#fff;color:var(--blue);box-shadow:0 3px 0 var(--line)}
.fin{width:100%;height:54px;border-radius:16px;border:3px solid var(--line);background:#FFFBF4;padding:0 14px;font:inherit;font-size:17px;font-weight:700;color:var(--ink);outline:none;margin:0 0 14px;transition:border-color .15s,box-shadow .15s;-webkit-appearance:none;appearance:none}
select.fin{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:32px}
.fin:focus{border-color:var(--blue);box-shadow:0 0 0 5px var(--blue-l)}
.fin.bad{border-color:var(--red);animation:shake .35s}
.frow{display:flex;gap:10px}.frow>div{flex:1;min-width:0}
.authcard .btn{margin-top:4px}
.whoami{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 14px;padding:10px 14px;background:var(--blue-l);border-radius:14px;font-weight:800;font-size:15px;color:var(--ink);text-align:left}
.whoami span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkbtn{border:0;background:none;color:var(--blue);font:inherit;font-weight:900;font-size:15px;cursor:pointer;white-space:nowrap;padding:4px}

/* ---------- 自由选站 / 单元页 / 速览 ---------- */
button.stop{width:100%;text-align:left;border-radius:22px;transition:background .15s,transform .12s;font:inherit;color:inherit}
button.stop:active{transform:scale(.98)}
button.stop:hover{background:#FFF8EE}
.stop .chev{flex:none;width:36px;height:36px;border-radius:12px;background:#F6EEE2;display:grid;place-items:center;font-weight:900;color:var(--muted);font-size:20px}
.stop .rec{position:absolute;right:52px;top:6px;background:var(--orange);color:#fff;font-weight:900;font-size:12px;border-radius:999px;padding:2px 10px}
.freehint{text-align:center;font-size:14px;color:var(--muted);font-weight:800;margin:8px 0 0}
.mhead{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:flex;gap:14px;align-items:center;margin-bottom:12px}
.mhead .ic{width:68px;height:68px;border-radius:22px;display:grid;place-items:center;font-size:34px;background:var(--yellow);box-shadow:0 4px 0 #E2A400;font-family:var(--word-font);font-weight:700;flex:none}
.mhead h1{margin:0;font-size:24px;font-weight:900}.mhead .meta{flex:1;min-width:0}
.mact{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.mact .btn{min-height:58px;font-size:17px;white-space:nowrap;padding:0 10px;gap:6px}
.gtitle{font-weight:900;font-size:15px;color:var(--muted);margin:14px 4px 8px}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.icell{position:relative;background:#fff;border-radius:20px;box-shadow:0 4px 0 var(--line),0 0 0 2px var(--line) inset;min-height:96px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .12s}
.icell:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line),0 0 0 2px var(--line) inset}
.icell .lt{font-family:var(--word-font);font-weight:700;font-size:38px;line-height:1}
.icell .gi{width:48px;height:48px;object-fit:contain}
.icell .w{font-family:var(--word-font);font-weight:700;font-size:16px;color:var(--ink);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icell .st{position:absolute;top:5px;right:6px;width:20px;height:20px;border-radius:50%;font-size:12px;font-weight:900;display:grid;place-items:center;color:#fff}
.icell .st.ok{background:var(--green)}.icell .st.miss{background:var(--red)}.icell .st.seen{background:#E8D6BC}
.icell.next{box-shadow:0 4px 0 #E2A400,0 0 0 3px var(--yellow) inset}
.legend{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;font-size:13px;color:var(--muted);font-weight:800;margin:14px 0 4px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.browse .card{touch-action:pan-y;user-select:none}
.bnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.bnav .count{font-weight:900;font-size:18px;color:var(--muted);font-family:var(--word-font)}
.bnav .arrow{width:64px;height:64px;border-radius:50%;background:#fff;box-shadow:0 5px 0 var(--line);display:grid;place-items:center;font-size:30px;font-weight:900;color:var(--blue)}
.bnav .arrow[disabled]{opacity:.3}
.bctrl{display:flex;gap:12px;justify-content:center;margin-top:12px}
.bbar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:12px}.bbar b{display:block;height:100%;background:var(--orange);transition:width .2s}
.bhint{text-align:center;font-size:13px;color:var(--muted);margin-top:8px;font-weight:700}
@keyframes inL{from{opacity:0;transform:translateX(40px)}}@keyframes inR{from{opacity:0;transform:translateX(-40px)}}
.browse .card.fl{animation:inL .25s ease-out}.browse .card.fr{animation:inR .25s ease-out}
</style>

let C = null; const ITEMS = new Map();
async function loadContent(){
  try {
    const r = await fetch('content/words.json', { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    C = await r.json(); C._from = 'content/words.json';
  } catch (e) {
    const raw = document.getElementById('fallback-content').textContent.replace('/*CONTENT-START*/', '').replace('/*CONTENT-END*/', '');
    C = JSON.parse(raw); C._from = '内置副本';
  }
  ITEMS.clear();
  (C.letters || []).forEach(l => ITEMS.set(l.id, { type: 'letter', id: l.id, d: l }));
  (C.blends || []).forEach(b => ITEMS.set(b.id, { type: 'blend', id: b.id, d: b }));
  (C.words || []).forEach(w => ITEMS.set('W-' + w.word, { type: 'word', id: 'W-' + w.word, d: w }));
}
const it = id => ITEMS.get(id);
const label = x => x.type === 'letter' ? x.d.letter : x.d.word;
const pic = x => x.type === 'letter' ? x.d.letter : (x.d.emoji || '❓');
const icon = x => x.type === 'letter' ? null : (x.d.icon || null);
const icoHTML = (x, cls = 'ico') => icon(x) ? `<img class="${cls}" src="${esc(icon(x))}" alt="" loading="lazy" decoding="async">` : `<span class="${cls} t">${esc(pic(x))}</span>`;
const phonOf = ch => (it('L-' + ch) || {}).d?.phon;
const ipaOf = ch => (it('L-' + ch) || {}).d?.sound || '';
const INTERVALS = [1, 3, 7, 14, 30]; // 答对后隔几天再复习（逐级拉长）；答错明天再来
const dueIds = (p, t) => Object.keys(p.items).filter(id => it(id) && p.items[id].due && p.items[id].due <= t);
const zh = x => x.type === 'letter' ? '字母 ' + x.d.letter : x.d.meaning;
const videoOf = x => x.d.video || (x.type === 'blend' && x.d.memory_word ? (it('W-' + x.d.memory_word) || {}).d?.video : null) || null;
function wordSize(word, max, min){ const avail = Math.min(window.innerWidth || 390, 600) - 80; return Math.max(min, Math.min(max, Math.floor(avail / (word.length * 0.6)))); }

/* ---------- 学习路径：字母 → 拼读小词 → 记忆单词 ---------- */
function wordList(grade){
  const all = C.words || [];
  if (grade === '三四年级') return all.filter(w => w.group === '三四年级').map(w => 'W-' + w.word);
  const g1 = all.filter(w => w.group !== '三四年级').map(w => w.word);
  const first = (C.day1 || []).filter(w => g1.includes(w)); // 第一组记忆单词＝最早那 5 个
  return first.concat(g1.filter(w => !first.includes(w))).map(w => 'W-' + w);
}
function buildPath(grade){
  const steps = [], groups = C.letter_groups || [];
  const wc = chunk(wordList(grade), [5, 5, 5]);
  groups.forEach((g, gi) => {
    splitN(g.map(l => 'L-' + l), 4).forEach(ids => steps.push({ station: 'letter', ids, g: gi + 1 }));
    const bl = (C.blends || []).filter(b => b.unlock_group === gi + 1).map(b => b.id);
    if (bl.length) splitN(bl, 4).forEach(ids => steps.push({ station: 'blend', ids, g: gi + 1 }));
    if (wc[gi]) steps.push({ station: 'word', ids: wc[gi], g: gi + 1 });
  });
  wc.slice(groups.length).forEach(ids => steps.push({ station: 'word', ids }));
  return steps;
}
function stationStats(p){
  const g = p.settings.grade, seen = id => !!p.items[id], ok = id => p.items[id] && p.items[id].state === 'ok';
  const L = (C.letters || []).map(l => l.id), B = (C.blends || []).map(b => b.id), W = wordList(g);
  const mk = (ids, name, ic) => ({ name, ic, total: ids.length, seen: ids.filter(seen).length, ok: ids.filter(ok).length });
  const due = dueIds(p, today());
  return { letter: mk(L, '字母小乐园', 'Aa'), blend: mk(B, '拼读小词', '🧩'), word: mk(W, '记忆单词', '🧠'), review: { name: '复习', ic: '🔁', total: due.length, seen: 0, ok: 0, due } };
}
function blendUnlocked(p, b){ return (b.letters || []).every(l => p.items['L-' + l]); }
function nextSession(){
  const p = P(), t = today(), size = p.settings.size || 0;
  if (p.override && p.override.ids && p.override.ids.length) return { kind: 'pick', ids: p.override.ids.filter(it).slice(0, 8), station: it(p.override.ids[0])?.type || 'word' };
  const weak = id => p.items[id].state !== 'ok';   // 错题和中途离开没考完的，先看卡再考
  const due = dueIds(p, t).sort((a, b) => (weak(a) ? 0 : 1) - (weak(b) ? 0 : 1) || (p.items[a].due < p.items[b].due ? -1 : 1));
  const reviewedToday = (p.sessions || []).some(s => s.kind === 'review' && (s.day || (s.at || '').slice(0, 10)) === t);
  if (due.length && (!reviewedToday || weak(due[0]))) { const ids = due.slice(0, size || 5); return { kind: 'review', ids, learnN: ids.filter(weak).length, station: 'review' }; }
  for (const st of buildPath(p.settings.grade)) {
    let fresh = st.ids.filter(id => !p.items[id] && it(id));
    if (st.station === 'blend') fresh = fresh.filter(id => blendUnlocked(p, it(id).d));
    if (fresh.length) return { kind: 'new', ids: size ? fresh.slice(0, size) : fresh, station: st.station, g: st.g };
  }
  const okIds = shuffle(Object.keys(p.items).filter(id => it(id)));
  return { kind: 'free', ids: okIds.slice(0, size || 4), station: okIds.length ? it(okIds[0]).type : 'letter' };
}

/* ---------- 声音：一个共用 <audio>，第一次点按钮时解锁 ---------- */
const A = document.getElementById('voice');
let unlocked = false, seqTok = 0, curFin = null, playingBtn = null;
const muted = () => !!P().settings.muted;
function play(src){
  return new Promise(res => {
    if (!src || muted()) { res(false); return; }
    let done = false, to = null;
    const fin = ok => { if (done) return; done = true; clearTimeout(to); A.onended = A.onerror = null; curFin = null; res(ok); };
    curFin = fin;
    A.onended = () => fin(true); A.onerror = () => fin(false);
    try { A.src = src; } catch (e) { fin(false); return; }
    to = setTimeout(() => fin(false), 30000);
    let pr; try { pr = A.play(); } catch (e) { fin(false); return; }
    if (!pr || typeof pr.then !== 'function') { fin(false); return; } // 没有真正的音频（如测试环境）
    pr.then(() => { unlocked = true; }).catch(err => { fin(false); if (err && err.name === 'NotAllowedError') needTap(); });
  });
}
async function say(list, btn){ // 依次播放；被新的播放打断就返回 false
  const tok = ++seqTok; markBtn(btn);
  let ok = true;
  for (const src of [].concat(list).filter(Boolean)) { if (tok !== seqTok) return false; ok = (await play(src)) && ok; }
  if (tok === seqTok) markBtn(null);
  return tok === seqTok && ok;
}
function hush(){ seqTok++; markBtn(null); if (curFin) curFin(false); try { A.pause(); } catch (e) {} }
function markBtn(b){ if (playingBtn) playingBtn.classList.remove('playing'); playingBtn = b || null; if (b) b.classList.add('playing'); }
function ui(k){ return C.ui_audio && C.ui_audio[k]; }
function unlockAudio(){ // 必须在点击里同步调用：iOS 只有手势里的 play() 才放行
  if (unlocked) return;
  try { A.muted = true; A.src = ui('next') || ''; const pr = A.play(); if (pr && pr.then) pr.then(() => { A.pause(); A.muted = false; unlocked = true; }).catch(() => { A.muted = false; }); else A.muted = false; } catch (e) { A.muted = false; }
}
function needTap(){
  if (document.querySelector('.tapme')) return;
  const b = document.createElement('button'); b.className = 'tapme'; b.textContent = '🔊 点我听声音';
  b.onclick = () => { b.remove(); unlockAudio(); const rp = $app.querySelector('[data-act="replay"],[data-act="qsay"]'); if (rp) rp.click(); };
  document.body.appendChild(b);
}

/* 跟着旁白的时间点亮卡片上的元素（data-at = 第几句开始出现） */
let syncRaf = 0;
function syncCard(card, cues){
  cancelAnimationFrame(syncRaf);
  const els = [...card.querySelectorAll('.rv')], lit = card.querySelectorAll('[data-lit]');
  const showAll = () => { card.classList.remove('sync'); els.forEach(e => e.classList.add('on')); lit.forEach(e => e.classList.remove('lit')); const tl = card.querySelector('.tiles'); if (tl) tl.classList.add('merge'); };
  if (muted() || !cues || !cues.length) { showAll(); return showAll; }
  card.classList.add('sync'); els.forEach(e => e.classList.remove('on'));
  const tick = () => {
    if (!card.isConnected) return;
    const t = A.currentTime || 0; let idx = -1;
    cues.forEach((c, i) => { if (t >= c[0] - 0.05) idx = i; });
    els.forEach(e => e.classList.toggle('on', idx >= +e.dataset.at));
    if (lit.length) { // 拼读：每个字母在自己的声音响起时亮，之后合拢成词
      const tl = card.querySelector('.tiles'); let cm = {}; try { cm = JSON.parse(tl.dataset.cues || '{}'); } catch (e) {}
      const ti = cm.tiles || [], mg = cues[cm.merge];
      lit.forEach((e, i) => { const c = cues[ti[i]]; e.classList.toggle('lit', !!c && t >= c[0] - 0.05 && t < c[1] + 0.2); });
      if (mg) tl.classList.toggle('merge', t >= mg[0] - 0.1);
    }
    if (!A.paused) syncRaf = requestAnimationFrame(tick);
  };
  A.addEventListener('playing', tick, { once: true });
  return showAll;
}

/* ---------- 屏幕 ---------- */
let S = null, ROUTE = 'home';
function show(html, cls = ''){
  clearTimers(); hush(); closeVideo(true);
  const key = cls === 'gate' ? null : S ? 'session' : ROUTE;
  homeFab(key && key !== 'home');
  document.querySelectorAll('.tapme').forEach(e => e.remove());
  $app.innerHTML = `<section class="screen ${cls}">${html}</section>`;
  const h = $app.querySelector('[data-focus]'); if (h) h.focus({ preventScroll: true });
  window.scrollTo(0, 0);
  if (key) syncRoute(key); else HIST = [];
}
/* ---------- 回主页按钮 + 返回键 ----------
   HIST 记着本页面压进浏览器历史的每一层（home / module:x / browse:x / parent / session / video），
   手机或浏览器的返回键退回上一层；点「回主页」直接退到最底层。 */
let HIST = [], HNONCE = 0, POPSKIP = 0;
const LASTBR = {};
function syncRoute(key){
  const top = HIST.length - 1;
  if (top >= 0 && HIST[top] === key) return;
  try {
    if (top < 0) { HNONCE = Date.now(); history.replaceState({ rb: 0, n: HNONCE }, ''); HIST = [key]; return; }
    const j = HIST.lastIndexOf(key);
    if (j >= 0) { HIST.length = j + 1; POPSKIP++; history.go(j - top); return; }
    history.pushState({ rb: HIST.length, n: HNONCE }, ''); HIST.push(key);
  } catch (e) {}
}
let FAB = null;
function homeFab(on){
  if (!FAB) {
    FAB = document.createElement('button'); FAB.id = 'homefab'; FAB.className = 'homefab'; FAB.type = 'button'; FAB.setAttribute('aria-label', '回主页');
    FAB.innerHTML = ICON.home.replace('#F2643A', '#E2552B') + '<span>主页</span>';
    FAB.addEventListener('click', goHome);
    document.body.appendChild(FAB);
  }
  FAB.hidden = !on; document.body.classList.toggle('hasfab', !!on);
}
// 中途离开：把已经看过的新卡记成「学过」（今天进复习），测验没答完的不算错
function savePartial(){
  if (!S || S.trial || S.phase === 'result' || !S.ids) return;
  const seen = S.phase === 'learn' && !S.relink ? S.ids.slice(0, Math.min(S.learnN, S.i + (S.cardStarted ? 1 : 0))) : S.ids.slice(0, S.learnN);
  const p = P(), t = today(), fresh = seen.filter(id => !p.items[id] && it(id));
  if (fresh.length) setP(q => { fresh.forEach(id => { if (!q.items[id]) q.items[id] = { n: 0, first: t, last: t, state: 'seen', box: 0, due: t, misses: 0 }; }); });
}
function leaveSession(){ savePartial(); hush(); closeVideo(true); }
function goHome(){ leaveSession(); renderHome(); if (typeof syncSoon === 'function') syncSoon(800); }
window.addEventListener('popstate', e => {
  if (POPSKIP > 0) { POPSKIP--; return; }
  if (!HIST.length) return;   // 登录页
  const st = e.state;
  if (!st || st.n !== HNONCE || !(st.rb < HIST.length)) { leaveSession(); HIST = []; renderHome(); return; }
  const key = HIST[st.rb]; HIST.length = st.rb + 1;
  const hadVideo = !!document.querySelector('.modal');
  closeVideo(true);
  if (key === 'session' && S) { if (!hadVideo) { leaveSession(); renderHome(); } return; }
  leaveSession();
  if (key.startsWith('module:')) renderModule(key.slice(7));
  else if (key.startsWith('browse:')) renderBrowse(key.slice(7), LASTBR[key.slice(7)] || 0);
  else if (key === 'parent') renderParent();
  else renderHome();
});
window.addEventListener('pagehide', savePartial);
function muteBtn(){ const m = muted(); return `<button class="ib ${m ? 'off' : ''}" data-act="mute" aria-label="${m ? '打开声音' : '关掉声音'}">${m ? ICON.mute : ICON.speaker}</button>`; }
function topbar(mid = ''){
  const p = P();
  if (S && S.from && MODS[S.from] && S.phase !== 'result') mid = `<button class="ib" data-act="quit" aria-label="回到${MODS[S.from].name}">✕</button>` + mid;
  return `<div class="top"><span class="pill" aria-label="星星 ${p.stars} 颗">${ICON.star('#FFC93C')}<span id="starN">${p.stars}</span></span>${mid}${muteBtn()}</div>`;
}
function passbar(){
  if (!S || !S.multi) return '';
  const names = ['第1轮', '第2轮', '综合测试'];
  return `<div class="passbar" aria-label="${names[S.pass - 1]}">${names.map((n, k) => `<span class="${k + 1 < S.pass ? 'done' : k + 1 === S.pass ? 'on' : ''}">${k + 1 < S.pass ? '✓ ' : ''}${n}</span>`).join('<i></i>')}</div>`;
}
function dots(){ if (!S) return ''; const list = S.phase === 'learn' && !S.relink ? S.ids : S.q; const pb = passbar(); return (pb ? '<div class="midcol">' + pb : '') + `<div class="dots" aria-label="第 ${S.i + 1} 个，共 ${list.length} 个">${list.map((_, k) => `<i class="${k < S.i ? 'done' : k === S.i ? 'on' : ''}"></i>`).join('')}</div>` + (pb ? '</div>' : ''); }

/* 首页 */
function renderHome(){
  S = null; ROUTE = 'home';
  const p = P(), st = stationStats(p), nx = nextSession();
  const cur = nx.station;
  const order = ['review', 'letter', 'blend', 'word'];
  const stops = order.map(k => {
    const s = st[k], done = k !== 'review' && s.seen >= s.total && s.total > 0;

    const pct = s.total ? Math.round(s.seen / s.total * 100) : 0;
    const meta = k === 'review' ? `<div class="cnt rvw">今天要复习 ${s.total} 个</div>` : `<div class="prog"><b style="width:${pct}%"></b></div><div class="cnt">${s.seen} / ${s.total}</div>`;
    const tap = k === 'review' ? 'data-act="go"' : `data-act="module" data-m="${k}"`;
    return `<button class="stop ${k} ${k === cur ? 'now' : ''} ${done ? 'done' : ''}" ${tap} aria-label="${s.name}${k === cur ? '（推荐）' : ''}">
      <div class="ic" aria-hidden="true">${s.ic}</div>

  }).join('');

  const bub = nx.kind === 'review' ? '先来复习一下！' : nx.kind === 'pick' ? '老师选好啦！' : nx.kind === 'free' ? '都学完啦！再玩一次？' : cur === 'letter' ? '去字母小乐园！' : cur === 'blend' ? '来拼小词！' : '来记单词！';
  const stk = (p.stickers || []).slice(-12).reverse().map(s => `<span>${esc(s)}</span>`).join('');

    <div class="path" aria-label="学习路线">${stops}</div>

    <button class="go pulse" data-act="go" aria-label="开始">${ICON.play}开始</button>
    <div class="preview" aria-label="这次要学">${prev}</div>
    <div class="shelf"><div class="row"><em>我的贴纸</em>${stk || '<span class="small">学会一个就送一张</span>'}</div></div>`);
  if (unlocked) later(() => say(ui('hello')), 400);

/* 开始一轮 */
function startSession(plan, opts = {}){
  const p = P();
  if (plan.kind === 'pick') setP(q => { q.override = null; });
  S = { kind: plan.kind, ids: plan.ids.slice(), learnN: plan.learnN ?? plan.ids.length, i: 0, phase: 'learn', res: {}, stars: 0, started: isoLocal(), trial: !!opts.trial, trialName: opts.name || '', from: plan.from || null };
  S.q = S.ids.map(id => ({ id, t: 'std' })); S.pass = 1; S.res1 = {}; S.res2 = {}; S.res3 = {};
  S.multi = !S.trial && (S.kind === 'new' || S.kind === 'pick' || (S.kind === 'choose' && S.ids.some(id => !p.items[id])));
  if (!S.ids.length) { renderHome(); return; }
  if (S.trial) { renderLearn(); return; }
  if (S.kind === 'review' && !S.learnN) { renderClose(ui('review')); return; }
  renderLearn(true);
  say(ui(S.kind === 'review' ? 'review' : 'start')).then(() => { if (S && S.phase === 'learn' && S.i === 0 && !S.cardStarted) startNarr(); });
}

/* 学习卡 */

/* 测验 */
function optionsFor(x){
  const pool = [...ITEMS.values()].filter(y => y.type === x.type && y.id !== x.id);
  let picks = [];
  if (x.type === 'letter') {
    const sess = (S ? S.ids : []).filter(id => id !== x.id && it(id)?.type === 'letter').map(it);
    const learned = Object.keys(P().items).filter(id => id.startsWith('L-') && id !== x.id).map(it).filter(Boolean);
    const grp = pool.filter(y => y.d.group === x.d.group);
    picks = shuffle(sess).concat(shuffle(learned), shuffle(grp), shuffle(pool));
  } else {
    const dd = (x.d.distractors || []).map(w => it((x.type === 'blend' ? 'B-' : 'W-') + w)).filter(Boolean);
    picks = dd.concat(shuffle(pool));
  }
  const seen = new Set([pic(x)]); const out = [];
  for (const y of picks) { if (out.length >= 3) break; if (!seen.has(pic(y)) && (x.type === 'letter' || y.d.meaning !== x.d.meaning)) { seen.add(pic(y)); out.push(y); } }
  return shuffle([x].concat(out));
}
function qPrompt(x, t = 'std'){

}

function answer(k, el){

function finish(){

  const res = S.multi ? Object.fromEntries(ids.map(id => [id, [S.res, S.res2, S.res3].every(r => r[id] === 'ok') ? 'ok' : 'miss'])) : S.res;
  const okIds = ids.filter(id => res[id] === 'ok');
  const p = setP(p => {
    ids.forEach(id => {
      const prev = p.items[id] || { n: 0, first: t };
      const ok = res[id] === 'ok';
      const box = ok ? Math.min((prev.box || 0) + 1, INTERVALS.length) : 0;
      p.items[id] = { ...prev, n: (prev.n || 0) + 1, last: t, state: ok ? 'ok' : 'miss', box, due: addDays(t, ok ? INTERVALS[box - 1] : 1), result: res[id], misses: (prev.misses || 0) + (ok ? 0 : 1) };
    });
    okIds.forEach(id => p.stickers.push(pic(it(id))));
    p.sessions.push({ at: isoLocal(), day: t, kind: S.kind, ids, res, stars: S.stars, ...(S.multi ? { passes: [S.res, S.res2, S.res3] } : {}) });
    if (p.sessions.length > 200) p.sessions = p.sessions.slice(-200);

  const stk = ids.map((id, k) => `<span class="stk ${res[id] === 'ok' ? '' : 'miss'}" style="animation-delay:${0.4 + k * 0.18}s">${esc(pic(it(id)))}</span>`).join('');
  const title = all ? '全对啦！' : good ? '真棒！' : '明天再来！';
  S.phase = 'result';
  show(`${topbar()}<div class="result narrow">
    ${ICON.mascot.replace('class="mascot"', 'class="mascot" style="width:110px;height:110px"')}

    <div style="width:100%;margin-top:auto;padding-top:20px"><button class="btn primary" data-act="home" data-focus tabindex="-1">${ICON.home.replace('#F2643A', '#fff').replace('<svg', '<svg width="28" height="28"')} ${S.from && MODS[S.from] ? '回到' + MODS[S.from].name : '回家'}</button></div></div>`);

}

/* 10 秒测试 */
function trialLearn(x){
  const card = $app.querySelector('.card'); const tm = card.querySelector('.timer');
  tm.style.setProperty('--secs', '10s'); tm.classList.add('run');
  const showAll = syncCard(card, x.d.cues);
  let narrDone = false, timeDone = false;
  const go = () => { if (narrDone && timeDone && S && S.phase === 'learn') { S.shown.push(Date.now() - S.t0); S.i++; if (S.i < S.ids.length) renderLearn(); else renderClose(); } };
  S.t0 = Date.now(); S.shown = S.shown || [];
  say(x.d.audio, card.querySelector('[data-act="replay"]')).then(() => { showAll(); narrDone = true; go(); });
  later(() => { timeDone = true; go(); }, 10000);
}
function trialAnswer(x, right, choice){
  const btns = [...$app.querySelectorAll('.opt')];
  const el = btns[S.opts.indexOf(choice)]; el.classList.add(right ? 'right' : 'wrong');
  S.trialRes = S.trialRes || [];
  S.trialRes.push({ id: x.id, label: label(x), correct: right, chose: choice === x.id ? label(x) : zh(it(choice)), ms: Date.now() - S.qStart, shown_ms: (S.shown || [])[S.trialRes.length] || null });
  later(() => { S.i++; if (S.i < S.ids.length) renderQuiz(); else trialDone(); }, 700);
}
function trialDone(){
  const r = S.trialRes || [], score = r.filter(x => x.correct).length;
  const rec = { at: isoLocal(), name: S.trialName, version: C.version, total: r.length, score, items: r, rule: '每个看 10 秒（旁白没完就等完），全部看完后测，一次作答' };
  const recs = load(TKEY, []); recs.push(rec); save(TKEY, recs);
  S.phase = 'result';
  show(`<div class="top"><b>10 秒测试结果</b>${muteBtn()}</div><div class="panel narrow" style="text-align:center"><div class="count">${score}/${r.length}</div>
    <p>${esc(rec.name || '未填名字')} · ${esc(rec.at.replace('T', ' ').slice(0, 16))}</p>

function download(name, obj){
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();

}

/* ---------- 彩带 ---------- */
function confetti(n = 160){
  if (!window.matchMedia || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.getElementById('confetti'), ctx = c.getContext && c.getContext('2d');
  if (!ctx) return;
  c.hidden = false; c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio; ctx.scale(devicePixelRatio, devicePixelRatio);
  const cols = ['#F2643A', '#FFC93C', '#2F5DA8', '#2EA868', '#FF8FB1'];
  const ps = Array.from({ length: n }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 80, y: innerHeight * .3, vx: (Math.random() - .5) * 13, vy: -Math.random() * 13 - 4, r: Math.random() * 6 + 4, c: cols[Math.floor(Math.random() * cols.length)], a: Math.random() * 6, va: (Math.random() - .5) * .3 }));
  const t0 = performance.now();
  (function tick(t){
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    ps.forEach(p => { p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore(); });
    if (t - t0 < 2800) requestAnimationFrame(tick); else { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, c.width, c.height); c.hidden = true; }
  })(t0);
}

/* 进度合并：同一个账号在多台设备上学，按每个条目的最近学习时间合并 */
function mergeProgress(local, remote){

  const out = { ...local, items: { ...local.items } };
  Object.entries(remote.items).forEach(([id, r]) => {
    const l = out.items[id];
    const key = v => [(v && v.last) || '', (v && v.n) || 0];
    if (!l) out.items[id] = r;
    else { const [la, ln] = key(l), [ra, rn] = key(r); if (ra > la || (ra === la && rn > ln)) out.items[id] = r; }
  });
  const seen = new Set((local.sessions || []).map(s => s.at));
  out.sessions = (local.sessions || []).concat((remote.sessions || []).filter(s => !seen.has(s.at))).sort((a, b) => (a.at || '') < (b.at || '') ? -1 : 1).slice(-400);
  out.stars = Math.max(local.stars || 0, remote.stars || 0);

}
