<style>
:root{
  /* 护眼配色（默认）：暖米黄纸张底、深灰褐文字、低饱和蓝；正文对比度 ≥ 4.5 */
  --bg:#F6EEDC; --paper:#FFF9EE; --paper2:#FBF2E2; --ink:#3D3229; --muted:#6F6253;
  --orange:#E8603A; --orange-d:#C9572F; --blue:#3E6290; --blue-l:#E7ECF2; --blue-d:#2D4A70; --blue-t:#3E6290;
  --yellow:#F5C04A; --green:#3A9A66; --green-l:#E4F1E6; --red:#D2524F; --red-l:#F8E6E1; --pink:#E98FA8;

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--zh-font);font-size:16px;line-height:1.5}
body{background:radial-gradient(600px 400px at 110% -10%,var(--glow1) 0,transparent 60%),radial-gradient(500px 380px at -20% 110%,var(--glow2) 0,transparent 60%),var(--bg);background-attachment:fixed;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
/* 回主页：除登录页和主页外始终固定在左上角，比视频弹窗还靠上 */
.homefab{position:fixed;z-index:95;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));width:64px;height:64px;border-radius:20px;background:var(--paper);border:3px solid #FFD2BD;box-shadow:0 4px 0 #F5C3AA,0 8px 18px rgba(60,30,10,.14);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;color:#E2552B;font-weight:900;font-size:13px;line-height:1.1;transition:transform .12s}
.homefab svg{width:32px;height:32px}
.homefab:active{transform:translateY(3px);box-shadow:0 1px 0 #F5C3AA}
.homefab[hidden],[hidden]{display:none!important}
/* 跟读 */
.rp{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:84px 16px 20px;background:radial-gradient(circle at 50% 45%,rgba(255,248,234,.94),rgba(246,236,218,.97));animation:rpIn .28s ease-out}
html[data-theme=dark] .rp{background:radial-gradient(circle at 50% 45%,rgba(40,33,27,.96),rgba(24,20,16,.98))}
.rp.out{opacity:0;transition:opacity .25s;pointer-events:none}
@keyframes rpIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.rp-card{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.rp-tgt{display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:24px;padding:10px 22px;box-shadow:0 4px 0 var(--line,#E7D9C1)}
.rp-tgt img{width:64px;height:64px;object-fit:contain}.rp-tgt b{font-size:52px;line-height:1.1;font-family:var(--en,inherit);color:var(--ink);letter-spacing:.02em}
.rp-mic{--v:0;position:relative;width:170px;height:170px;display:flex;align-items:center;justify-content:center;margin:6px 0}
.rp-mic span{position:relative;z-index:2;width:128px;height:128px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#C9BBA6;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.08);transition:background .25s,transform .08s;transform:scale(calc(1 + var(--v) * .12))}
.rp-mic span svg{width:66px;height:66px}
.rp-mic i{position:absolute;inset:0;border-radius:50%;background:#FF8A3D;opacity:0;transform:scale(calc(.75 + var(--v) * .5));transition:transform .09s linear,opacity .2s}
.rp-mic i+i{inset:-18px;background:#FFC93C;transform:scale(calc(.7 + var(--v) * .6))}
.rp.listen .rp-mic span{background:linear-gradient(160deg,#FF9A4D,#F2662F)}
.rp.listen .rp-mic i{opacity:.22}.rp.listen .rp-mic.on i{opacity:.38}
.rp.listen .rp-mic:not(.on) span{animation:rpBreath 1.6s ease-in-out infinite}
@keyframes rpBreath{50%{transform:scale(1.06)}}
.rp.heard .rp-mic span{background:#3BAA5C;animation:rpPop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes rpPop{0%{transform:scale(.7)}100%{transform:scale(1)}}
.rp.louder .rp-mic span,.rp.again .rp-mic span{background:#FFB547;animation:rpWiggle .6s ease-in-out 2}
@keyframes rpWiggle{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.rp.guide .rp-mic,.rp.tap .rp-mic{display:none}
.rp-guide-art{width:100%;max-width:300px}.rp-finger{animation:rpTapF 1.2s ease-in-out infinite}
@keyframes rpTapF{50%{transform:translate(-4px,-6px)}}
.rp-st{font-size:24px;font-weight:900;color:var(--ink);min-height:34px;line-height:1.35}.rp-st small{display:block;font-size:16px;font-weight:600;color:var(--muted)}
.rp-act{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;min-height:10px}
.rp-act .btn{width:auto}
.rp.tap .rp-act{flex-direction:column;align-items:center;gap:18px}
.rp-tapbtn{width:220px;height:220px;border-radius:50%;border:0;background:radial-gradient(circle at 40% 35%,#FFB06B,#F2662F);color:#fff;font:inherit;font-size:28px;font-weight:900;box-shadow:0 10px 0 #C9481F,0 16px 30px rgba(200,72,31,.3);animation:rpBreath 1.6s ease-in-out infinite;cursor:pointer}
.rp-tapbtn:active{transform:translateY(6px);box-shadow:0 4px 0 #C9481F}
.rp-skip{position:fixed;right:max(14px,env(safe-area-inset-right));top:max(18px,env(safe-area-inset-top));border:0;background:var(--paper);color:var(--muted);font:inherit;font-size:17px;font-weight:800;padding:12px 18px;border-radius:999px;box-shadow:0 3px 0 var(--line,#E7D9C1);cursor:pointer}
@media (prefers-reduced-motion:reduce){.rp,.rp *{animation:none!important;transition:none!important}}
.albumbtn{display:flex;align-items:center;gap:12px;width:100%;margin:14px 0 4px;padding:10px 14px;border:0;border-radius:20px;background:var(--paper);box-shadow:0 4px 0 var(--line,#E7D9C1);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.albumbtn img,.albumbtn .ab-ic{width:52px;height:52px;object-fit:contain;font-size:38px;line-height:52px;text-align:center}
.albumbtn .ab-t{flex:1;display:flex;flex-direction:column}.albumbtn b{font-size:19px}.albumbtn small{color:var(--muted);font-size:14px}.albumbtn .ab-go{font-size:30px;color:var(--muted)}
.album h1{font-size:26px;margin:6px 0 10px;text-align:center}
.aprog{display:flex;align-items:center;gap:10px}.abar{flex:1;height:14px;border-radius:999px;background:var(--paper2)}.abar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#FFC93C,#FF8A3D)}
.anext{background:var(--paper);border-radius:16px;padding:10px 14px;margin:12px 0;font-size:17px}.anext small{color:var(--muted);font-size:14px}
.agrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.acell{background:var(--paper);border-radius:16px;padding:6px 4px 4px;text-align:center;font-size:13px;color:var(--muted)}
.acell img{width:100%;aspect-ratio:1;object-fit:contain;display:block}.acell.got span{color:var(--ink);font-weight:800}
.acell img.sil{filter:brightness(0) opacity(.12)}html[data-theme=dark] .acell img.sil{filter:brightness(0) invert(1) opacity(.12)}
.opt.hintme{box-shadow:0 0 0 5px #FFC93C,0 0 22px 6px rgba(255,201,60,.55);animation:hintglow 1.4s ease-in-out infinite}
@keyframes hintglow{50%{box-shadow:0 0 0 7px #FFC93C,0 0 30px 10px rgba(255,201,60,.35)}}
@media (prefers-reduced-motion:reduce){.opt.hintme{animation:none}}
.redotag{display:inline-block;margin:0 auto 6px;padding:4px 14px;border-radius:999px;background:var(--paper2);color:var(--ink);font-weight:800;font-size:16px}
body.hasfab .app>.screen>.top:first-child{padding-left:70px}
@media (max-width:520px){ /* 手机竖屏：给左上角按钮让位，轮次条只写当前这一轮，其余缩成小圆点 */
  body.hasfab .top .passbar span:not(.on){font-size:0;padding:0;width:12px;height:12px;border-radius:50%;background:#EADBC5;box-shadow:none}
  body.hasfab .top .passbar span.done:not(.on){background:var(--yellow)}
  body.hasfab .top .passbar i{width:6px}
  body.hasfab .top .pill{padding:0 10px;height:46px}
}
[tabindex="-1"]:focus{outline:none}
.app{max-width:560px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom));min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:52px;margin-bottom:10px}
.pill{display:inline-flex;align-items:center;gap:6px;height:48px;padding:0 14px;border-radius:999px;background:var(--paper);box-shadow:0 3px 0 var(--line);font-weight:900;font-size:20px;font-family:var(--word-font)}
.pill svg{width:26px;height:26px}
.ib{width:52px;height:52px;border-radius:18px;background:var(--paper);box-shadow:0 3px 0 var(--line);display:grid;place-items:center;font-size:24px;flex:none;transition:transform .12s}
.ib:active{transform:translateY(2px)}
.ib.off{opacity:.55}
.ib svg{width:26px;height:26px}
.dots{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
.dots i{width:12px;height:12px;border-radius:50%;background:#EADBC5;transition:all .3s}
.dots i.on{background:var(--orange);width:26px;border-radius:7px}
.dots i.done{background:var(--yellow)}
.screen{flex:1;display:flex;flex-direction:column;animation:enter .38s cubic-bezier(.2,.9,.3,1.2)}
@keyframes enter{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.btn{min-height:64px;border-radius:22px;padding:0 24px;font-size:22px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;transition:transform .12s,box-shadow .12s,opacity .2s}
.btn:active{transform:translateY(3px)}
.btn.primary{background:var(--orange);color:#fff;box-shadow:0 6px 0 var(--orange-d)}
.btn.blue{background:var(--blue);color:#fff;box-shadow:0 6px 0 var(--blue-d)}
.btn.ghost{background:var(--paper);color:var(--ink);box-shadow:0 5px 0 var(--line)}
.btn svg{width:30px;height:30px;flex:none}
.btn.sm{min-height:48px;font-size:16px;border-radius:16px;padding:0 14px;width:auto}

.pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.small{font-size:14px;color:var(--muted)}
h2{font-size:22px;margin:0 0 8px;font-weight:900}
.hidden{display:none!important}

/* 首页：小路 */
.hello{display:flex;align-items:center;gap:12px;margin:2px 0 10px}
.mascot{width:76px;height:76px;flex:none;animation:bob 2.6s ease-in-out infinite}
.say-bub{background:var(--paper);border-radius:22px;padding:12px 16px;font-weight:900;font-size:20px;box-shadow:var(--shadow);position:relative}
.say-bub:before{content:"";position:absolute;left:-10px;top:24px;border:10px solid transparent;border-right-color:#fff;border-left:0}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.path{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 14px 10px;display:flex;flex-direction:column;gap:0}
.stop{display:flex;align-items:center;gap:14px;padding:10px 6px;position:relative}
.stop + .stop:before{content:"";position:absolute;left:41px;top:-14px;height:24px;border-left:5px dotted #E8D6BC}
.stop .ic{width:72px;height:72px;border-radius:24px;display:grid;place-items:center;font-size:36px;flex:none;background:#F6EEE2;box-shadow:0 4px 0 var(--line);font-family:var(--word-font);font-weight:700}
.stop.now .ic{background:var(--yellow);box-shadow:0 4px 0 #E2A400;animation:bob 1.8s ease-in-out infinite}
.stop.done .ic{background:var(--green-l);box-shadow:0 4px 0 #B7E2C7}
.stop .nm{font-weight:900;font-size:20px}
.stop .meta{flex:1;min-width:0}
.prog{height:12px;border-radius:8px;background:#F3E7D6;margin-top:6px;overflow:hidden}
.prog b{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--yellow),var(--orange));transition:width .8s}
.stop .cnt{font-size:14px;color:var(--muted);font-weight:800;margin-top:2px}
.stop .here{position:absolute;right:6px;top:6px;background:var(--orange);color:#fff;font-weight:900;font-size:13px;border-radius:999px;padding:2px 10px}
.go{margin:18px auto 6px;width:156px;height:156px;border-radius:50%;background:var(--orange);color:#fff;box-shadow:0 8px 0 var(--orange-d),0 14px 30px rgba(242,100,58,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;font-weight:900;gap:2px}
.go svg{width:64px;height:64px}
.go.big{width:min(78vw,300px);height:auto;min-height:150px;border-radius:40px;padding:18px 16px;margin:14px auto 8px;gap:4px}
.go.big svg{width:58px;height:58px}
.go .gl{font-size:34px;letter-spacing:2px;line-height:1.1}
.go .gh{font-size:16px;font-weight:800;opacity:.92;background:rgba(255,255,255,.18);border-radius:999px;padding:3px 12px}
.go.gamesentry{background:linear-gradient(180deg,#3A8DDE,#2F5DA8);box-shadow:0 8px 0 #1E3F7A;margin:14px 0 6px;width:100%;height:auto;min-height:0;border-radius:28px;padding:14px 16px;display:flex;flex-direction:column;align-items:center;gap:6px;animation:none}
.go.gamesentry:active{box-shadow:0 4px 0 #1E3F7A}
.go.gamesentry .gl{font-size:28px}
.go.gamesentry.locked{background:linear-gradient(180deg,#9BB3CF,#7D97B5);box-shadow:0 8px 0 #5E7590}
.gamesentry .gstars{display:flex;gap:4px;font-size:20px;line-height:1}.gamesentry .gstars i{font-style:normal;color:rgba(255,255,255,.35)}.gamesentry .gstars i.on{color:#FFC93C;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.g-chip.hint{box-shadow:0 0 0 5px #FFC93C,0 0 18px 4px rgba(255,201,60,.5)}

.a2hs .wxtip{background:var(--yellow-l, #FFF3CF);border-radius:14px;padding:10px 12px;margin:8px 0;font-size:15px;color:var(--ink)}
.a2steps{display:grid;gap:10px;margin-top:8px}
.a2steps>div{background:var(--bg);border-radius:14px;padding:10px 12px}
.a2steps h3{font-size:15px;margin:0 0 4px}
.a2steps ol{margin:0;padding-left:20px;font-size:15px;line-height:1.7}
.ico-share{width:20px;height:20px;vertical-align:-4px;color:var(--blue)}
html[data-theme=dark] .a2hs .wxtip{background:#4A3B22}
.pathh{font-size:15px;color:var(--muted);text-align:center;margin:18px 0 8px;font-weight:800}
.rstats{display:flex;justify-content:center;gap:14px;margin:12px 0 6px}
.rstats div{background:var(--paper);border-radius:20px;box-shadow:0 4px 0 var(--line);padding:10px 16px;min-width:84px;display:flex;flex-direction:column;align-items:center}
.rstats b{font-size:34px;font-weight:900;color:var(--orange);display:flex;align-items:center;gap:4px;line-height:1.1}
.rstats span{font-size:14px;color:var(--muted);font-weight:800}
.rbtns{width:100%;margin-top:auto;padding-top:18px;display:flex;flex-direction:column;gap:10px}
.go:active{transform:translateY(4px);box-shadow:0 4px 0 var(--orange-d)}
.preview{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.preview span{min-width:52px;height:52px;border-radius:16px;background:var(--paper);box-shadow:0 3px 0 var(--line);display:grid;place-items:center;font-size:28px;padding:0 8px;font-family:var(--word-font);font-weight:700;color:var(--blue)}
.shelf{margin-top:auto;padding-top:14px}
.shelf .row{display:flex;gap:6px;overflow:hidden;align-items:center;font-size:26px;min-height:40px}
.shelf .row em{font-style:normal;font-size:14px;color:var(--muted);font-weight:800;margin-right:4px;white-space:nowrap}
.parentbtn{position:relative;overflow:hidden;font-size:14px;color:var(--muted);font-weight:800;width:auto;padding:0 12px}

.parentbtn.hold i{transition:width 1.2s linear;width:100%}

/* 学习卡 */
.card{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 16px 14px;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;overflow:hidden}

/* 小步快进：上一步 / 下一步 / 倍速 */
.pbar{display:flex;gap:10px;justify-content:center;align-items:center;flex-basis:100%;width:100%}

.pb .gl{font-size:22px;line-height:1}

.pb.rate{min-width:64px;font-family:var(--word-font);color:var(--blue)}
.pb.rate.fast{background:var(--blue);color:#fff;box-shadow:0 3px 0 #22457E}
.modal .pbar{position:relative;margin-top:12px;max-width:420px}
.modal{flex-direction:column}
.round{width:64px;height:64px;border-radius:50%;background:var(--blue-l);display:grid;place-items:center;flex:none;transition:transform .15s}
.round svg{width:30px;height:30px}
.round:active{transform:scale(.92)}
.round.playing{background:var(--blue);animation:ring 1s infinite}
.round.playing svg path{stroke:#fff}.round.playing svg path[fill="#2F5DA8"]{fill:#fff}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(47,93,168,.45)}100%{box-shadow:0 0 0 16px rgba(47,93,168,0)}}
.vidbtn{height:64px;border-radius:22px;background:#FFF0E0;color:var(--orange-d);font-weight:900;font-size:19px;padding:0 16px;display:flex;align-items:center;gap:6px;box-shadow:0 4px 0 #F4D3B4}
.vidbtn svg{width:26px;height:26px}
.next{width:84px;height:84px;border-radius:50%;background:var(--orange);display:grid;place-items:center;box-shadow:0 6px 0 var(--orange-d);margin-left:auto;transition:opacity .3s,transform .12s}
.next svg{width:42px;height:42px}
.next[disabled]{opacity:.3;pointer-events:none}
.relink{display:inline-flex;align-items:center;gap:6px;background:#FFF5D6;color:#8A5A00;font-weight:900;border-radius:999px;padding:6px 16px;margin-bottom:6px;font-size:17px}
.letterbig{display:flex;align-items:flex-end;justify-content:center;gap:14px;font-family:var(--word-font);font-weight:700;line-height:1}
.letterbig .lo{font-size:120px}
.letterbig .up{font-size:64px;opacity:.65;margin-bottom:14px}
.letterimg{width:100%;max-width:300px;aspect-ratio:4/3;margin:4px auto 0}
.letterimg img{width:100%;height:100%;object-fit:contain}
.badges{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.badge{border-radius:20px;padding:6px 16px;font-weight:900;font-size:24px;background:var(--blue-l);color:var(--blue);display:flex;align-items:center;gap:6px}
.badge.snd{background:#FFF0E0;color:var(--orange-d)}
.badge .en{font-family:var(--word-font);font-weight:600}
.tiles{display:flex;justify-content:center;gap:14px;margin:12px 0 4px;transition:gap .6s cubic-bezier(.2,.9,.3,1.3)}
.tiles.merge{gap:0}
.tile{width:84px;height:100px;border-radius:22px;background:var(--paper);box-shadow:0 5px 0 var(--line),0 0 0 3px var(--line) inset;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--word-font);font-weight:700;font-size:58px;line-height:1;color:var(--blue);transition:all .5s}
.tile small{font-family:var(--zh-font);font-size:15px;color:var(--muted);font-weight:800;margin-top:4px}
.tile.lit{background:var(--yellow);color:#fff;transform:translateY(-8px);box-shadow:0 5px 0 #E2A400}
.tiles.merge .tile{border-radius:0;box-shadow:0 5px 0 var(--line);background:#FFF5D6;color:var(--orange)}
.tiles.merge .tile:first-child{border-radius:22px 0 0 22px}.tiles.merge .tile:last-child{border-radius:0 22px 22px 0}
.tiles.merge .tile small{opacity:0}
.linkline{font-size:19px;font-weight:800;color:var(--blue);margin:4px 6px 0;text-wrap:balance}

/* 合上 */
.closebox{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.closebox .big{font-size:120px;animation:bob 1.4s ease-in-out infinite}
.closebox b{font-size:30px;font-weight:900}

/* 测验 */
.qcard{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 16px 18px;text-align:center;position:relative}
.qtop{display:flex;align-items:center;justify-content:center;gap:16px}
.qspk{width:96px;height:96px;border-radius:50%;background:var(--blue);display:grid;place-items:center;box-shadow:0 6px 0 var(--blue-d)}
.qspk svg{width:48px;height:48px}
.qspk svg path{fill:#fff;stroke:#fff}
.qspk.playing{animation:ring 1s infinite}
.qword{font-family:var(--word-font);font-weight:700;color:var(--blue);white-space:nowrap}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.opt{min-height:150px;border-radius:26px;background:var(--paper);box-shadow:0 6px 0 var(--line),0 0 0 3px var(--line) inset;transition:transform .12s,background .2s,box-shadow .2s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px 6px}
.opt .pic{font-size:72px;line-height:1.05;width:96px;height:96px;object-fit:contain;display:block}
.opt .pic.t{display:grid;place-items:center}
.preview span .pv{width:40px;height:40px;object-fit:contain;display:block}
.ipa{font-family:"DejaVu Sans","Lucida Sans Unicode","Arial Unicode MS","Segoe UI",sans-serif;font-weight:700}
.tip{margin:8px auto 0;max-width:340px;background:var(--paper2);border-radius:16px;padding:8px 12px;font-size:16px;font-weight:700;color:#7A5A2E;text-align:center;line-height:1.45}
button.badge{border:0;cursor:pointer}
button.tile{border:0;cursor:pointer;padding:0}
.stop.review .ic{background:#E7F0FF}
.stop .cnt.rvw{font-size:16px;color:var(--blue)}
.week{display:flex;gap:6px;align-items:flex-end;height:90px;margin:4px 0 12px}
.wb{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.wb i{display:block;width:70%;min-height:3px;background:var(--orange);border-radius:6px 6px 0 0}
.wb span{font-size:11px;color:var(--muted);font-weight:700}
.credits{overflow-x:auto}.credits table{border-collapse:collapse;font-size:12px;width:100%}.credits td,.credits th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
.opt .lab{font-size:16px;font-weight:800;color:var(--muted)}
.opt .let{font-family:var(--word-font);font-weight:700;font-size:96px;line-height:1}
.opt:active{transform:translateY(3px)}
.opt.right{background:var(--green-l);box-shadow:0 6px 0 #B7E2C7,0 0 0 4px var(--green) inset;animation:yay .5s}
.opt.wrong{background:var(--red-l);box-shadow:0 6px 0 #F5C2C2,0 0 0 4px var(--red) inset;animation:shake .45s}
.opt.dim{opacity:.35}
@keyframes yay{40%{transform:scale(1.08)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.fb{min-height:44px;margin-top:12px;font-size:28px;font-weight:900}
.fb.ok{color:var(--green)}.fb.no{color:var(--red)}
.flystar{position:fixed;z-index:60;width:54px;height:54px;pointer-events:none;transition:all .8s cubic-bezier(.5,-0.3,.6,1)}

/* 结果 */
.result{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center}
.bigstars{display:flex;justify-content:center;gap:6px;margin:10px 0;flex-wrap:wrap}
.bigstars svg{width:56px;height:56px;animation:starpop .5s backwards}
@keyframes starpop{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
.stickers{display:flex;justify-content:center;flex-wrap:wrap;gap:22px;margin:16px 0}
.stk{width:84px;height:84px;border-radius:50%;background:var(--paper);box-shadow:0 0 0 5px #fff,0 0 0 8px var(--yellow),0 8px 18px rgba(0,0,0,.12);display:grid;place-items:center;font-size:46px;animation:stick .6s backwards;font-family:var(--word-font);font-weight:700;color:var(--blue)}
.stk.miss{filter:grayscale(1);opacity:.5;box-shadow:0 0 0 5px #fff,0 0 0 8px #E0D3C0}
@keyframes stick{from{transform:scale(2) rotate(30deg);opacity:0}to{transform:none;opacity:1}}
.rtitle{font-size:32px;font-weight:900;margin:8px 0 0}

/* 视频弹窗 */
.modal{position:fixed;inset:0;z-index:80;background:rgba(20,20,35,.82);display:flex;align-items:center;justify-content:center;padding:16px;animation:enter .25s}
.modal video{max-width:100%;max-height:calc(100dvh - 190px);aspect-ratio:9/16;border-radius:24px;background:#000;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.modal .x{position:absolute;top:max(14px,env(safe-area-inset-top));right:14px;width:60px;height:60px;border-radius:50%;background:var(--paper);font-size:30px;font-weight:900;display:grid;place-items:center}
.tapme{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:70;background:var(--blue);color:#fff;font-weight:900;font-size:20px;border-radius:999px;padding:14px 22px;box-shadow:0 6px 0 var(--blue-d)}

/* 家长/老师 */
.panel{background:var(--paper);border-radius:22px;box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.tabs button{flex:none;height:44px;border-radius:14px;padding:0 14px;background:var(--paper);box-shadow:0 0 0 2px var(--line) inset;font-weight:800;font-size:15px}
.tabs button.on{background:var(--blue);color:#fff;box-shadow:none}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{min-height:44px;border-radius:14px;padding:0 14px;background:var(--paper2);box-shadow:0 0 0 2px var(--line) inset;font-weight:800;font-size:15px}
.seg button.on{background:var(--blue-l);box-shadow:0 0 0 3px var(--blue) inset;color:var(--blue)}
.pick{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pick button{min-height:44px;border-radius:14px;padding:0 12px;background:var(--paper2);box-shadow:0 0 0 2px var(--line) inset;font-weight:700;font-size:15px;display:flex;align-items:center;gap:4px}
.pick button b{font-family:var(--word-font);font-weight:600;font-size:17px;color:var(--blue)}
.pick button.on{background:var(--green-l);box-shadow:0 0 0 3px var(--green) inset}
.pick button.seen:after{content:"✓";color:var(--green);font-weight:900;margin-left:2px}
.lst{display:flex;flex-direction:column;gap:10px}
.lst article{border:2px solid var(--line);border-radius:16px;padding:10px 12px;background:var(--paper2);font-size:14px}
.lst h3{margin:0 0 4px;font-family:var(--word-font);font-weight:600;font-size:20px;color:var(--blue);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lst p{margin:3px 0}
.st{font-family:var(--zh-font);font-size:12px;border-radius:999px;padding:2px 9px;font-weight:800}
.st.ok{background:var(--green-l);color:var(--green)}.st.wait{background:#FFF0E0;color:#B8601E}.st.ph{background:#EEE;color:#666}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px}
.field input{height:48px;border-radius:14px;border:2px solid var(--line);padding:0 12px;font-size:17px;font-family:inherit;background:var(--paper2);width:100%}
.count{font-family:var(--word-font);font-weight:700;font-size:64px;color:var(--orange);line-height:1}
.timer{position:absolute;left:0;top:0;height:7px;background:var(--yellow);width:0}
.timer.run{animation:fill var(--secs,10s) linear forwards}
@keyframes fill{to{width:100%}}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;z-index:90;animation:enter .3s}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
.rec{font-size:14px;border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}

@media (min-width:900px){
  .app{max-width:980px;padding-top:24px}
  .narrow{max-width:600px;margin:0 auto;width:100%}
  .card.learn.word{display:grid;grid-template-columns:1.1fr 1fr;grid-template-areas:"w w" "s t" "s c";column-gap:30px;align-items:center;padding:24px 34px}
  .card.learn.word .bigword{grid-area:w}
  .card.learn.word .scene{grid-area:s;max-width:none}
  .card.learn.word .txt{grid-area:t;align-self:end}
  .card.learn.word .ctrl{grid-area:c;align-self:start}
  .opts{grid-template-columns:repeat(4,1fr)}
}
@media (max-height:700px){.scene{max-width:270px}.letterimg{max-width:230px}.opt{min-height:120px}.opt .pic{font-size:58px;width:76px;height:76px}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

/* ---------- 兑换码 ---------- */
.gate{justify-content:center;align-items:center;padding:24px 8px 40px;text-align:center}
.gate .mascot{width:132px;height:132px;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.gate h1{margin:10px 0 4px;font-size:28px;font-weight:900}
.gate .sub{text-wrap:balance;margin:0 0 20px;color:var(--muted);font-size:17px;font-weight:700}
.gatecard{width:100%;max-width:420px;background:var(--paper);border-radius:var(--r);padding:22px 20px 20px;box-shadow:var(--shadow)}
.gatecard label{display:block;text-align:left;font-weight:900;font-size:15px;color:var(--muted);margin:0 0 8px 4px}
.codein{width:100%;height:68px;border-radius:20px;border:3px solid var(--line);background:var(--paper2);text-align:center;font-family:var(--word-font);font-weight:700;font-size:28px;letter-spacing:3px;color:var(--blue);text-transform:uppercase;outline:none;transition:border-color .15s,box-shadow .15s}
.codein:focus{border-color:var(--blue);box-shadow:0 0 0 5px var(--blue-l)}
.codein.bad{border-color:var(--red);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.gatecard .btn{margin-top:16px}
.gatemsg{min-height:24px;margin:12px 0 0;font-weight:800;font-size:15px;color:var(--red)}
.gatemsg.info{color:var(--blue)}
.gatehelp{max-width:420px;margin:18px auto 0;color:var(--muted);font-size:14px;line-height:1.7}
.gatehelp b{color:var(--ink);white-space:nowrap}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.5);border-top-color:#fff;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.gatebadges{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:0 0 18px}
.gatebadges span{background:var(--paper);border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px;box-shadow:0 3px 0 var(--line)}

/* ---------- 三轮学习 ---------- */
.passbar{display:flex;align-items:center;justify-content:center;gap:4px;margin:0 0 6px;flex-wrap:nowrap}
.passbar span{font-size:13px;font-weight:900;color:var(--muted);background:var(--paper);border-radius:999px;padding:3px 10px;box-shadow:0 2px 0 var(--line);white-space:nowrap;transition:all .25s}
.passbar span.on{background:var(--orange);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.12);transform:scale(1.06)}
.passbar span.done{color:var(--green,#3BB273)}
.passbar i{width:10px;height:3px;border-radius:2px;background:var(--line)}
.top .passbar+.dots{margin-top:0}
.qbig{font-family:var(--word-font);font-weight:700;font-size:96px;line-height:1;margin:4px 0}
.qmiss{display:flex;gap:6px;justify-content:center;font-family:var(--word-font);font-weight:700;font-size:58px;line-height:1.1;color:var(--blue)}
.qmiss .gap{min-width:44px;border-bottom:5px solid var(--orange);color:var(--orange);animation:bob 1.6s ease-in-out infinite}
.qpic{display:flex;justify-content:center;margin:8px 0 0}
.qpic .pic{width:96px;height:96px;object-fit:contain}
.qpic .pic.t{font-size:72px;line-height:96px;width:auto;height:auto}
.qpic.big .pic{width:160px;height:160px}
.qpic.big .pic.t{font-size:110px;line-height:160px}
.midcol{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.wordopt{min-height:84px}
.wordopt .w{font-family:var(--word-font);font-weight:700;color:var(--blue)}
.passintro .passitems{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px;max-width:360px}
.passintro .passitems span{background:var(--paper);border-radius:14px;padding:6px 14px;font-family:var(--word-font);font-weight:700;font-size:20px;box-shadow:0 3px 0 var(--line)}

/* ---------- 账号 ---------- */
.authcard{padding-top:14px}
.seg{display:flex;background:var(--bg,#FFF3E0);border-radius:999px;padding:5px;margin:0 0 16px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:11px 8px;font:inherit;font-weight:900;font-size:16px;color:var(--muted);cursor:pointer;transition:background .15s,color .15s}
.seg button.on{background:var(--paper);color:var(--blue);box-shadow:0 3px 0 var(--line)}
.fin{width:100%;height:54px;border-radius:16px;border:3px solid var(--line);background:var(--paper2);padding:0 14px;font:inherit;font-size:17px;font-weight:700;color:var(--ink);outline:none;margin:0 0 14px;transition:border-color .15s,box-shadow .15s;-webkit-appearance:none;appearance:none}
select.fin{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:32px}
.fin:focus{border-color:var(--blue);box-shadow:0 0 0 5px var(--blue-l)}
.fin.bad{border-color:var(--red);animation:shake .35s}
.frow{display:flex;gap:10px}.frow>div{flex:1;min-width:0}
.authcard .btn{margin-top:4px}
.whoami{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 14px;padding:10px 14px;background:var(--blue-l);border-radius:14px;font-weight:800;font-size:15px;color:var(--ink);text-align:left}
.whoami span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkbtn{border:0;background:none;color:var(--blue);font:inherit;font-weight:900;font-size:15px;cursor:pointer;white-space:nowrap;padding:4px}
/* 入口：两个大按钮 + 领码 */
.startcard{display:flex;flex-direction:column;gap:14px;padding:18px}
.bigchoice{display:flex;align-items:center;gap:16px;width:100%;min-height:92px;border-radius:24px;padding:12px 20px;text-align:left;font:inherit;color:#fff;cursor:pointer;transition:transform .12s}
.bigchoice:active{transform:translateY(3px)}
.bigchoice .em{font-size:40px;line-height:1}
.bigchoice b{display:block;font-size:24px;font-weight:900;line-height:1.2}
.bigchoice small{display:block;font-size:17px;font-weight:800;opacity:.92}
.bigchoice.open{background:var(--orange);box-shadow:0 6px 0 #C94E2A}
.bigchoice.login{background:var(--blue);box-shadow:0 6px 0 #22457E}
.askcard{margin-top:14px;padding:16px 18px;display:flex;flex-direction:column;align-items:center;gap:8px}
.askcard .asktxt{margin:0;font-weight:800;color:var(--muted)}
.btn.askbtn{width:100%;min-height:62px;background:#2AAE67;color:#fff;box-shadow:0 5px 0 #1E8A50;font-size:19px;font-weight:900;margin:0}
.trylink{font-size:16px;padding:8px}
.backlink{display:block;margin:-6px 0 6px -6px;font-size:16px}
.gatecard .gh{margin:0 0 14px;font-size:22px;font-weight:900;text-align:left}
.codeok{background:#E3F6EA;color:#1E7A48;border-radius:16px;padding:12px 14px;margin:0 0 16px;font-weight:800;text-align:left}
.codeok small{display:block;font-size:14px;color:#2E8B57;font-weight:700}
.qrmodal{position:fixed;inset:0;z-index:120;background:rgba(20,20,35,.72);display:flex;align-items:center;justify-content:center;padding:18px;animation:enter .25s}
.qrbox{width:100%;max-width:380px;background:var(--paper);border-radius:28px;padding:22px 20px 20px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.qrbox h2{margin:0 0 12px;font-size:22px;font-weight:900}
.qrbox img{width:100%;max-width:280px;aspect-ratio:1;border-radius:16px;display:block;margin:0 auto;background:var(--paper);-webkit-user-select:auto;user-select:auto;-webkit-touch-callout:default}
.qrbox .qrsay{margin:14px 0 4px;font-size:19px;font-weight:900;color:var(--ink)}
.qrbox .qrtip{margin:0 0 14px;font-size:13px;color:var(--muted)}
.trialtag{background:#E3F6EA;color:#1E7A48;font-weight:900;border-radius:999px;padding:6px 14px;font-size:15px}
.trialend{display:flex;flex-direction:column;align-items:center;gap:8px;margin:14px auto 0;max-width:420px;width:100%;text-align:center}

/* ---------- 自由选站 / 单元页 / 速览 ---------- */
button.stop{width:100%;text-align:left;border-radius:22px;transition:background .15s,transform .12s;font:inherit;color:inherit}
button.stop:active{transform:scale(.98)}
button.stop:hover{background:var(--paper2)}
.stop .chev{flex:none;width:36px;height:36px;border-radius:12px;background:#F6EEE2;display:grid;place-items:center;font-weight:900;color:var(--muted);font-size:20px}
.stop .rec{position:absolute;right:52px;top:6px;background:var(--orange);color:#fff;font-weight:900;font-size:12px;border-radius:999px;padding:2px 10px}
.freehint{text-align:center;font-size:14px;color:var(--muted);font-weight:800;margin:8px 0 0}
.mhead{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:flex;gap:14px;align-items:center;margin-bottom:12px}
.mhead .ic{width:68px;height:68px;border-radius:22px;display:grid;place-items:center;font-size:34px;background:var(--yellow);box-shadow:0 4px 0 #E2A400;font-family:var(--word-font);font-weight:700;flex:none}
.mhead h1{margin:0;font-size:24px;font-weight:900}.mhead .meta{flex:1;min-width:0}
.mact{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.mact .btn{min-height:58px;font-size:17px;white-space:nowrap;padding:0 10px;gap:6px}
.gtitle{font-weight:900;font-size:15px;color:var(--muted);margin:14px 4px 8px}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.icell{position:relative;background:var(--paper);border-radius:20px;box-shadow:0 4px 0 var(--line),0 0 0 2px var(--line) inset;min-height:96px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .12s}
.icell:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line),0 0 0 2px var(--line) inset}
.icell .lt{font-family:var(--word-font);font-weight:700;font-size:38px;line-height:1}
.icell .gi{width:48px;height:48px;object-fit:contain}
.icell .w{font-family:var(--word-font);font-weight:700;font-size:16px;color:var(--ink);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icell .st{position:absolute;top:5px;right:6px;width:20px;height:20px;border-radius:50%;font-size:12px;font-weight:900;display:grid;place-items:center;color:#fff}
.icell .st.ok{background:var(--green)}.icell .st.miss{background:var(--red)}.icell .st.seen{background:#E8D6BC}
.icell.next{box-shadow:0 4px 0 #E2A400,0 0 0 3px var(--yellow) inset}
.legend{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;font-size:13px;color:var(--muted);font-weight:800;margin:14px 0 4px}

.bnav .arrow{width:64px;height:64px;border-radius:50%;background:var(--paper);box-shadow:0 5px 0 var(--line);display:grid;place-items:center;font-size:30px;font-weight:900;color:var(--blue)}

@keyframes inL{from{opacity:0;transform:translateX(40px)}}@keyframes inR{from{opacity:0;transform:translateX(-40px)}}

.screen.rest{align-items:center;justify-content:center;text-align:center;padding:20px 8px 40px}
.restscene{position:relative;width:min(320px,82vw);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 70%,#CFE3C4 0,#E6EFD9 45%,var(--paper) 72%);display:grid;place-items:center;overflow:hidden;box-shadow:var(--shadow)}

    const base = type === 'letter' ? letters() : type === 'blend' ? blends() : words();
    if (!P0) return pick(base.filter(ok || (() => true)), n);
    const src = P0[type] || { mine: [], all: base };
    const good = x => base.includes(x) && (!ok || ok(x));
    const mine = src.mine.filter(good), rest = shuffle(src.all.filter(x => good(x) && !mine.includes(x)));
    return shuffle(mine.slice(0, n).concat(rest).slice(0, n));
  }
  const idOf = (type, d) => type === 'letter' ? 'L-' + d.letter : type === 'blend' ? d.id : 'W-' + d.word;
  function markWrong(id) { if (G && id && !G.wrong.includes(id)) G.wrong.push(id); }
  function markRight(id) { if (G && id && !G.right.includes(id) && !G.wrong.includes(id)) G.right.push(id); }

  function letterAudio(L) { return L.say || L.audio_en || L.audio; }
  function wordAudio(w) { return w.audio_en || w.audio; }
  const A = s => (H && H.asset ? H.asset(s) : s);
  function wordPic(w) {
    if (w.icon) return `<img src="${esc(A(w.icon))}" alt="">`;
    if (w.image && /\.(svg|png|webp|jpg)$/i.test(w.image)) return `<img src="${esc(A(w.image))}" alt="">`;
    return `<span class="emo">${esc(w.emoji || '❓')}</span>`;
  }
  function blendPic(b) {
    if (b.icon) return `<img src="${esc(A(b.icon))}" alt="">`;
    if (b.image && /\.(svg|png|webp|jpg)$/i.test(b.image)) return `<img src="${esc(A(b.image))}" alt="">`;
    return `<span class="emo">${esc(b.emoji || '🧩')}</span>`;
  }
  function keywordOf(L) {
    const kw = L.keyword;
    if (!kw) return null;
    const w = words().find(x => x.word === kw) || blends().find(x => x.word === kw);
    if (w) return { kind: 'word', d: w, pic: w.icon || w.image ? wordPic(w) : `<span class="emo">${esc(w.emoji || L.prop || '❓')}</span>` };
    // fallback: letter's own image / prop
    if (L.image) return { kind: 'img', pic: `<img src="${esc(A(L.image))}" alt="">`, label: kw };
    return { kind: 'emoji', pic: `<span class="emo">${esc(L.prop || '❓')}</span>`, label: kw };
  }

  const BCOLORS = ['#FF8FB1', '#3A8DDE', '#2EA868', '#FF8A3D', '#9C6ADE', '#F2643A', '#FFC93C'];

  function bind(host) { H = host; ensureCSS(); return RBG; }

  function setRoute(k) { if (H.setRoute) H.setRoute(k); }

  function lobby() {
    ensureCSS();
    G = null; locked = false;
    setRoute('games');
    if (H.leaveSession) H.leaveSession();
    const gate = H.gate ? H.gate() : { ok: true };
    if (gate.reason === 'cap') return capScreen(gate);
    const lockedAll = gate.reason === 'locked';
    const cards = CATALOG.map(g => `<button class="g-card ${lockedAll ? 'locked' : ''}" data-act="gstart" data-g="${g.id}" style="outline:3px solid ${g.color}22" aria-label="${esc(g.name)}：${esc(g.tip)}">
      <span class="ge" aria-hidden="true">${g.emoji}</span>
      <span class="gn">${esc(g.name)}</span>
      <span class="gt">${esc(g.tip)}</span>
    </button>`).join('');
    H.show(`${topbar(`<button class="ib" data-act="home" aria-label="回主页">✕</button>`)}
      <div class="g-lobby">
        <div class="g-hello">${H.mascot ? H.mascot() : '🐯'}<div class="say-bub">来玩小游戏！</div></div>
        ${lockedAll ? `<div class="g-lock"><span class="lk" aria-hidden="true">🔒</span><b>先学完今天的内容，就能玩啦！</b><button class="btn primary" data-act="glearn">▶ 去学习</button></div>` : `<p class="g-meta">今天还能玩 <b>${gate.left ?? '∞'}</b> 局 · 每局 1～3 颗⭐ · 攒 ${gate.need || 5} 颗开宝箱${starRow(gate)}</p>`}
        <div class="g-grid">${cards}</div>
        <p class="small" style="margin:4px 0 0;color:#B5651D">小游戏全部待审</p>
      </div>`, 'games lobby');
    later(() => { H.unlockAudio(); say([lockedAll ? ui('g_locked') : (ui('g_hello') || ui('g_pick'))]); }, 350);
  }

  function starRow(g) { const n = g.need || 5, b = g.bank || 0; return `<span class="g-bank" aria-label="宝箱进度 ${b}/${n}">${Array.from({ length: n }, (_, i) => `<i class="${i < b ? 'on' : ''}">★</i>`).join('')}🎁</span>`; }
  function capScreen(gate) {
    H.show(`${topbar(`<button class="ib" data-act="home" aria-label="回主页">✕</button>`)}
      <div class="g-donebox">
        <div class="g-eyes" aria-hidden="true">👀🌳</div>
        <div class="rtitle">今天玩够啦！</div>
        <p class="small" style="font-size:17px">今天已经玩了 ${gate.played} 局。<br>抬头看看窗外远远的地方，让眼睛休息一下，明天再玩！</p>
        <div class="g-btns"><button class="btn primary" data-act="home">回主页</button></div>
      </div>`, 'games cap');
    later(() => say([ui('g_cap')]), 350);
  }
  function start(id) {
    const meta = CATALOG.find(g => g.id === id);
    if (!meta || !H) return;
    const gate = H.gate ? H.gate() : { ok: true };
    if (!gate.ok) return lobby();
    ensureCSS();
    locked = false;
    setRoute('games');
    if (H.leaveSession) H.leaveSession();
    G = { id, meta, round: 0, total: 0, stars: 0, streak: 0, misses: 0, started: Date.now(), data: {}, wrong: [], right: [] };
    H.unlockAudio();
    const boot = {
      balloon: bootBalloon,
      listen: bootListen,
      memory: bootMemory,
      train: bootTrain,
      whack: bootWhack,
    }[id];
    if (!boot) return lobby();
    boot();
  }

  function scorebar() {
    return `<div class="g-score" aria-label="第 ${Math.min(G.round + 1, G.total)} / ${G.total} 题">${Array.from({ length: G.total }, (_, i) => `<i class="dot ${i < G.round ? 'on' : i === G.round ? 'cur' : ''}"></i>`).join('')}</div>`;
  }

  function shell(body, cls) {
    H.show(`${topbar(`<button class="ib" data-act="globby" aria-label="小游戏列表">✕</button>`)}
      <div class="g-stage ${cls || ''}">${scorebar()}${body}</div>`, 'games play');
  }

  async function onRight(extraSay) {
    G.stars++; G.streak++;
    const tier = G.streak >= 5 && G.streak % 5 === 0 ? 'streak5' : G.streak === 3 ? 'streak3' : 'ok';
    const grp = tier === 'streak5' ? 'streak5' : tier === 'streak3' ? 'streak3' : 'first';
    const clip = praise(grp) || ui('great1');
    await Promise.all([
      say([clip].concat(extraSay || [])),
      H.celebrateFx ? H.celebrateFx(tier) : Promise.resolve(),
    ]);
  }

  async function onWrong(replayList) {
    G.streak = 0; G.misses++;
    // 温和、短：「再听一遍，找找对的！」+ 目标读音（同时正确答案在发光），不超过 3 秒左右
    await say([ui('g_wrong') || ui('again')].concat(replayList || []).filter(Boolean));
  }

  async function finish() {
    locked = true;
    const done = G; G = null;
    const r = H.result ? H.result({ game: done.id, misses: done.misses, wrong: done.wrong, right: done.right }) : { stars: done.misses === 0 ? 3 : done.misses <= 2 ? 2 : 1, chests: 0, bank: 0, need: 5 };
    const stars = Array.from({ length: 3 }, (_, i) => `<span class="g-bigstar ${i < r.stars ? 'on' : ''}" style="animation-delay:${0.35 + i * 0.28}s">★</span>`).join('');
    const left = r.need - r.bank;
    H.show(`${topbar()}
      <div class="g-donebox">
        ${H.mascot ? H.mascot('style="width:110px;height:110px"') : ''}
        <div class="rtitle">${r.stars === 3 ? '全对通关！' : '通关啦！'}</div>
        <div class="g-stars3" aria-label="得到 ${r.stars} 颗星">${stars}</div>
        <p class="g-meta">${r.chests ? '🎁 星星攒够啦，开宝箱！' : `再得 <b>${left}</b> 颗⭐ 就能开宝箱`}${starRow(r)}</p>
        <div class="g-btns">
          <button class="btn primary" data-act="gstart" data-g="${done.id}">再玩一次</button>
          <button class="btn ghost" data-act="globby">别的小游戏</button>
          <button class="btn ghost" data-act="home">回主页</button>
        </div>
      </div>`, 'games done');
    const tok = done.started;
    await say([ui('g_done'), praise('round')].filter(Boolean));
    if (H.celebrateFx) await H.celebrateFx(r.stars === 3 ? 'all' : 'streak3', { text: '通关啦！', badge: '⭐'.repeat(r.stars) });
    for (let k = 0; k < r.chests; k++) if (H.giveChest) await H.giveChest('game');   // 星星攒够才开宝箱（通关本身不开）
    locked = false;
    return done;
  }

  /* ---------- 1. 字母气球 ---------- */
  function bootBalloon() {
    const rounds = poolOf('letter', 6, L => letterAudio(L));
    G.total = rounds.length; G.round = 0; G.data.rounds = rounds;
    nextBalloon();
  }
  function nextBalloon() {
    if (G.round >= G.total) return finish();
    locked = false;
    const ans = G.data.rounds[G.round];
    const distract = pick(letters().filter(L => L.letter !== ans.letter), 5);
    const opts = shuffle([ans].concat(distract)).map((L, i) => {
      const upper = Math.random() < 0.5;
      const ch = upper ? L.upper : L.letter;
      return { L, ch, upper, i };
    });
    G.data.cur = ans; G.data.opts = opts;
    const balloons = opts.map((o, i) => {
      const left = 6 + (i % 3) * 31 + (Math.random() * 4 - 2);
      const top = 8 + Math.floor(i / 3) * 42 + (Math.random() * 6);
      const col = BCOLORS[i % BCOLORS.length];
      return `<button class="g-balloon" data-act="gballoon" data-i="${i}" style="left:${left}%;top:${top}%;animation-delay:${(i * 0.18).toFixed(2)}s" aria-label="气球 ${esc(o.ch)}">
        <div class="blob" style="background:${col};border-top-color:${col};color:#fff">${esc(o.ch)}</div>
        <div class="str"></div>
      </button>`;
    }).join('');
    shell(`<div class="g-prompt">听！戳破这个字母的气球
      <button class="speak" data-act="greplay" aria-label="再听一遍">🔊 再听</button></div>
      <div class="g-sky" aria-label="气球天空">${balloons}</div>`, 'balloon');
    intro([ui('g_balloon'), letterAudio(ans)]);
  }
  async function tapBalloon(i, el) {
    if (!G || G.id !== 'balloon' || locked) return;
    const o = G.data.opts[i];
    if (!o) return;
    locked = true; cut();
    if (o.L.letter === G.data.cur.letter) {
      el.classList.add('popping'); markRight(idOf('letter', o.L));
      await onRight([ui('g_pop'), letterAudio(o.L)]);
      G.round++;
      later(nextBalloon, 280);
    } else {
      el.classList.add('wrong');
      const right = [...D.querySelectorAll('.g-balloon')].find(b => G.data.opts[+b.dataset.i].L.letter === G.data.cur.letter);
      if (right) right.classList.add('hint'); markWrong(idOf('letter', G.data.cur));
      await onWrong([letterAudio(G.data.cur)]);
      el.classList.remove('wrong');
      if (right) later(() => right.classList.remove('hint'), 900);
      locked = false;
    }
  }

  /* ---------- 2. 听音找图 ---------- */
  function bootListen() {
    const nb = H.pool ? Math.min(2, (H.pool().blend.mine || []).length) : 2;
    const rounds = shuffle(poolOf('word', 5 - nb, w => wordAudio(w)).map(d => ({ ...d, _t: 'word' })).concat(poolOf('blend', nb, b => wordAudio(b) && (b.icon || b.image)).map(d => ({ ...d, _t: 'blend' }))));
    G.total = rounds.length; G.round = 0; G.data.rounds = rounds;
    nextListen();
  }
  function nextListen() {
    if (G.round >= G.total) return finish();
    locked = false;
    const ans = G.data.rounds[G.round];
    const distract = pick(words().concat(blends().filter(b => b.icon || b.image)).filter(w => w.word !== ans.word && w.meaning !== ans.meaning), 3);
    const opts = shuffle([ans].concat(distract));
    G.data.cur = ans; G.data.opts = opts;
    const btns = opts.map((w, i) => `<button class="g-opt" data-act="glisten" data-i="${i}" aria-label="${esc(w.meaning || w.word)}">
      ${wordPic(w)}<span class="lab">${esc(w.meaning || '')}</span>
    </button>`).join('');
    shell(`<div class="g-prompt">听！哪个是它？
      <button class="speak" data-act="greplay" aria-label="再听一遍">🔊 再听</button></div>
      <div class="g-opts">${btns}</div>`, 'listen');
    intro([ui('g_listen'), wordAudio(ans)]);
  }
  async function tapListen(i, el) {
    if (!G || G.id !== 'listen' || locked) return;
    const w = G.data.opts[i];
    if (!w) return;
    locked = true; cut();
    const btns = [...D.querySelectorAll('.g-opt')];
    if (w.word === G.data.cur.word) {
      el.classList.add('right'); markRight(idOf(G.data.cur._t || 'word', G.data.cur));
      btns.forEach(b => b !== el && b.classList.add('dim'));
      await onRight([wordAudio(w)]);
      G.round++;
      later(nextListen, 280);
    } else {
      el.classList.add('wrong');
      const ri = G.data.opts.findIndex(x => x.word === G.data.cur.word);
      if (ri >= 0) btns[ri].classList.add('hint'); markWrong(idOf(G.data.cur._t || 'word', G.data.cur));
      await onWrong([wordAudio(G.data.cur)]);
      el.classList.remove('wrong');
      if (ri >= 0) later(() => btns[ri].classList.remove('hint'), 900);
      locked = false;
    }
  }

  /* ---------- 3. 翻牌配对 ---------- */
  function bootMemory() {
    // half letter↔keyword, half word picture↔word text
    const Lpairs = [];
    for (const L of poolOf('letter', 26)) {
      const kw = keywordOf(L);
      if (!kw) continue;
      Lpairs.push({
        key: 'L-' + L.letter,
        a: { kind: 'letter', html: `<span style="font-size:36px">${esc(L.upper)}</span>`, label: L.upper },
        b: { kind: 'pic', html: kw.pic, label: L.keyword || '' },
        audio: letterAudio(L), id: idOf('letter', L),
      });
      if (Lpairs.length >= 2) break;
    }
    const Wpairs = [];
    for (const w of poolOf('word', 42)) {
      if (!(w.image || w.icon || w.emoji)) continue;
      Wpairs.push({
        key: 'W-' + w.word,
        a: { kind: 'pic', html: wordPic(w), label: w.meaning || w.word },
        b: { kind: 'text', html: `<span style="font-size:22px">${esc(w.word)}</span>`, label: w.word },
        audio: wordAudio(w), id: idOf('word', w),
      });
      if (Wpairs.length >= 2) break;
    }
    const pairs = Lpairs.concat(Wpairs).slice(0, 4);
    const tiles = [];
    pairs.forEach((p, pi) => {
      tiles.push({ id: pi + 'a', pair: pi, face: p.a, audio: p.audio, item: p.id });
      tiles.push({ id: pi + 'b', pair: pi, face: p.b, audio: p.audio, item: p.id });
    });
    G.total = pairs.length; G.round = 0; // round = matched pairs
    G.data.tiles = shuffle(tiles);
    G.data.open = [];
    G.data.matched = new Set();
    renderMemory(true);
  }
  function renderMemory(first) {
    locked = false;
    const tiles = G.data.tiles.map((t, i) => {
      const on = G.data.open.includes(i) || G.data.matched.has(t.pair);
      const matched = G.data.matched.has(t.pair);
      return `<button class="g-tile ${on ? 'on' : ''} ${matched ? 'matched' : ''}" data-act="gflip" data-i="${i}" aria-label="${on ? esc(t.face.label || '卡片') : '翻牌'}">
        <div class="inner"><div class="face back">?</div><div class="face front">${t.face.html}</div></div>
      </button>`;
    }).join('');
    // scorebar uses matched count
    G.round = G.data.matched.size;
    shell(`<div class="g-prompt">翻开卡片，找出一对！
      ${first ? '' : ''}</div>
      <div class="g-board">${tiles}</div>`, 'memory');
    if (first) intro([ui('g_memory')]);
  }
  async function tapFlip(i) {
    if (!G || G.id !== 'memory' || locked) return;
    if (G.data.open.includes(i) || G.data.matched.has(G.data.tiles[i].pair)) return;
    if (G.data.open.length >= 2) return;
    cut();
    G.data.open.push(i);
    renderMemory(false);
    const t = G.data.tiles[i];
    say([t.audio]);
    if (G.data.open.length < 2) return;
    locked = true;
    const [i1, i2] = G.data.open;
    const a = G.data.tiles[i1], b = G.data.tiles[i2];
    if (a.pair === b.pair) {
      G.data.matched.add(a.pair); markRight(a.item);
      G.data.open = [];
      G.stars++;
      G.streak++;
      await say([ui('g_match'), praise('first') || ui('great1')]);
      if (H.celebrateFx && G.data.matched.size === G.total) { /* finish handles */ }
      else if (H.celebrateFx) await H.celebrateFx('ok');
      if (G.data.matched.size >= G.total) { G.round = G.total; return finish(); }
      locked = false;
      renderMemory(false);
    } else {
      G.streak = 0; G.misses++;
      // 重教：亮出第一张卡真正的那一对，再念一遍，然后都翻回去重来
      const mate = G.data.tiles.findIndex((x, k) => k !== i1 && x.pair === a.pair);
      const el = D.querySelector(`.g-tile[data-i="${mate}"]`);
      if (el) el.classList.add('on', 'hint');
      await say([praise('encourage') || ui('g_wrong'), a.audio, ui('g_again')]);
      later(() => { if (!G) return; G.data.open = []; locked = false; renderMemory(false); }, 700);
    }
  }

  /* ---------- 4. 拼词小火车 ---------- */
  function bootTrain() {
    const rounds = poolOf('blend', 4, b => b.letters && b.letters.length >= 2 && b.letters.length <= 4);
    G.total = rounds.length; G.round = 0; G.data.rounds = rounds;
    nextTrain();
  }
  function phonSeq(b) {
    // play each letter phoneme then the word
    const seq = [];
    (b.letters || []).forEach(ch => {
      const L = letters().find(x => x.letter === ch);
      if (L && L.phon) seq.push(L.phon);
    });
    seq.push(b.audio_en || b.audio);
    return seq;
  }
  function nextTrain() {
    if (G.round >= G.total) return finish();
    locked = false;
    const b = G.data.rounds[G.round];
    const need = b.letters.slice();
    // pool = correct letters + 2 distractors
    const extra = pick(letters().map(L => L.letter).filter(ch => !need.includes(ch)), 2);
    const pool = shuffle(need.concat(extra));
    G.data.cur = b;
    G.data.need = need;
    G.data.filled = [];
    G.data.pool = pool;
    G.data.used = new Set();
    renderTrain(true);
  }
  function renderTrain(first) {
    const b = G.data.cur;
    const slots = G.data.need.map((ch, i) => {
      const got = G.data.filled[i];
      return `<div class="g-slot ${got ? 'filled' : ''}" data-slot="${i}">${got ? esc(got) : ''}</div>`;
    }).join('');
    const chips = G.data.pool.map((ch, i) => {
      const used = G.data.used.has(i);
      return `<button class="g-chip ${used ? 'used' : ''}" data-act="gchip" data-i="${i}" ${used ? 'disabled' : ''} aria-label="字母 ${esc(ch)}">${esc(ch)}</button>`;
    }).join('');
    shell(`<div class="g-prompt">把字母摆上小火车！
      <button class="speak" data-act="greplay" aria-label="再听一遍">🔊 再听</button></div>
      <div class="g-trainwrap">
        <div class="g-target">${blendPic(b)}<div><b style="font-size:22px">${esc(b.meaning || b.word)}</b></div></div>
        <div class="g-cars"><span class="g-engine" aria-hidden="true">🚂</span>${slots}</div>
        <div class="g-pool">${chips}</div>
      </div>`, 'train');
    if (first) intro([ui('g_train')].concat(phonSeq(b)));
  }
  async function tapChip(i, el) {
    if (!G || G.id !== 'train' || locked) return;
    if (G.data.used.has(i)) return;
    const ch = G.data.pool[i];
    const pos = G.data.filled.length;
    const expect = G.data.need[pos];
    locked = true; cut();
    if (ch === expect) {
      G.data.filled.push(ch);
      G.data.used.add(i);
      // play that phoneme
      const L = letters().find(x => x.letter === ch);
      await say([L && L.phon ? L.phon : null]);
      if (G.data.filled.length >= G.data.need.length) {
        renderTrain(false); markRight(G.data.cur.id);
        await onRight(phonSeq(G.data.cur));
        G.round++;
        later(nextTrain, 400);
        return;
      }
      locked = false;
      renderTrain(false);
    } else {
      el.classList.add('wrong');
      const slot = D.querySelector(`.g-slot[data-slot="${pos}"]`);
      if (slot) slot.classList.add('bad');
      const L = letters().find(x => x.letter === expect); markWrong(G.data.cur.id);
      await onWrong([L && L.phon ? L.phon : null, G.data.cur.audio_en || G.data.cur.audio]);
      el.classList.remove('wrong');
      if (slot) slot.classList.remove('bad');
      // hint: highlight correct chip
      const hi = G.data.pool.findIndex((c, j) => c === expect && !G.data.used.has(j));
      if (hi >= 0) {
        const hb = D.querySelector(`.g-chip[data-i="${hi}"]`);
        if (hb) { hb.classList.add('hint'); later(() => hb.classList.remove('hint'), 1000); }
      }
      locked = false;
    }
  }

  /* ---------- 5. 打地鼠字母 ---------- */
  function bootWhack() {
    const rounds = poolOf('letter', 8, L => letterAudio(L));
    G.total = rounds.length; G.round = 0; G.data.rounds = rounds;
    nextWhack();
  }
  function nextWhack() {
    if (G.round >= G.total) return finish();
    locked = false;
    const ans = G.data.rounds[G.round];
    const distract = pick(letters().filter(L => L.letter !== ans.letter), 5);
    // 6 holes, one is answer
    const holes = shuffle([ans].concat(distract)).slice(0, 6);
    G.data.cur = ans; G.data.holes = holes;
    const cols = BCOLORS.slice();
    const html = holes.map((L, i) => {
      const col = cols[i % cols.length];
      const up = i < 4 || Math.random() < 0.7; // most up
      return `<button class="g-hole" data-act="gwhack" data-i="${i}" aria-label="地鼠 ${esc(L.upper)}">
        <div class="g-mole ${up ? 'up' : ''}" style="background:${col}">${esc(Math.random() < 0.5 ? L.upper : L.letter)}</div>
      </button>`;
    }).join('');
    shell(`<div class="g-prompt">听！点出这个字母
      <button class="speak" data-act="greplay" aria-label="再听一遍">🔊 再听</button></div>
      <div class="g-holes">${html}</div>`, 'whack');
    later(() => {
      // pop remaining moles up
      D.querySelectorAll('.g-mole:not(.up)').forEach((m, k) => later(() => m.classList.add('up'), 80 + k * 60));
    }, 280);
    intro([ui('g_whack'), letterAudio(ans)]);
  }
  async function tapWhack(i, el) {
    if (!G || G.id !== 'whack' || locked) return;
    const L = G.data.holes[i];
    if (!L) return;
    locked = true; cut();
    const mole = el.querySelector('.g-mole');
    if (L.letter === G.data.cur.letter) {
      if (mole) mole.classList.add('boom'); markRight(idOf('letter', L));
      await onRight([letterAudio(L)]);
      G.round++;

      el.classList.add('wrong');
      const ri = G.data.holes.findIndex(x => x.letter === G.data.cur.letter);
      const holes = [...D.querySelectorAll('.g-hole')];
      if (ri >= 0) holes[ri].classList.add('hint'); markWrong(idOf('letter', G.data.cur));
      await onWrong([letterAudio(G.data.cur)]);
      el.classList.remove('wrong');
      if (ri >= 0) later(() => holes[ri].classList.remove('hint'), 900);
      locked = false;
    }
  }

  /* ---------- events ---------- */
  function replay() {
    if (!G) return;
    H.unlockAudio();
    if (G.id === 'balloon') say([letterAudio(G.data.cur)]);
    else if (G.id === 'listen') say([wordAudio(G.data.cur)]);
    else if (G.id === 'train') say(phonSeq(G.data.cur));
    else if (G.id === 'whack') say([letterAudio(G.data.cur)]);
    else if (G.id === 'memory') say([ui('g_memory')]);
  }

  function handle(act, el) {
    if (!H) return false;
    switch (act) {
      case 'games': lobby(); return true;
      case 'globby': lobby(); return true;
      case 'gstart': start(el && el.dataset.g); return true;

      case 'greplay': replay(); return true;
      case 'gballoon': tapBalloon(+el.dataset.i, el); return true;
      case 'glisten': tapListen(+el.dataset.i, el); return true;
      case 'gflip': tapFlip(+el.dataset.i); return true;
      case 'gchip': tapChip(+el.dataset.i, el); return true;
      case 'gwhack': tapWhack(+el.dataset.i, el); return true;
      default: return false;
    }
  }

  function afterLessonBtn() {
    return `<button class="btn ghost" data-act="games" aria-label="玩个小游戏">🎮 玩个小游戏</button>`;
  }

  const RBG = {
    bind, lobby, start, handle, catalog: CATALOG, afterLessonBtn, ensureCSS,
    get state() { return G; },
    get busy() { return locked; },
  };
  W.RBG = RBG;
})();

/* ---------- 跟读（2026-10-22）：老师念 → 大麦克风 → 孩子念；出声就夸，没声音提示大声一点，两次没声音温和往下走 ---------- */

const MIC_SVG = '<svg viewBox="0 0 48 48" aria-hidden="true"><rect x="17" y="5" width="14" height="24" rx="7" fill="currentColor"/><path d="M11 22a13 13 0 0 0 26 0M24 35v7M17 42h14" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/></svg>';

function optionsFor(x){

  for (const y of picks) { if (out.length >= 3) break; if (!seen.has(pic(y)) && (x.type === 'letter' || y.d.meaning !== x.d.meaning)) { seen.add(pic(y)); out.push(y); } }

/* ---------- 彩带 ---------- */
function confetti(n = 160){
  if (!window.matchMedia || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.getElementById('confetti'), ctx = c.getContext && c.getContext('2d');
  if (!ctx) return;
  c.hidden = false; c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio; ctx.scale(devicePixelRatio, devicePixelRatio);
  const cols = ['#F2643A', '#FFC93C', '#2F5DA8', '#2EA868', '#FF8FB1'];
  const ps = Array.from({ length: n }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 80, y: innerHeight * .3, vx: (Math.random() - .5) * 13, vy: -Math.random() * 13 - 4, r: Math.random() * 6 + 4, c: cols[Math.floor(Math.random() * cols.length)], a: Math.random() * 6, va: (Math.random() - .5) * .3 }));
  const t0 = performance.now();
  (function tick(t){
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    ps.forEach(p => { p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore(); });
    if (t - t0 < 2800) requestAnimationFrame(tick); else { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, c.width, c.height); c.hidden = true; }
  })(t0);
}
