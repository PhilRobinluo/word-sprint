<!doctype html>
<html lang="zh-CN" data-theme-skin="candy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小游戏预览（待审）· 右脑记单词</title><meta name="robots" content="noindex">
<style>
:root{--mascot-src-cheer:"../assets/mascots/cheer.webp";--mascot-src-chest:"../assets/mascots/chest.webp";--mascot-src-game:"../assets/mascots/game.webp"}
:root{--bg:#F6EEDC;--paper:#FFF9EE;--ink:#3D3229;--muted:#6F6253;--line:#E7D9C1;--orange:#F2643A;--orange-d:#C94E2A;--r:28px;--shadow:0 8px 0 #E8D6BC}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"PingFang SC","Noto Sans SC",sans-serif}
#app{max-width:520px;margin:0 auto;min-height:100dvh;padding:12px 14px 40px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ib{border:0;background:var(--paper);border-radius:14px;width:44px;height:44px;font-weight:900;box-shadow:0 3px 0 var(--line);cursor:pointer}
.pill{display:inline-flex;align-items:center;gap:4px;background:var(--paper);padding:6px 12px;border-radius:999px;font-weight:800;box-shadow:0 3px 0 var(--line)}
.say-bub{background:var(--paper);border-radius:22px;padding:12px 16px;font-weight:900;font-size:20px;box-shadow:var(--shadow)}
.small{font-size:14px;color:var(--muted)}
.btn{font:inherit;font-weight:900;padding:12px 16px;border-radius:18px;border:0;cursor:pointer}
.btn.primary{background:var(--orange);color:#fff}.btn.ghost{background:var(--paper);box-shadow:0 4px 0 var(--line)}
.note{background:#FFF3CF;border-radius:14px;padding:10px 12px;margin:0 0 12px;font-size:14px;color:#6F6253;font-weight:700}
.mascot{width:76px;height:76px}
</style><link rel="stylesheet" href="../assets/candy-theme.css"><link rel="icon" type="image/png" href="../icons/favicon-32.png"></head><body>
<div class="note">🎮 小游戏预览 · 全部<strong>待审</strong>。不用登录。语音是临时旁白，以后会换成 罗老师的声音。点「主页」回到列表。</div>
<div id="app"></div>
<script src="../celebrate.js"></script>
<script src="../games.js"></script>
<script>
const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const later = (fn, ms) => setTimeout(fn, ms);
let C = null, A = new Audio(), seq = 0;
const play = src => new Promise(res => {
  if (!src) return res(false);
  const url = src.startsWith('audio/') || src.startsWith('img/') ? '../' + src : src;
  let done = false; const fin = ok => { if (done) return; done = true; res(ok); };
  A.onended = () => fin(true); A.onerror = () => fin(false);
  A.src = url; A.play().then(() => {}).catch(() => fin(false));
  setTimeout(() => fin(true), 8000);
});
async function say(list) {
  const tok = ++seq;
  for (const s of [].concat(list).filter(Boolean)) { if (tok !== seq) return false; await play(s); }
  return tok === seq;
}
const ui = k => (C.ui_audio && C.ui_audio[k]) || null;
const bags = {};
function praise(g) {
  const l = (C.praise && C.praise[g]) || [];
  if (!l.length) return null;
  if (!bags[g] || !bags[g].length) bags[g] = shuffle(l.slice());
  return bags[g].shift();
}
function show(html) { $app.innerHTML = `<section class="screen">${html}</section>`; }
function topbar(mid=''){ return `<div class="top"><span class="pill">⭐ 预览</span>${mid || ''}</div>`; }
const MASCOT = `<img class="mascot" data-mascot="game" src="../assets/mascots/game.webp" alt="罗老师" width="76" height="76">`;

Promise.all([
  fetch('../content/words.json').then(r => r.json()),
]).then(([words]) => {
  C = words;
  RBG.bind({
    show, say, play, ui, praise,
    giveChest: () => Promise.resolve(),
    celebrateFx: (tier, opts) => window.RBC ? RBC.celebrate({ tier, ...(opts||{}), sfx: '../audio/sfx/' + (tier==='ok'?'sparkle':tier==='streak3'?'cheer':'big') + '.mp3', sound: true }) : Promise.resolve(),
    hush: () => { seq++; A.pause(); },
    unlockAudio: () => { try { A.play().then(()=>A.pause()).catch(()=>{}); } catch(e){} },
    topbar, goHome: () => RBG.lobby(), leaveSession: () => {},
    later, content: () => C, it: () => null, P: () => ({ settings:{}, stars:0, album:{got:{}} }),
    ICON: {}, esc, shuffle, SFX: () => null, sfxOn: () => true, muted: () => false,
    setRoute: () => {}, asset: s => /^(img|audio)\//.test(s) ? '../' + s : s,
    mascot: (extra='') => MASCOT.replace('class="mascot"', 'class="mascot" ' + (extra||'')),
  });
  RBG.lobby();
});
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'home') { RBG.lobby(); return; }
  if (act && RBG.handle(act, b)) return;
});
</script></body></html>
